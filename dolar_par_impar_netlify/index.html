<style>

// @name         Dólar Par/Ímpar — Ponte API
// @namespace    julio.dolar
// @version      1.0
// @description  Deixa o acumulador (arquivo local) ler a API do doubledolar.com usando o seu login
// @include      file:///*dolar_par_impar*
// @grant        GM_xmlhttpRequest
// @connect      doubledolar.com
// @run-at       document-start
// ==/UserScript==
(function () {
  'use strict';
  function hello() { window.postMessage({ dd: 'hello', v: '1.0' }, '*'); }
  window.addEventListener('message', function (e) {
    var m = e.data; if (!m || typeof m !== 'object') return;
    if (m.dd === 'ping') hello();
    if (m.dd === 'req') {
      // só deixa passar pedidos para o doubledolar.com
      if (!/^https:\/\/([a-z0-9-]+\.)?doubledolar\.com\//i.test(m.url)) {
        window.postMessage({ dd: 'res', id: m.id, err: 'URL fora do doubledolar.com' }, '*'); return;
      }
      GM_xmlhttpRequest({
        method: 'GET', url: m.url, headers: { 'Accept': 'application/json' }, timeout: 30000,
        onload: function (r) { window.postMessage({ dd: 'res', id: m.id, status: r.status, text: r.responseText, final: r.finalUrl }, '*'); },
        onerror: function () { window.postMessage({ dd: 'res', id: m.id, err: 'falha de rede' }, '*'); },
        ontimeout: function () { window.postMessage({ dd: 'res', id: m.id, err: 'tempo esgotado' }, '*'); }
      });
    }
  });
  hello();
})();

// ---------- leitura flexível do JSON da API ----------
function findArray(j, depth = 0) {
  if (Array.isArray(j)) return j;
  if (!j || typeof j !== 'object' || depth > 3) return null;
  for (const k of ['data', 'ticks', 'results', 'result', 'items', 'history', 'rows', 'list']) if (j[k] !== undefined) { const a = findArray(j[k], depth + 1); if (a) return a; }
  for (const k in j) { const a = findArray(j[k], depth + 1); if (a && a.length && typeof a[0] === 'object') return a; }
  return null;
}
const pick = (o, ks) => { for (const k of ks) if (o[k] !== undefined && o[k] !== null && o[k] !== '') return o[k]; return undefined; };
function parseBR(d, h) { // 26/09/2026 + 14:03:22
  const m = String(d).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/); if (!m) return 0;
  const hh = String(h || '0:0:0').split(':').map(Number);
  return new Date(+m[3], +m[2] - 1, +m[1], hh[0] || 0, hh[1] || 0, hh[2] || 0).getTime();
}
function toMs(v) {
  if (v === undefined) return 0;
  if (typeof v === 'number') return v < 1e12 ? v * 1000 : v;
  const s = String(v).trim();
  if (/^\d+(\.\d+)?$/.test(s)) { const n = +s; return n < 1e12 ? n * 1000 : n; }
  if (/^\d{1,2}\/\d{1,2}\/\d{4}/.test(s)) return parseBR(s, s.split(' ')[1]);
  let t = Date.parse(s); if (isNaN(t)) t = Date.parse(s.replace(' ', 'T'));
  return isNaN(t) ? 0 : t;
}
function parityWord(v) {
  if (v === undefined || typeof v === 'object') return null;
  const s = String(v).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
  if (/^(even|par|green|verde|digiteven)$/.test(s)) return 0;
  if (/^(odd|impar|red|vermelho|digitodd)$/.test(s)) return 1;
  return null;
}
function normalize(arr) {
  let pipAuto = 0;
  const QK = ['quote', 'tick', 'price', 'value', 'spot', 'cotacao'];
  for (const o of arr) { const q = o && pick(o, QK); if (typeof q === 'number') { const s = String(q); const d = s.includes('.') ? s.split('.')[1].length : 0; if (d > pipAuto) pipAuto = d; } }
  const pip = cfg.pip > 0 ? cfg.pip : pipAuto;
  const out = [];
  for (const raw of arr) {
    if (!raw || typeof raw !== 'object') continue;
    const o = {}; for (const k in raw) o[k.toLowerCase()] = raw[k]; // chaves em minúsculo
    const q = pick(o, QK);
    let d = pick(o, ['digit', 'last_digit', 'lastdigit', 'digito', 'numero', 'number']);
    if (d !== undefined) { d = parseInt(d, 10); if (isNaN(d) || d < 0 || d > 9) d = undefined; }
    if (d === undefined && q !== undefined) {
      if (typeof q === 'string' && /\d$/.test(q.trim())) d = +q.trim().slice(-1);          // texto preserva o zero final
      else if (typeof q === 'number') d = Math.round(q * Math.pow(10, pip)) % 10;          // número: usa casas decimais
    }
    let p = parityWord(pick(o, ['result', 'paridade', 'parity', 'resultado', 'cor', 'color', 'side', 'type']));
    if (p === null && d !== undefined) p = d % 2;
    if (p === null) continue;
    let t = toMs(pick(o, ['epoch', 'timestamp', 'time', 'created_at', 'createdat', 'datetime', 'date']));
    if (!t && o.data !== undefined) t = o.horario !== undefined ? parseBR(o.data, o.horario) : toMs(o.data);
    let id = pick(o, ['id', 'tick_id', '_id']);
    id = id !== undefined && !isNaN(+id) ? +id : (t || null);
    if (id === null) continue;
    const s = String(pick(o, ['symbol', 'market', 'ativo', 'underlying', 'mercado']) || '');
    out.push({ id, t, d: d === undefined ? null : d, p, q: q === undefined ? '' : String(q), s });
  }
  return out;
}

// Grava no IndexedDB. Cada registro vai para o banco do próprio registro (x.s) ou para opt.bank.
// Nunca muda o banco selecionado sozinho e nunca mistura Double Dollar com Deriv.
async function ingest(list, opt = {}) {
  if (!list.length) return 0;
  const recs = list.map(x => { const b = x.s || opt.bank || cfg.bank; const o = { k: b + '|' + x.id, b, id: x.id, t: x.t, d: x.d, p: x.p, q: x.q, src: x.src || '' }; const sy = x.sym || bankSym(b); if (sy) o.sym = sy; const w = x.w || bankIntervalSec(b); if (w) o.w = w; if (x.te) o.te = x.te; return o; });
  await idbPut(recs);
  let novos = 0, mudouCfg = false;
  const lastId = S.all.length ? S.all.at(-1).id : -Infinity, meus = [], byBank = new Map();
  for (const r of recs) {
    if (r.b === cfg.ddBank && r.id < 1e12 && r.id > (+cfg.ddLastId || 0)) { cfg.ddLastId = r.id; mudouCfg = true; }
    if (!byBank.has(r.b)) byBank.set(r.b, []);
    byBank.get(r.b).push(r);
    if (r.b === cfg.bank && !opt.skipMem && !S.map.has(r.id)) { S.map.set(r.id, r); meus.push(r); novos++; }
  }
  if (mudouCfg) saveCfg();
  if (meus.length) {
    meus.sort((a, b) => a.id - b.id);
    if (meus[0].id > lastId) for (const r of meus) S.all.push(r);
    else S.all = [...S.map.values()].sort((a, b) => a.id - b.id);
  }
  if (!opt.skipMem) liveMerge(byBank);
  if ([...byBank.keys()].some(b => !S.banks.includes(b))) await refreshBanks();
  return novos;
}

let CLOCK_TIMER=null;
function updateClock(){
  const now=new Date();
  const hh=String(now.getHours()).padStart(2,'0');
  const mm=String(now.getMinutes()).padStart(2,'0');
  const ss=String(now.getSeconds()).padStart(2,'0');

  const el=$('#clockNow');
  if(el) el.textContent=`${hh}:${mm}:${ss}`;
  const ig=$('#intervalGlobalText');
  if(ig) ig.textContent=intervalSummary();

  // Próximo marco conforme o intervalo selecionado
  const s=now.getSeconds();
  const step=gameIntervalSec();
  let next=Math.floor(s/step)*step + step;
  if(next>60) next=60;
  const faltam=next-s;

  const nx=$('#clockNext');
  if(nx){
    const alvo = next===60
      ? `${String((now.getMinutes()+1)%60).padStart(2,'0')}:00`
      : `${mm}:${String(next).padStart(2,'0')}`;
    nx.textContent=`próximo ${step}s: ${faltam}s · ${alvo}`;
  }

  const dot=$('#clockDot');
  if(dot){
    dot.style.background = (s%step===0) ? 'var(--am)' : 'var(--g)';
  }
}

async function buscar() {
  if (S.busy) return; S.busy = true; status('Buscando…');
  let after = startId(), total = 0, novos = 0, fezFallback = false;
  try {
    for (let pg = 0; pg < cfg.pages; pg++) {
      const r = await getText(buildUrl(after));
      if (/^\s*<(!doctype|html)/i.test(r.text) || /\/login/i.test(r.final)) throw new Error('a API devolveu a página de login — entre no doubledolar.com neste mesmo navegador');
      if (r.status >= 400) throw new Error('HTTP ' + r.status);
      let j; try { j = JSON.parse(r.text); } catch (e) { S.raw = r.text.slice(0, 1500); throw new Error('a resposta não é JSON (veja a amostra em ⚙️ Fonte)'); }
      const arr = findArray(j) || [];
      S.raw = JSON.stringify(arr.length ? arr.slice(0, 3) : j, null, 1).slice(0, 3000);
      if (!arr.length) break;
      const out = normalize(arr);
      if (!out.length) throw new Error('não reconheci os campos dos ticks — veja a amostra em ⚙️ Fonte');
      const nvPrimary = await ingest(out, { bank: cfg.ddBank });
      novos += nvPrimary; total += out.length;
      if (nvPrimary > 0) lastPrimaryFresh = Date.now();
      const mx = out.reduce((m, x) => x.id > m ? x.id : m, 0);
      if (mx <= after) break;
      after = mx;
      if (arr.length < cfg.limit) break;
    }

    // Fallback: algumas APIs de terceiros param de responder corretamente ao after_id.
    // Se não chegou nada novo, pega uma página recente sem after_id.
    // O IndexedDB usa chave banco|id, então duplicados não são adicionados novamente.
    if (!novos) {
      try {
        const rr = await getText(buildRecentUrl());
        if (rr.status < 400 && !/^\s*<(!doctype|html)/i.test(rr.text)) {
          const jj = JSON.parse(rr.text);
          const aa = findArray(jj) || [];
          if (aa.length) {
            const oo = normalize(aa);
            if (oo.length) {
              const nv2 = await ingest(oo, { bank: cfg.ddBank });
              novos += nv2; total += oo.length; fezFallback = true;
              if (nv2 > 0) lastPrimaryFresh = Date.now();
              S.raw = JSON.stringify(aa.slice(0, 3), null, 1).slice(0, 3000);
            }
          }
        }
      } catch (_) {}
    }

    const extra = fezFallback ? ' · recente conferido' : '';
    status(`OK · ${num(total)} recebidos · ${num(novos)} novos${extra} · ${fmtH(Date.now())}`, 'ok');
    afterUpdate(novos > 0);
  } catch (e) {
    const cors = /failed to fetch|networkerror|load failed/i.test(e.message);
    status('Erro: ' + (cors ? 'bloqueio de CORS/login — instale a ponte Tampermonkey (aba ⚙️ Fonte)' : e.message), 'err');
    if (S.tab === 'fonte') fillRes();
  }
  S.busy = false;
}


// ---------- backup do Double Dollar: grava SÓ no banco do Double Dollar, nunca nos bancos DERIV R_100 ----------
function derivLastDigit(quote) {
  const n = Number(quote);
  if (!Number.isFinite(n)) return null;
  const dec = cfg.dvVerifiedSymbol ? (+cfg.dvVerifiedPip||derivPip) : derivPip;
  const m = n.toFixed(Math.max(0, Math.min(8, dec))).match(/(\d)\s*$/);
  return m ? +m[1] : null;
}
function derivFallbackNeeded() {
  if (!cfg.derivFallback || !cfg.autoOn) return false;       // só faz sentido com a busca do Double Dollar ligada
  return !lastPrimaryFresh || Date.now() - lastPrimaryFresh > 70000;
}
async function ingestDerivTick(tick) {
  if (!tick || !derivFallbackNeeded()) return;
  const epoch = +tick.epoch || 0; if (!epoch) return;
  const dt = new Date(epoch * 1000), sec = dt.getSeconds();
  if (sec % 20 !== 0) return;
  const bucket = String(epoch);
  if (bucket === derivSeenBucket) return;
  derivSeenBucket = bucket;
  const d = derivLastDigit(tick.quote); if (d == null) return;
  const x = { id: epoch * 1000 + 777, t: epoch * 1000, d, p: d % 2, q: String(tick.quote), s: cfg.ddBank, src: 'DERIV_BACKUP' };
  const nv = await ingest([x]);
  if (nv) { status(`⚠ Double Dollar parado · backup ${cfg.dvVerifiedSymbol||'CRASH1000'} gravando em "${cfg.ddBank}" · ${fmtH(x.t)}`, 'ok'); afterUpdate(true); }
}
function connectDerivFallback() {
  if (!cfg.derivFallback) return;
  try { if (derivWS) derivWS.close(); } catch(e) {}
  try {
    derivWS = new WebSocket('wss://ws.derivws.com/websockets/v3?app_id=1089');
    derivWS.onopen = () => {
      derivWS.send(JSON.stringify({active_symbols:'brief',req_id:901}));
      derivWS.send(JSON.stringify({ticks:(cfg.dvVerifiedSymbol||'CRASH1000'),subscribe:1,req_id:902}));
    };
    derivWS.onmessage = ev => {
      let j; try { j=JSON.parse(ev.data); } catch(e) { return; }
      if (j.msg_type==='active_symbols' && Array.isArray(j.active_symbols)) {
        const a=j.active_symbols.find(x => (x.symbol||x.underlying_symbol)===(cfg.dvVerifiedSymbol||'CRASH1000'));
        const pip=a?.pip_size ?? a?.pip;
        if (typeof pip === 'number' && pip > 0) { const ss=String(pip); derivPip = ss.includes('.') ? ss.split('.')[1].length : 0; }
      }
      if (j.msg_type==='tick' && j.tick) ingestDerivTick(j.tick);
    };
    derivWS.onclose = () => { clearTimeout(derivReconnect); if(cfg.derivFallback) derivReconnect=setTimeout(connectDerivFallback,15000); };
    derivWS.onerror = () => {};
  } catch(e) { clearTimeout(derivReconnect); derivReconnect=setTimeout(connectDerivFallback,15000); }
}

function computeWindow() {
  const [k, v] = cfg.janela.split(':'); let w = S.all;
  const baseT = S.all.at(-1)?.t || Date.now();

  if (k === 'n' && v !== 'all') {
    w = S.all.slice(-(+v));
  } else if (k === 'h') {
    const lim = baseT - (+v) * 3600e3;
    w = S.all.filter(x => x.t >= lim);
  } else if (k === 'd') {
    const lim = baseT - (+v) * 86400e3;
    w = S.all.filter(x => x.t >= lim);
  }

  S.win = w;
  S.C = w.map(x => x.p);

// ---------- padrões (usado na aba e no alerta) ----------
function padStats(C, L, G) {
  const M = new Map(), n = C.length;
  for (let i = L - 1; i < n - 1; i++) {
    let key = ''; for (let k = i - L + 1; k <= i; k++) key += C[k] ? 'V' : 'G';
    let o = M.get(key);
    if (!o) { o = { key, oc: 0, nx: [0, 0], lv: [Array(G + 1).fill(0), Array(G + 1).fill(0)], red: [0, 0], done: [0, 0] }; M.set(key, o); }
    o.oc++; o.nx[C[i + 1]]++;
    for (const X of [0, 1]) {
      let hit = -1, fechou = false;
      for (let l = 0; l <= G; l++) { const idx = i + 1 + l; if (idx >= n) break; if (C[idx] === X) { hit = l; break; } if (l === G) fechou = true; }
      if (hit >= 0) { o.lv[X][hit]++; o.done[X]++; } else if (fechou) { o.red[X]++; o.done[X]++; }
    }
  }
  const cur = n >= L ? C.slice(n - L).map(L2).join('') : '';
  const list = [...M.values()].map(o => {
    const gr = X => o.lv[X].reduce((a, b) => a + b, 0);
    const a = [o.done[0] ? gr(0) / o.done[0] : 0, o.done[1] ? gr(1) / o.done[1] : 0];
    const X = a[1] > a[0] ? 1 : 0;
    return { ...o, X, gr: gr(X), rd: o.red[X], ass: a[X], lvX: o.lv[X] };
  });
  return { list, cur };
}

// =================== GRADE DE JOGOS POR SEGUNDO ===================
// Cada jogo tem posição fixa no minuto: J1 = :00, J2 = :10 (em 10s), J3 = :20 …
// Se faltar um resultado, a casa fica vazia — os outros jogos NÃO andam de posição.
function slotSecOf(t, step = gameIntervalSec()) { const s = Math.floor(t / 1000); return s - (((s % step) + step) % step); }
function gridBuild(W, step = gameIntervalSec(), fromMs = 0) {
  let lo = Infinity, hi = -Infinity;
  for (const x of W) { if (!x || !x.t || x.t < fromMs) continue; const s = slotSecOf(x.t, step); if (s < lo) lo = s; if (s > hi) hi = s; }
  if (!isFinite(lo)) return null;
  const T0 = lo - (((lo % 3600) + 3600) % 3600);          // começo da hora do 1º jogo
  const len = Math.floor((hi - T0) / step) + 1;
  const P = new Int8Array(len).fill(-1), D = new Int8Array(len).fill(-1);
  for (const x of W) {
    if (!x || !x.t || x.t < fromMs) continue;
    const i = (slotSecOf(x.t, step) - T0) / step;
    if (P[i] < 0) { P[i] = x.p; D[i] = x.d == null ? -1 : x.d; }
  }
  return { T0, step, len, P, D, first: lo, last: hi };
}
function gIdx(G, T) { const i = (T - G.T0) / G.step; return (i >= 0 && i < G.len && i === Math.floor(i)) ? i : -1; }
function gAt(G, T) { const i = gIdx(G, T); return i < 0 ? -1 : G.P[i]; }
function gDig(G, T) { const i = gIdx(G, T); return i < 0 ? -1 : G.D[i]; }
// escada TS/G1/G2: h = em qual tentativa pagou (-1 = não pagou), k = quantas tentativas seguidas existem no banco
function gLadder(G, T, alvo, maxN = 2) {
  let k = 0;
  for (let g = 0; g <= maxN; g++) { const v = gAt(G, T + g * G.step); if (v < 0) break; k++; if (v === alvo) return { h: g, k }; }
  return { h: -1, k };
}
// 1 = green até o nível L · 0 = red · -1 = sem dado (falta de dado NÃO vira red)
function gResult(lad, L) { if (lad.h >= 0 && lad.h <= L) return 1; if (lad.k >= L + 1) return 0; return -1; }
const p2d = n => String(n).padStart(2, '0');
function hmsOf(T) { const d = new Date(T * 1000); return `${p2d(d.getHours())}:${p2d(d.getMinutes())}:${p2d(d.getSeconds())}`; }
function hmOf(T) { const d = new Date(T * 1000); return `${p2d(d.getHours())}:${p2d(d.getMinutes())}`; }
function msOf(off) { return `${p2d(Math.floor(off / 60) % 60)}:${p2d(off % 60)}`; }
const NIVEL = ['TS', 'G1', 'G2'];
function cellBall(G, T, showSec) {
  const v = gAt(G, T), d = gDig(G, T);
  const sec = showSec ? `<span class="ticktime">:${p2d(new Date(T * 1000).getSeconds())}</span>` : '';
  if (v < 0) return `<span class="tickitem"><span class="b bvazio" title="${hmsOf(T)} · sem dado">·</span>${sec}</span>`;
  return `<span class="tickitem"><span class="b ${v ? 'v' : 'g'}" title="${hmsOf(T)} · ${v ? 'ÍMPAR' : 'PAR'}">${d >= 0 ? d : ''}</span>${sec}</span>`;
}

// ---- 🧱 Sequência das colunas 10 (mesma coluna + mesmo segundo, de 10 em 10 min) ----
function c10Seq(G, col, j) {
  const step = G.step, A = [];
  let m = G.T0; // começo da hora → acha o 1º minuto desta coluna
  while (new Date(m * 1000).getMinutes() % 10 !== col) m += 60;
  for (; m + j * step <= G.last; m += 600) { const T = m + j * step, v = gAt(G, T); if (v >= 0) A.push({ T, v, d: gDig(G, T) }); }
  if (!A.length) return null;
  const last = A.at(-1);
  let len = 1;
  for (let i = A.length - 2; i >= 0; i--) { if (A[i + 1].T - A[i].T !== 600 || A[i].v !== last.v) break; len++; }
  let max = 1, cur = 1;
  for (let i = 1; i < A.length; i++) { cur = (A[i].T - A[i - 1].T === 600 && A[i].v === A[i - 1].v) ? cur + 1 : 1; if (cur > max) max = cur; }
  return { p: last.v, len, max, total: A.length, last: last.T, next: last.T + 600, items: A.slice(-Math.max(12, len)).reverse() };
}

// ---- 🕐 Horas pagantes: sinal = minuto + segundo exato (ex.: :30:10), hora após hora ----
function newLv() { return { n: 0, ok: 0, cur: 0, max: 0, run: 0, pos: [0, 0, 0], lastR: -1, hist: [] }; }
function hpScan(G, alvoFilter) {
  const step = G.step, gpm = 60 / step, out = [];
  for (let m = 0; m < 60; m++) for (let j = 0; j < gpm; j++) {
    const off = m * 60 + j * step;
    for (const alvo of [0, 1]) {
      if (alvoFilter !== 'all' && +alvoFilter !== alvo) continue;
      const L = [newLv(), newLv(), newLv()];
      for (let h = G.T0; h + off <= G.last; h += 3600) {
        const T = h + off; if (T < G.first) continue;
        const lad = gLadder(G, T, alvo, 2);
        for (let l = 0; l < 3; l++) {
          const r = gResult(lad, l); if (r < 0) continue;
          const o = L[l]; o.n++; o.lastR = r;
          if (r) { o.ok++; o.pos[lad.h]++; o.run++; if (o.run > o.max) o.max = o.run; } else o.run = 0;
          o.hist.push({ T, r, h: lad.h });
          if (o.hist.length > 24) o.hist.shift();
        }
      }
      for (const o of L) { o.cur = o.run; o.rate = o.n ? o.ok / o.n : 0; }
      out.push({ off, m, j, alvo, L });
    }
  }
  return out;
}
function hpNext(off) { const now = Math.floor(Date.now() / 1000); const h = now - (((now % 3600) + 3600) % 3600); let T = h + off; if (T <= now) T += 3600; return T; }
function hpOnde(o, off, step) { return [0, 1, 2].filter(g => o.pos[g]).map(g => `${NIVEL[g]} <b>:${msOf(off + g * step)}</b> ×${o.pos[g]}`).join(' · ') || '—'; }
function hpPills(o, off, step) {
  return o.hist.slice().reverse().map(x => {
    const hh = p2d(new Date(x.T * 1000).getHours()) + 'h';
    return x.r ? `<span class="hppill g">${hh} ✅ ${NIVEL[x.h]} :${msOf(off + x.h * step)}</span>` : `<span class="hppill v">${hh} ❌</span>`;
  }).join('');
}
// 🔁 retomada: pagou ≥ minRun horas seguidas, depois ficou k horas sem pagar e agora deu 1 green
// devolve quantas horas seguidas pagava antes da falha (0 = não é retomada)
function hpRetomada(o, k, minRun) {
  const r = o.hist.map(x => x.r), n = r.length;
  if (n < k + 2 || r[n - 1] !== 1) return 0;
  for (let i = n - 1 - k; i < n - 1; i++) if (r[i] !== 0) return 0;
  let run = 0; for (let i = n - 2 - k; i >= 0 && r[i] === 1; i--) run++;
  return run >= minRun ? run : 0;
}

function gameIntervalSec(){

function d5Ui(on,msg){

function d5ScheduleReconnect(){

function d5Connect(){
  if(!cfg.deriv5sOn) return;
  try{ D5_WS?.close(); }catch(e){}
  D5_WS=null; D5_PREVS={};           // nunca emenda um tick velho depois de uma queda
  d5Ui(false,'conectando…');
  const urls=DV_ENDPOINTS;
  let pos=0;
  const openNext=()=>{
    if(pos>=urls.length){ d5Ui(false,'falha na conexão'); d5ScheduleReconnect(); return; }
    const url=urls[pos++];
    let ws; try{ ws=new WebSocket(url); }catch(e){ openNext(); return; }
    let opened=false;
    const to=setTimeout(()=>{ if(!opened){ try{ws.close();}catch(e){} openNext(); } },8000);
    ws.onopen=()=>{
      opened=true; clearTimeout(to); D5_WS=ws; D5_PREVS={};
      d5Ui(true,'online · aguardando tick');
      try{ ws.send(JSON.stringify({active_symbols:'brief',req_id:55000})); }catch(e){}
      d5Syms().forEach((s,i)=>{ try{ ws.send(JSON.stringify({ticks:s,subscribe:1,req_id:55001+i})); }catch(e){} });
      setTimeout(()=>d5Backfill(false),1500);   // completa o que ficou sem capturar enquanto o HTML estava fechado
    };
    ws.onmessage=ev=>{
      let j; try{j=JSON.parse(ev.data);}catch(e){return;}
      if(j.msg_type==='active_symbols' && Array.isArray(j.active_symbols)){
        const P={...(cfg.symPip||{})};
        for(const a of j.active_symbols){ const s=a.symbol||a.underlying_symbol, p=a.pip??a.pip_size; if(s && typeof p==='number' && p>0){ const ss=String(p); P[s]=/e-(\d+)/i.test(ss)?+ss.match(/e-(\d+)/i)[1]:(ss.includes('.')?ss.split('.')[1].length:0); } }
        cfg.symPip=P; saveCfg(); return;
      }
      if(j.error || (Array.isArray(j.errors)&&j.errors.length)){ if(j.req_id===55000) return; d5Ui(false,'erro: '+(j.error?.message||j.errors?.[0]?.message||'API')); return; }
      const t=j.tick; if(!t) return;
      const epoch=+t.epoch, quote=+t.quote, sym=t.symbol||d5Syms()[0];
      if(!Number.isFinite(epoch)||!Number.isFinite(quote)) return;
      d5OnTick(epoch,quote,sym);
    };
    ws.onerror=()=>{ if(!opened){ clearTimeout(to); try{ws.close();}catch(e){} openNext(); } else d5Ui(false,'erro de conexão'); };
    ws.onclose=()=>{ if(D5_WS===ws) D5_WS=null; D5_PREVS={}; d5Ui(false,'reconectando…'); if(cfg.deriv5sOn) d5ScheduleReconnect(); };
  };
  openNext();
}
// jogos criados entre o tick anterior (prev) e o tick atual (cur) — só com ticks reais
function d5SlotsFromTicks(prev,cur,steps=D5_STEPS,sym='R_100'){
  const recs=[];
  for(const step of steps){
    const bank=d5BankName(step,sym), list=[];
    const lo=prev?prev.epoch:cur.epoch-1;
    for(let T=cur.epoch-(cur.epoch%step); T>lo && list.length<30; T-=step) list.push(T);
    for(const T of list.reverse()){
      const src = T===cur.epoch ? cur : (prev && prev.epoch<=T ? prev : null);
      if(!src) continue;
      const d=d5DigitFromQuote(src.quote,sym); if(d==null) continue;
      recs.push({id:T*1000,t:T*1000,d,p:d%2,q:String(src.quote),s:bank,sym,w:step,te:src.epoch,src:`DERIV_${sym}_LIVE`});
    }
  }
  return recs;
}
function d5OnTick(epoch,quote,sym='R_100'){
  const prev=D5_PREVS[sym];
  if(prev && epoch<=prev.epoch) return;                 // tick repetido ou fora de ordem: ignora
  const cur={epoch,quote};
  D5_PREVS[sym]=cur;
  const digit=d5DigitFromQuote(quote,sym);
  D5_TICKS[sym]={epoch,quote,digit,symbol:sym};
  D5_TOFF.push(epoch-Date.now()/1000); if(D5_TOFF.length>30) D5_TOFF.shift();
  D5_LAST_TICK=D5_TICKS[curSym()]||D5_TICKS[sym];
  if(typeof uoTickBus==='function') uoTickBus(sym,epoch,quote,digit);
  if(TK.sym===sym) srOnTick(epoch,quote);
  const recs=d5SlotsFromTicks(prev,cur,D5_STEPS,sym);
  if(!recs.length){ if(sym===curSym()) d5Ui(true,`${sym} ${digit} · ${quote} · ${new Date(epoch*1000).toLocaleTimeString('pt-BR')}`); return; }
  D5_Q=D5_Q.then(async()=>{
    try{
      await ingest(recs);
      const meu=recs.filter(r=>r.s===cfg.bank);
      const ult=meu.at(-1)||recs.at(-1);
      if(sym===curSym()||meu.length) d5Ui(true,`${sym} ${ult.d} · ${ult.q} · jogo ${formatEntryTime(ult.t)} · ${recs.map(r=>r.w+'s').filter((v,i,a)=>a.indexOf(v)===i).join(' ')}`);
      if(meu.length) afterUpdate(true); else if(S.tab==='deriv5s') fillRes();
      rbWatchNew();
      if(typeof uoOnSlots==='function') uoOnSlots(recs);
    }catch(e){ d5Ui(false,'erro ao gravar: '+(e.message||e)); }
  });
}
function d5RecsFromHistory(times,prices,from,to,steps=D5_STEPS,rule='before',srcTag='DERIV_HISTORY',sym='R_100'){
  const T=times.map(Number), recs=[];
  if(!T.length) return recs;
  to=Math.min(to,T.at(-1));
  for(const step of steps){
    for(let s=Math.ceil(from/step)*step; s<=to; s+=step){
      const y=hdlPick(T,prices,s,rule);
      if(!y || Math.abs(y.t-s)>Math.max(4,step)) continue;
      const d=d5DigitFromQuote(y.q,sym); if(d==null) continue;
      recs.push({id:s*1000,t:s*1000,d,p:d%2,q:String(y.q),s:d5BankName(step,sym),sym,w:step,te:y.t,src:srcTag});
    }
  }
  return recs;
}

function idbKeysRange(bank,fromMs,toMs){
  return new Promise(res=>{
    try{
      const r=IDBKeyRange.bound(bank+'|'+fromMs,bank+'|'+toMs);
      const q=DB.transaction('ticks').objectStore('ticks').getAllKeys(r);
      q.onsuccess=()=>res(q.result.map(k=>+String(k).split('|').pop()));

    }catch(e){ res([]); }

// registros completos de um banco dentro de um período (usa a chave "banco|id" — não lê o banco inteiro)
function idbRange(bank,fromMs,toMs){
  return new Promise(res=>{
    try{
      const a=String(Math.max(0,Math.floor(fromMs))).padStart(13,'0'), b=String(Math.floor(toMs)).padStart(13,'0');
      const q=DB.transaction('ticks').objectStore('ticks').getAll(IDBKeyRange.bound(bank+'|'+a,bank+'|'+b));
      q.onsuccess=()=>res(q.result.sort((x,y)=>x.id-y.id));
      q.onerror=()=>res([]);
    }catch(e){ res([]); }
  });
}
async function d5FindGaps(days,sym='R_100'){
  const now=Math.floor(Date.now()/1000), to=now-40, from=now-Math.round(days*86400);
  const ranges=[], falta={};
  for(const s of D5_STEPS){
    const bank=d5BankName(s,sym);
    const set=new Set(await idbKeysRange(bank,from*1000,to*1000));
    let a=null,b=null,n=0;
    for(let T=Math.ceil(from/s)*s;T<=to;T+=s){
      if(!set.has(T*1000)){ n++; if(a==null) a=T; b=T; }
      else if(a!=null){ ranges.push([a,b]); a=null; }
    }
    if(a!=null) ranges.push([a,b]);
    falta[s]=n;
  }
  ranges.sort((x,y)=>x[0]-y[0]);
  const M=[];
  for(const r of ranges){ const L=M.at(-1); if(L && r[0]<=L[1]+60) L[1]=Math.max(L[1],r[1]); else M.push([r[0],r[1]]); }
  return {ranges:M,falta,from,to};
}

      const G=await d5FindGaps(dias,sym);
      if(!G.ranges.length){ d5RepairLog(`${sym}: nada faltando nos últimos ${dias} dia(s)`); continue; }
      d5RepairLog(`${sym}: ${G.ranges.length} trecho(s) faltando · ${D5_STEPS.map(s=>`${s}s: ${num(G.falta[s])}`).join(' · ')}`);
      const partes=[];
      for(const [a,b] of G.ranges){ for(let x=a;x<=b;x+=6*3600) partes.push([x,Math.min(b,x+6*3600-1)]); }
      for(let i=0;i<partes.length;i++){
        const [a,b]=partes[i];
        d5RepairBox(`🧩 ${sym}: repondo ${fmtT(a*1000)} → ${hmsOf(b)} · parte ${i+1}/${partes.length} · ${num(gravados)} jogos repostos`,'rep-run');
        try{
          const h=await d5Hist(a-30,b+3,sym);
          const recs=d5RecsFromHistory(h.times||[],h.prices||[],a,b,D5_STEPS,'before',`DERIV_${sym}_REPOSTO`,sym);
          if(recs.length){ await ingest(recs); gravados+=recs.length; }
          else { erros++; d5RepairLog(`${sym}: Deriv não devolveu ticks para ${fmtT(a*1000)} → ${hmsOf(b)}`); }
        }catch(e){ erros++; d5RepairLog(`${sym}: erro em ${fmtT(a*1000)} → ${hmsOf(b)}: ${e.message||e}`); }
        if(i<partes.length-1) await new Promise(r=>setTimeout(r,700));
      }
      for(const s of D5_STEPS) LIVE[d5BankName(s,sym)]=await idbTail(d5BankName(s,sym),LIVE_CAP);
      const G2=await d5FindGaps(dias,sym);
      resto+=D5_STEPS.reduce((t,s)=>t+G2.falta[s],0);
      gapsAll.push(...G2.ranges);
    }
    D5_REPAIR.gaps=gapsAll;
    if(!gravados && !erros){ d5RepairBox(manual?`✅ Nenhum resultado faltando nos últimos ${dias} dia(s)`:'','rep-ok'); if(!manual) setTimeout(()=>{ if(!D5_REPAIR.running && D5_REPAIR.msg.startsWith('✅')) d5RepairBox(''); },8000); return; }
    await loadBank(); fillRes();
    d5RepairLog(`repostos ${num(gravados)} jogos · ainda faltam ${num(resto)}`);
    if(resto && erros) d5RepairBox(`⚠ Repostos ${num(gravados)} jogos, mas ${num(resto)} ainda faltam (a Deriv não respondeu). Tenta de novo em 10 min ou clique em 🧩 na aba ⚡ Deriv.`,'rep-err');
    else d5RepairBox(`✅ ${num(gravados)} resultados repostos · banco completo nos últimos ${dias} dia(s)`,'rep-ok');
    status(`🧩 Reposição: ${num(gravados)} jogos repostos`,'ok');
  }catch(e){
    d5RepairLog('falhou: '+(e.message||e));
    d5RepairBox('⚠ Não consegui repor os resultados: '+(e.message||e)+' — nova tentativa em 10 min.','rep-err');
  }finally{ D5_REPAIR.running=false; }
}

function idbTail(b,n){
  return new Promise(res=>{
    const out=[];
    try{
      const q=DB.transaction('ticks').objectStore('ticks').index('b').openCursor(IDBKeyRange.only(b),'prev');
      q.onsuccess=()=>{ const c=q.result; if(c && out.length<n){ out.push(c.value); c.continue(); } else res(out.sort((a,b)=>a.id-b.id)); };
      q.onerror=()=>res(out);
    }catch(e){ res(out); }
  });
}
async function liveSeed(){

  for(const sym of d5Syms()) for(const s of D5_STEPS) banks.add(d5BankName(s,sym));

  if(typeof UOB!=='undefined') for(const rb of UOB) banks.add(d5BankName(rb.w,rb.sym));
  for(const b of banks){ if(!LIVE[b]) LIVE[b]=await idbTail(b,LIVE_CAP); }
}

function liveMerge(byBank){
  for(const [b,arr] of byBank){
    if(!LIVE[b]) continue;
    const L=LIVE[b];
    const lastId=L.length?L.at(-1).id:-Infinity;
    arr.sort((a,c)=>a.id-c.id);
    if(arr[0].id>lastId){ for(const r of arr) L.push(r); }
    else { const M=new Map(L.map(r=>[r.id,r])); for(const r of arr) M.set(r.id,r); LIVE[b]=[...M.values()].sort((a,c)=>a.id-c.id); }
    if(LIVE[b].length>LIVE_CAP) LIVE[b]=LIVE[b].slice(-LIVE_CAP);
  }
}

function dvSleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

const DV_ENDPOINTS=[
  'wss://api.derivws.com/trading/v1/options/ws/public',
  'wss://ws.derivws.com/websockets/v3?app_id=1089',
  'wss://ws.binaryws.com/websockets/v3?app_id=1089'

let DV_ENDPOINT_OK='';

function dvTryEndpoint(url){
  return new Promise((resolve,reject)=>{
    let ws,done=false;
    const finishErr=(msg)=>{
      if(done)return; done=true;
      try{ws?.close();}catch(e){}
      reject(new Error(msg));
    };
    try{
      ws=new WebSocket(url);
      const to=setTimeout(()=>finishErr('tempo esgotado'),10000);
      ws.onopen=()=>{
        if(done)return;
        done=true; clearTimeout(to);
        resolve(ws);
      };
      ws.onerror=()=>{ clearTimeout(to); finishErr('falha WebSocket'); };
      ws.onclose=ev=>{
        if(!done){ clearTimeout(to); finishErr(`fechou antes de conectar (${ev.code||0})`); }
      };
    }catch(e){ finishErr(e.message||'erro ao abrir WebSocket'); }
  });
}

function dvAttachSocket(ws,url){
  DV_WS=ws; DV_ENDPOINT_OK=url;
  DV_WS.onmessage=ev=>{
    let j; try{j=JSON.parse(ev.data);}catch(e){return;}
    const id=j.req_id;
    if(id && DV_PENDING.has(id)){
      const o=DV_PENDING.get(id); DV_PENDING.delete(id);
      if(j.error || (Array.isArray(j.errors)&&j.errors.length)){
        const er=j.error || j.errors[0];
        const msg=er?.message||er?.code||'Erro Deriv';
        o.reject(new Error(msg));
      }
      else o.resolve(j);
    }
  };
  DV_WS.onerror=()=>{};
  DV_WS.onclose=()=>{ if(DV_WS===ws) DV_WS=null; };
  return DV_WS;
}

async function dvOpen(){
  if(DV_WS && DV_WS.readyState===WebSocket.OPEN) return DV_WS;
  try{DV_WS?.close();}catch(e){}
  DV_WS=null;

  const errs=[];
  for(const url of DV_ENDPOINTS){
    try{
      dvSetProgress(1,`Conectando à Deriv: ${url.includes('api.derivws.com')?'endpoint novo':'endpoint alternativo'}…`);
      const ws=await dvTryEndpoint(url);
      return dvAttachSocket(ws,url);
    }catch(e){
      errs.push(`${url}: ${e.message}`);
    }
  }
  throw new Error('Deriv: não foi possível conectar. '+errs.join(' | '));
}
async function dvReq(payload,timeout=15000){
  const ws=await dvOpen();
  const req_id=++DV_REQ;
  payload={...payload,req_id};
  return new Promise((resolve,reject)=>{
    const to=setTimeout(()=>{DV_PENDING.delete(req_id);reject(new Error('Deriv: resposta demorou demais'));},timeout);
    DV_PENDING.set(req_id,{
      resolve:j=>{clearTimeout(to);resolve(j);},
      reject:e=>{clearTimeout(to);reject(e);}
    });
    ws.send(JSON.stringify(payload));
  });
}
function dvSymCode(a){ return a.underlying_symbol || a.symbol || ''; }
function dvSymName(a){ return a.underlying_symbol_name || a.display_name || dvSymCode(a); }
function dvPipDecimals(a){
  const p=a.pip_size ?? a.pip;
  if(typeof p==='number' && p>0){
    const s=String(p);
    if(/e-(\d+)/i.test(s)) return +s.match(/e-(\d+)/i)[1];
    return s.includes('.') ? s.split('.')[1].length : 0;
  }
  return 2;
}
function dvIsSynthetic(a){
  const s=[a.market,a.submarket,a.subgroup,a.underlying_symbol_type,a.symbol_type,dvSymCode(a),dvSymName(a)].join(' ').toLowerCase();
  return /synthetic|derived|volatility|crash|boom|jump|step|range|drift|daily reset|dex|stp|rng/.test(s)
      || /^(r_|1hz|boom|crash|jd|stp)/i.test(dvSymCode(a));
}
function dvDigit(price,dec){
  const n=Number(price);
  if(!Number.isFinite(n)) return null;
  const s=n.toFixed(Math.max(0,Math.min(10,dec)));
  const m=s.match(/(\d)$/);
  return m?+m[1]:null;
}

async function dvHistoryRange(symbol,startSec,endSec){
  async function one(a,b,depth=0){
    if(DV_CANCEL || HDL_CANCEL) throw new Error('cancelado');

    let j;
    try{
      j=await dvReq({
        ticks_history:symbol,
        start:Math.floor(a),
        end:Math.floor(b),
        style:'ticks',
        adjust_start_time:1
      },25000);
    }catch(e){
      const msg=String(e?.message||e);
      // Se a API nova rejeitar algum campo opcional, tenta o formato mínimo.
      if(/validation|input|adjust_start_time|subscribe/i.test(msg)){
        j=await dvReq({
          ticks_history:symbol,
          start:Math.floor(a),
          end:Math.floor(b),
          style:'ticks'
        },25000);
      }else{
        throw e;
      }
    }

    const h=j.history||{};
    const times=(h.times||[]).map(Number);
    const prices=h.prices||[];

    // Se vier muito conteúdo, divide o intervalo para não perder ticks.
    if(times.length>=4900 && depth<6 && b-a>60){
      const mid=Math.floor((a+b)/2);
      const L=await one(a,mid,depth+1);
      await dvSleep(60);
      const R=await one(mid+1,b,depth+1);
      return {times:L.times.concat(R.times),prices:L.prices.concat(R.prices)};
    }
    return {times,prices};
  }
  return one(startSec,endSec,0);
}
function dvBuildMap(hist,dec){
  const M=new Map();
  for(let i=0;i<hist.times.length;i++){
    const t=+hist.times[i], d=dvDigit(hist.prices[i],dec);
    if(Number.isFinite(t)&&d!=null) M.set(t,{d,q:hist.prices[i]});
  }
  return M;
}
function dvCompareRows(rows,map,offset){
  let ok=0,miss=0;
  const diffs=[];
  for(const x of rows){
    const sec=Math.round(x.t/1000)+offset;
    const y=map.get(sec);
    if(!y){ miss++; continue; }
    if(y.d===x.d) ok++;
    else if(diffs.length<20) diffs.push({t:x.t,dd:x.d,dv:y.d,sec});
  }
  const compared=rows.length-miss;
  return {ok,miss,compared,total:rows.length,pct:compared?100*ok/compared:0,diffs};
}
function dvBestOffset(rows,map){
  let best=null;
  for(let off=-10;off<=10;off++){
    const r=dvCompareRows(rows,map,off);
    if(!best || r.ok>best.ok || (r.ok===best.ok && r.compared>best.compared)) best={...r,offset:off};
  }
  return best;
}
async function dvQuickScore(sym,rows){
  const code=dvSymCode(sym), dec=dvPipDecimals(sym);

  // Primeiro confirma que o símbolo realmente responde a ticks_history.
  const latest=await dvHistoryLatest(code,20);
  if(!latest.times.length) throw new Error('histórico vazio');

  // Depois busca exatamente o intervalo correspondente ao banco local.
  const start=Math.floor(rows[0].t/1000)-15, end=Math.floor(rows.at(-1).t/1000)+15;
  const hist=await dvHistoryRange(code,start,end);
  if(!hist.times.length) throw new Error('sem ticks no intervalo solicitado');

  const map=dvBuildMap(hist,dec);
  const best=dvBestOffset(rows,map);
  return {code,name:dvSymName(sym),dec,market:sym.market||'',latestN:latest.times.length,...best};
}
async function dvFullScore(candidate,rows,idx,total){
  const code=candidate.code, dec=candidate.dec;
  const map=new Map();
  const start=Math.floor(rows[0].t/1000)-20;
  const end=Math.floor(rows.at(-1).t/1000)+20;
  const chunk=30*60; // 30 minutos; auto divide se necessário
  let a=start,part=0,parts=Math.ceil((end-start)/chunk);
  while(a<=end){
    if(DV_CANCEL) throw new Error('cancelado');
    const b=Math.min(end,a+chunk-1);
    const hist=await dvHistoryRange(code,a,b);
    const mm=dvBuildMap(hist,dec);
    for(const [k,v] of mm) map.set(k,v);
    part++;
    const base=((idx)/total)*100;
    const span=(1/total)*100;
    dvSetProgress(base+span*(part/Math.max(1,parts)),
      `Verificando ${candidate.name}: bloco ${part}/${parts} · ${num(map.size)} ticks`);
    a=b+1;
    await dvSleep(50);
  }
  const r=dvCompareRows(rows,map,candidate.offset);
  return {...candidate,...r,map};
}

function dvBestNumberSequence(localDigits, derivDigits){
  // Procura a melhor coincidência sem usar data/hora.
  // Testa passos 1..30 entre ticks Deriv e todas as fases possíveis.
  let best={pct:0,ok:0,total:localDigits.length,step:1,phase:0,start:0,matched:[]};
  if(!localDigits.length || !derivDigits.length) return best;

  for(let step=1;step<=30;step++){
    for(let phase=0;phase<step;phase++){
      const sampled=[];
      for(let i=phase;i<derivDigits.length;i+=step) sampled.push(derivDigits[i]);

      if(sampled.length<Math.min(10,localDigits.length)) continue;

      // Alinha o final das sequências e também testa pequenas janelas de deslocamento.
      const maxShift=Math.min(250,Math.max(0,sampled.length-localDigits.length));
      const base=Math.max(0,sampled.length-localDigits.length);

      for(let sh=-maxShift;sh<=0;sh++){
        const start=Math.max(0,base+sh);
        const available=Math.min(localDigits.length,sampled.length-start);
        if(available<Math.min(20,localDigits.length)) continue;

        let ok=0;
        for(let j=0;j<available;j++){
          if(sampled[start+j]===localDigits[localDigits.length-available+j]) ok++;
        }
        const pct=100*ok/available;
        if(pct>best.pct || (pct===best.pct && ok>best.ok)){
          best={pct,ok,total:available,step,phase,start,
            matched:sampled.slice(start,start+available)};
        }
      }
    }
  }
  return best;
}

function dvLocalRowsForR100(n=1000){
  const N=Math.max(50,Math.min(5000,+n||1000));
  return S.all.filter(x=>x.t && x.d!=null && !/^DERIV/i.test(x.src||'')).slice(-N);
}

function dvTicksAround(times,prices,targetSec,window=3){
  const out=[];
  for(let i=0;i<times.length;i++){
    const dt=times[i]-targetSec;
    if(dt < -window) continue;
    if(dt > window) break;
    out.push({i,t:times[i],q:prices[i],delta:dt});
  }
  return out;
}

function dvPickTick(times,prices,targetSec,rule){
  const A=dvTicksAround(times,prices,targetSec,3);
  if(!A.length) return null;

  const exact=A.filter(x=>x.t===targetSec);
  const before=A.filter(x=>x.t<=targetSec);
  const after=A.filter(x=>x.t>=targetSec);

  if(rule==='exact_first') return exact[0]||null;
  if(rule==='exact_last') return exact.at(-1)||null;
  if(rule==='before_last') return before.at(-1)||null;
  if(rule==='after_first') return after[0]||null;
  if(rule==='nearest'){
    return [...A].sort((a,b)=>Math.abs(a.delta)-Math.abs(b.delta) || a.delta-b.delta)[0]||null;
  }
  return after[0]||null;
}

function dvRuleName(rule){
  return ({
    exact_first:'1º tick no segundo',
    exact_last:'último tick no segundo',
    before_last:'último tick antes/no horário',
    after_first:'1º tick no/depois do horário',
    nearest:'tick mais próximo'
  })[rule]||rule;
}

function dvCompareR100Offset(localRows,hist,dec,offset,rule){
  const times=hist.times||[], prices=hist.prices||[];
  let ok=0, miss=0;
  const comparedRows=[];
  for(const x of localRows){
    const d=new Date(x.t);
    const minuteStart=Math.floor(x.t/60000)*60;
    const sec=d.getSeconds();
    const bucket=sec<20?0:(sec<40?20:40);
    const target=minuteStart + bucket + offset;

    const y=dvPickTick(times,prices,target,rule);
    if(!y){ miss++; continue; }
    const dd=dvDigit(y.q,dec);
    if(dd===x.d) ok++;
    comparedRows.push({t:x.t,dd:x.d,dv:dd,target,real:y.t,delta:y.delta,q:y.q,rule});
  }
  const compared=comparedRows.length;
  return {offset,rule,ok,miss,compared,total:localRows.length,pct:compared?100*ok/compared:0,rows:comparedRows};
}

async function dvR100FetchForRows(rows){
  const start=Math.floor(rows[0].t/1000)-5;
  const end=Math.floor(rows.at(-1).t/1000)+25;
  const all={times:[],prices:[]};
  const chunk=20*60;
  let a=start, part=0, parts=Math.ceil((end-start)/chunk);
  while(a<=end){
    if(DV_CANCEL) throw new Error('cancelado');
    const b=Math.min(end,a+chunk-1);
    const h=await dvHistoryRange('R_100',a,b);
    all.times.push(...h.times);
    all.prices.push(...h.prices);
    part++;
    dvSetProgress(5+50*(part/Math.max(1,parts)),`R_100: baixando histórico ${part}/${parts}…`);
    a=b+1;
    await dvSleep(120);
  }
  return all;
}

async function dvMirrorBuild(){
  if(!cfg.dvVerifiedSymbol || cfg.dvVerifiedPct!==100){
    alert('Primeiro confirme um mercado em 100%.');
    return;
  }
  const rows=dvRowsForVerify();
  if(!rows.length)return;
  const btn=$('#dvMirror'); if(btn)btn.disabled=true;
  DV_CANCEL=false;
  try{
    const symbol=cfg.dvVerifiedSymbol, dec=+cfg.dvVerifiedPip||2, off=+cfg.dvVerifiedOffset||0;
    const start=Math.floor(rows[0].t/1000)-20+off;
    const end=Math.floor(rows.at(-1).t/1000)+20+off;
    const map=new Map();
    const chunk=30*60;
    let a=start,part=0,parts=Math.ceil((end-start)/chunk);
    while(a<=end){
      if(DV_CANCEL) throw new Error('cancelado');
      const b=Math.min(end,a+chunk-1);

      a=b+1;

    }

    const recs=[];
    for(const x of rows){
      const sec=Math.round(x.t/1000)+off;

      recs.push({
        id:Math.round(x.t)+9900000000000,
        t:x.t,

  }finally{
    if(btn)btn.disabled=false;
  }
}



function d5MinuteGroups(W){
  const M=new Map();
  for(const x of W){
    const d=new Date(x.t);
    const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    if(!M.has(key)) M.set(key,[]);
    M.get(key).push(x);
  }
  const arr=[...M.entries()].map(([key,items])=>{
    items.sort((a,b)=>a.t-b.t);
    return {key,items,t:items[0]?.t||0};
  });
  arr.sort((a,b)=>b.t-a.t);
  return arr;
}

  const isCur=(Date.now()-g.t)>=0 && (Date.now()-g.t)<(gameIntervalSec()*1000+700);

function d5MinuteHtml(group){
  const bySec=new Map();
  const slots=gameSeconds();
  const step=gameIntervalSec();
  for(const g of group.items){

    const bucket=Math.floor(s/step)*step;
    if(slots.includes(bucket) && !bySec.has(bucket)) bySec.set(bucket,g);

}

async function ddFetchLimit(limit,afterId){
  const u=new URL('https://doubledolar.com/histocal/ticks');
  u.searchParams.set('limit',limit);
  u.searchParams.set('after_id',afterId);
  u.searchParams.set('_cb',Date.now());

  // Usa a MESMA rota do coletor principal:
  // ponte Tampermonkey quando disponível; fetch/proxy apenas como fallback.
  const r=await getText(u.toString());

  if(/^\s*<(!doctype|html)/i.test(r.text) || /\/login/i.test(r.final||'')){
    throw new Error('API devolveu login — verifique se a ponte Tampermonkey está ativa e se você está logado no Double Dollar');
  }
  if(r.status>=400) throw new Error(`HTTP ${r.status}`);

  let j;
  try{ j=JSON.parse(r.text); }
  catch(e){ throw new Error('resposta não é JSON'); }

  const arr=findArray(j) || [];
  return {
    limit,
    count:arr.length,
    firstId:arr.length ? +(pick(arr[0],['id','tick_id','tickId'])||0) : 0,
    lastId:arr.length ? +(pick(arr.at(-1),['id','tick_id','tickId'])||0) : 0,
    raw:j
  };
}

let HDL_CANCEL=false;
let HDL_LAST={};

function hdlBankName(step){
  return `DERIV R_100 · ${step}s`;
}
function hdlSetProgress(pct,msg){
  const b=document.querySelector('#hdlProg i');
  if(b && pct!=null) b.style.width=`${Math.max(0,Math.min(100,pct))}%`;
  const s=$('#hdlStatus');
  if(s) s.textContent=msg||'';
}
function hdlPickAtOrBefore(times,prices,target){
  let lo=0,hi=times.length-1,ans=-1;
  while(lo<=hi){
    const mid=(lo+hi)>>1;
    if(times[mid]<=target){ans=mid;lo=mid+1;}else hi=mid-1;
  }
  return ans>=0?{t:times[ans],q:prices[ans],delta:target-times[ans]}:null;
}
function hdlPickAtOrAfter(times,prices,target){
  let lo=0,hi=times.length-1,ans=-1;
  while(lo<=hi){
    const mid=(lo+hi)>>1;
    if(times[mid]>=target){ans=mid;hi=mid-1;}else lo=mid+1;
  }
  return ans>=0?{t:times[ans],q:prices[ans],delta:times[ans]-target}:null;
}
function hdlPickNearest(times,prices,target){
  const a=hdlPickAtOrBefore(times,prices,target);
  const b=hdlPickAtOrAfter(times,prices,target);
  if(!a)return b;
  if(!b)return a;
  return a.delta<=b.delta?a:b;
}
function hdlPick(times,prices,target,rule){
  if(rule==='before') return hdlPickAtOrBefore(times,prices,target);
  if(rule==='after') return hdlPickAtOrAfter(times,prices,target);
  return hdlPickNearest(times,prices,target);
}
function hdlPeriodSeconds(v){
  return ({
    '1h':3600,'3h':10800,'6h':21600,'12h':43200,'24h':86400,
    '3d':259200,'5d':432000,'7d':604800,
    '10d':864000,'15d':1296000,'20d':1728000,'30d':2592000,
    '45d':3888000,'60d':5184000,'90d':7776000
  })[v]||86400;
}

    <div class="hdlcard"><div class="nota">De</div><div class="hdlbig">${HDL_LAST.first?fmtT(HDL_LAST.first):'—'}</div></div>

function hdlResumeKey(step,period,rule){
  return `dpi_hdl_resume_${step}s_${period}_${rule}`;
}
function hdlLoadResume(step,period,rule){
  try{
    const j=JSON.parse(localStorage.getItem(hdlResumeKey(step,period,rule))||'null');
    return j && typeof j==='object' ? j : null;
  }catch(e){ return null; }
}
function hdlSaveResume(step,period,rule,obj){
  try{ localStorage.setItem(hdlResumeKey(step,period,rule),JSON.stringify(obj)); }catch(e){}
}
function hdlClearResume(step,period,rule){
  try{ localStorage.removeItem(hdlResumeKey(step,period,rule)); }catch(e){}
}
function hdlWait(ms,msg=''){
  if(msg) hdlSetProgress(null,msg);
  return new Promise(r=>setTimeout(r,ms));
}
function hdlIsRateLimitError(e){
  const s=String(e?.message||e||'').toLowerCase();
  return /rate limit|too many|limit for ticks_history|throttl/.test(s);
}
async function hdlHistoryWithRetry(symbol,a,b,part,parts){
  const waits=[5000,10000,20000,40000,60000];
  let lastErr=null;
  for(let attempt=0;attempt<=waits.length;attempt++){
    if(HDL_CANCEL) throw new Error('cancelado');
    try{
      return await dvHistoryRange(symbol,a,b);
    }catch(e){
      lastErr=e;
      if(!hdlIsRateLimitError(e) || attempt>=waits.length) throw e;
      const w=waits[attempt];
      hdlSetProgress(
        5+40*(part/Math.max(1,parts)),
        `Rate limit da Deriv · aguardando ${Math.round(w/1000)}s · bloco ${part+1}/${parts} · tentativa ${attempt+2}`
      );
      await new Promise(r=>setTimeout(r,w));
    }
  }
  throw lastErr||new Error('falha no histórico');
}

async function hdlDownload(){
  HDL_CANCEL=false;
  const stepSel=$('#hdlStep')?.value||'all';
  const steps=stepSel==='all'?D5_STEPS:[+stepSel];
  const period=$('#hdlPeriod')?.value||'24h';
  const rule=$('#hdlRule')?.value||'before';
  const secSpan=hdlPeriodSeconds(period);
  const btn=$('#hdlBtn'); if(btn)btn.disabled=true;
  const rkStep=stepSel;
  try{
    const nowEnd=Math.floor(Date.now()/1000);
    let chunk;
    if(secSpan<=86400) chunk=2*3600;
    else if(secSpan<=7*86400) chunk=6*3600;
    else if(secSpan<=30*86400) chunk=12*3600;
    else chunk=24*3600;

    // retomada: vale por 12 horas depois de pausado
    const resume=hdlLoadResume(rkStep,period,rule);
    const podeRetomar=resume && resume.v===2 && (Date.now()-(+resume.ts||0))<12*3600e3 && resume.next<=resume.end;
    const start=podeRetomar?resume.start:nowEnd-secSpan;
    const end=podeRetomar?resume.end:nowEnd;
    let a=podeRetomar?resume.next:start;
    let procFrom=podeRetomar?resume.procFrom:start;
    let carry=podeRetomar&&Array.isArray(resume.carry)?resume.carry:[];
    let made=podeRetomar?(+resume.made||0):0, added=podeRetomar?(+resume.added||0):0;
    const totalParts=Math.ceil((end-start)/chunk);
    let part=Math.floor((a-start)/chunk);
    const HS=histSym();
    hdlSetProgress(2,podeRetomar?`Retomando · bloco ${part+1}/${totalParts}…`:`Iniciando ${HS} · ${period} · ${steps.map(s=>s+'s').join(', ')}…`);

    while(a<=end){
      if(HDL_CANCEL) throw new Error('cancelado');
      const b=Math.min(end,a+chunk-1);
      const hist=await hdlHistoryWithRetry(HS,a,b,part,totalParts);
      // junta o finalzinho do bloco anterior (precisa dele para o 1º jogo do bloco)
      const tt=carry.map(x=>x[0]).concat((hist.times||[]).map(Number));
      const pp=carry.map(x=>x[1]).concat(hist.prices||[]);
      const ultimo=b>=end;
      const lastTick=tt.length?tt.at(-1):b;
      const procTo=ultimo?end:Math.min(b,lastTick-5);
      if(procTo>=procFrom && tt.length){
        const recs=d5RecsFromHistory(tt,pp,procFrom,procTo,steps,rule,`DERIV_${HS}_HISTORY`,HS);
        made+=recs.length;
        added+=await ingest(recs);
        procFrom=Math.floor(procTo)+1;
      }
      carry=tt.slice(-20).map((t,i)=>[t,pp[pp.length-Math.min(20,tt.length)+i]]);
      part++; a=b+1;
      hdlSaveResume(rkStep,period,rule,{v:2,start,end,next:a,procFrom,carry,made,added,ts:Date.now()});
      hdlSetProgress(5+93*(part/Math.max(1,totalParts)),`${HS} · bloco ${part}/${totalParts} · ${num(made)} jogos gravados (${steps.map(s=>s+'s').join(', ')})`);
      if(a<=end) await new Promise(r=>setTimeout(r,1200));
    }
    if(!made) throw new Error('Nenhuma jogada pôde ser reconstruída.');
    HDL_LAST={step:steps.length>1?'todos':steps[0],sym:HS,bank:steps.map(s=>d5BankName(s,HS)).join(' · '),count:made,added,period,first:start*1000,last:end*1000,steps};
    hdlClearResume(rkStep,period,rule);
    if(steps.length===1){ cfg.derivInterval=steps[0]; cfg.bank=d5BankName(steps[0],HS); saveCfg(); }
    await loadBank(); await refreshBanks();
    for(const s of steps){ LIVE[d5BankName(s,HS)]=await idbTail(d5BankName(s,HS),LIVE_CAP); }
    hdlRenderLast(); fillRes();
    hdlSetProgress(100,`✅ ${num(made)} jogadas reconstruídas · ${period} · ${steps.map(s=>s+'s').join(', ')}`);
  }catch(e){
    if(e.message==='cancelado') hdlSetProgress(null,'Download pausado. O progresso foi salvo e pode ser retomado por até 12h.');
    else hdlSetProgress(null,'Erro: '+(e.message||e)+' — o progresso até aqui ficou salvo, clique de novo para retomar.');
  }finally{ if(btn)btn.disabled=false; }
}


let HMAX_RESULTS=[];
let HMAX_CANCEL=false;

function hmaxFmtDate(sec){
  if(!sec)return '—';
  return new Date(sec*1000).toLocaleString('pt-BR');
}
function hmaxRender(){
  const el=$('#hmaxResults'); if(!el)return;
  if(!HMAX_RESULTS.length){
    el.innerHTML='<div class="nota">Nenhum teste executado ainda.</div>';
    return;
  }
  el.innerHTML=`<div class="hmaxgrid">
    ${HMAX_RESULTS.map(r=>`<div class="hmaxcard ${r.ok?'ok':'no'}">
      <div class="hmaxdays">${r.days} dias</div>
      <div>${r.ok?'✅ disponível':'❌ sem retorno'}</div>
      <div class="nota">${r.ok?`${r.count} ticks · mais antigo ${hmaxFmtDate(r.oldest)}`:(r.error||'sem ticks')}</div>
    </div>`).join('')}
  </div>`;

  const oks=HMAX_RESULTS.filter(r=>r.ok);
  if(oks.length){
    const best=oks.sort((a,b)=>b.days-a.days)[0];
    el.innerHTML+=`<div class="panel" style="margin-top:10px">
      <b>Maior período confirmado nesta varredura:</b> ${best.days} dias.<br>
      <span class="nota">Tick mais antigo retornado nesse teste: ${hmaxFmtDate(best.oldest)}</span>
    </div>`;
  }
}

async function hmaxProbe(days){
  const end=Math.floor(Date.now()/1000) - days*86400;
  // pequena janela de 10 minutos ao redor da data-alvo
  const start=end-300;
  const stop=end+300;

  try{
    const h=await hdlHistoryWithRetry(histSym(),start,stop,0,1);
    const times=(h.times||[]).map(Number).filter(Number.isFinite);
    return {
      days,
      ok:times.length>0,
      count:times.length,
      oldest:times.length?Math.min(...times):0
    };
  }catch(e){
    return {days,ok:false,count:0,error:e.message||String(e)};
  }
}

async function hmaxDiscover(){
  HMAX_CANCEL=false;
  HMAX_RESULTS=[];
  hmaxRender();

  const btn=$('#hmaxBtn'); if(btn)btn.disabled=true;
  const st=$('#hmaxStatus');

  // progressão ampla sem fazer download pesado
  const tests=[7,15,30,60,90,120,180,270,365,540,730];

  try{
    for(let i=0;i<tests.length;i++){
      if(HMAX_CANCEL) throw new Error('cancelado');
      const d=tests[i];
      if(st) st.textContent=`Testando disponibilidade há ${d} dias (${i+1}/${tests.length})…`;

      const r=await hmaxProbe(d);
      HMAX_RESULTS.push(r);
      hmaxRender();

      // pausa preventiva para evitar rate limit
      if(i<tests.length-1) await new Promise(r=>setTimeout(r,1600));
    }

    const oks=HMAX_RESULTS.filter(r=>r.ok);
    if(st){
      if(oks.length){
        const best=oks.sort((a,b)=>b.days-a.days)[0];
        st.textContent=`Concluído. Histórico confirmado pelo menos até ${best.days} dias atrás.`;
      }else{
        st.textContent='Nenhum período testado respondeu com ticks.';
      }
    }
  }catch(e){
    if(st) st.textContent=e.message==='cancelado'?'Teste cancelado.':'Erro: '+(e.message||e);
  }finally{
    if(btn)btn.disabled=false;
  }
}

function hmaxCancel(){
  HMAX_CANCEL=true;
  const st=$('#hmaxStatus');
  if(st) st.textContent='Cancelando teste…';
}

function hfDayStarts(G){
  const out=[]; const d=new Date(G.first*1000); d.setHours(0,0,0,0);
  for(let i=0;i<400;i++){ const s=Math.floor(d.getTime()/1000); if(s>G.last) break; out.push(s); d.setDate(d.getDate()+1); }
  return out;
}
function hfNext(off){
  const d=new Date(); d.setHours(0,0,0,0);
  let T=Math.floor(d.getTime()/1000)+off;
  if(T*1000<=Date.now()){ d.setDate(d.getDate()+1); T=Math.floor(d.getTime()/1000)+off; }
  return T;
}
function hfWrap(o){ return {n:o.n,ok:o.ok,rate:o.n?100*o.ok/o.n:0,current:o.run,max:o.max,levels:{ts:o.pos[0],g1:o.pos[1],g2:o.pos[2]},hist:o.hist}; }
function hfScan(G,hourSel){
  const step=G.step, days=hfDayStarts(G), out=[];
  const hours=hourSel==='all'?[...Array(24).keys()]:[+hourSel];
  for(const h of hours) for(let m=0;m<60;m++) for(let s=0;s<60;s+=step){
    const off=h*3600+m*60+s;
    for(const alvo of [0,1]){
      const L=[newLv(),newLv(),newLv()];
      for(const D of days){
        const T=D+off; if(T<G.first||T>G.last) continue;
        const lad=gLadder(G,T,alvo,2);
        for(let l=0;l<3;l++){
          const r=gResult(lad,l); if(r<0) continue;
          const o=L[l]; o.n++;
          if(r){ o.ok++; o.pos[lad.h]++; o.run++; if(o.run>o.max) o.max=o.run; } else o.run=0;
          o.hist.push({T,r,h:lad.h}); if(o.hist.length>15) o.hist.shift();
        }
      }
      if(!L[2].n && !L[0].n) continue;
      out.push({off,slotKey:`${p2d(h)}:${p2d(m)}:${p2d(s)}`,alvo,ts:hfWrap(L[0]),g1:hfWrap(L[1]),g2:hfWrap(L[2])});
    }
  }
  return out;
}
function hfColor(alvo){ return alvo?'<span class="tag v">ÍMPAR</span>':'<span class="tag g">PAR</span>'; }
function hfMetric(o){
  if(!o.n)return '<span class="mu">—</span>';
  const cls=o.rate===100?'hf100':(o.rate<70?'hfpoor':'');
  return `<span class="${cls}"><b>${o.rate.toFixed(1)}%</b></span>`;
}

// =================== 💾 ARQUIVO DE JOGOS (guardar no PC e enviar de volta) ===================
// Formato compacto: para cada intervalo, o horário do 1º jogo (t0) e uma sequência de dígitos,
// um caractere por jogo ("-" = jogo sem dado). 15 dias de 20s ≈ 65 mil jogos ≈ 65 KB.
let ARQ_CANCEL=false;
const ARQ_FMT='dolar_par_impar_jogos';
function arqSet(pct,msg){
  const b=document.querySelector('#arqProg i'); if(b && pct!=null) b.style.width=`${Math.max(0,Math.min(100,pct))}%`;
  const s=$('#arqStatus'); if(s && msg) s.textContent=msg;
}
function arqPausar(){ ARQ_CANCEL=true; HDL_CANCEL=true; arqSet(null,'Pausando…'); }
function arqDec(u8){ let s=''; for(let i=0;i<u8.length;i+=8192) s+=String.fromCharCode.apply(null,u8.subarray(i,i+8192)); return s; }
function arqEnc(str,u8){ for(let i=0;i<str.length&&i<u8.length;i++) u8[i]=str.charCodeAt(i); }
function arqData(sec){ const d=new Date(sec*1000); return `${d.getFullYear()}-${p2d(d.getMonth()+1)}-${p2d(d.getDate())}`; }
function arqNome(bancos,de,ate){
  const st=bancos.map(b=>b.step+'s').join('-');
  return `deriv_R100_${st}_${Math.max(1,Math.round((ate-de)/86400))}dias_${arqData(de)}_a_${arqData(ate)}.json`;
}
function arqResumeKey(stepSel,dias){ return `dpi_arq_resume_${stepSel}_${dias}`; }

async function arqBaixar(){
  ARQ_CANCEL=false; HDL_CANCEL=false; DV_CANCEL=false;
  const stepSel=$('#arqStep')?.value||'20';
  const steps=stepSel==='all'?D5_STEPS:[+stepSel];
  const dias=+($('#arqDias')?.value||15);
  const gravar=!!$('#arqGravar')?.checked;
  const btn=$('#arqBtn'); if(btn) btn.disabled=true;
  const key=arqResumeKey(stepSel,dias);
  try{
    let R=null; try{ R=JSON.parse(localStorage.getItem(key)||'null'); }catch(e){}
    const pode=R && R.v===1 && Date.now()-(+R.ts||0)<12*3600e3 && R.next<=R.end;
    const now=Math.floor(Date.now()/1000);
    const end=pode?R.end:now-(now%60);
    const start=pode?R.start:end-dias*86400;            // múltiplo de 60 → serve para 5/10/15/20/30
    const buf={};
    for(const s of steps){ buf[s]=new Uint8Array(Math.floor((end-start)/s)+1).fill(45); if(pode&&R.dig&&R.dig[s]) arqEnc(R.dig[s],buf[s]); }
    let a=pode?R.next:start, procFrom=pode?R.procFrom:start, carry=pode&&Array.isArray(R.carry)?R.carry:[];
    let feitos=pode?(+R.feitos||0):0;
    const chunk=dias<=3?6*3600:12*3600;
    const total=Math.ceil((end-start)/chunk);
    let part=Math.floor((a-start)/chunk);
    const HS=histSym();
    arqSet(1,pode?`Retomando · bloco ${part+1}/${total}…`:`Baixando ${dias} dias do ${HS} · ${steps.map(s=>s+'s').join(', ')} · ${total} blocos…`);
    while(a<=end){
      if(ARQ_CANCEL) throw new Error('cancelado');
      const b=Math.min(end,a+chunk-1);
      const hist=await hdlHistoryWithRetry(HS,a,b,part,total);
      const tt=carry.map(x=>x[0]).concat((hist.times||[]).map(Number));
      const pp=carry.map(x=>x[1]).concat(hist.prices||[]);
      const ultimo=b>=end;
      const procTo=ultimo?end:Math.min(b,(tt.length?tt.at(-1):b)-5);
      if(procTo>=procFrom && tt.length){
        const recs=d5RecsFromHistory(tt,pp,procFrom,procTo,steps,'before',`DERIV_${HS}_ARQUIVO`,HS);
        for(const r of recs){ const s=+r.s.match(/(\d+)s$/)[1]; const i=(r.t/1000-start)/s; if(buf[s] && i>=0 && i<buf[s].length) buf[s][i]=48+r.d; }
        feitos+=recs.length;
        if(gravar && recs.length) await ingest(recs,{skipMem:true});
        procFrom=Math.floor(procTo)+1;
      }
      const k=Math.min(20,tt.length);
      carry=tt.slice(-k).map((t,i)=>[t,pp[pp.length-k+i]]);
      part++; a=b+1;
      try{ localStorage.setItem(key,JSON.stringify({v:1,start,end,next:a,procFrom,carry,feitos,ts:Date.now(),dig:Object.fromEntries(steps.map(s=>[s,arqDec(buf[s])]))})); }catch(e){}
      arqSet(2+95*(part/Math.max(1,total)),`Bloco ${part}/${total} · até ${fmtT(b*1000)} · ${num(feitos)} jogos`);
      if(a<=end) await new Promise(r=>setTimeout(r,1200));
    }
    const bancos=steps.map(s=>({banco:d5BankName(s,HS),step:s,t0:start,jogos:[...buf[s]].filter(c=>c!==45).length,digitos:arqDec(buf[s])}));
    const obj={formato:ARQ_FMT,versao:1,simbolo:HS,regra:'último tick até o segundo',criado:new Date().toISOString(),de:start,ate:end,bancos};
    baixar(arqNome(bancos,start,end),JSON.stringify(obj),'application/json');
    try{ localStorage.removeItem(key); }catch(e){}
    if(gravar){ for(const s of steps){ LIVE[d5BankName(s,HS)]=await idbTail(d5BankName(s,HS),LIVE_CAP); } await loadBank(); await refreshBanks(); fillRes(); }
    arqSet(100,`✅ Arquivo criado: ${bancos.map(b=>`${b.step}s ${num(b.jogos)} jogos`).join(' · ')} · ${fmtT(start*1000)} → ${fmtT(end*1000)}${gravar?' · também gravado no banco':''}. Salve no PC.`);
  }catch(e){
    if(e.message==='cancelado') arqSet(null,'⏸ Pausado. O que já baixou ficou guardado — clique em BAIXAR de novo (mesmo intervalo e período) para continuar, por até 12h.');
    else arqSet(null,'Erro: '+(e.message||e)+' — o progresso ficou guardado, clique de novo para continuar.');
  }finally{ if(btn) btn.disabled=false; }
}

  for(const s of steps){ LIVE[d5BankName(s)]=await idbTail(d5BankName(s),LIVE_CAP); }
  await loadBank(); await refreshBanks(); fillRes();

// grava um arquivo no IndexedDB
async function arqImportObj(j){
  if(!j || j.formato!==ARQ_FMT || !Array.isArray(j.bancos)) throw new Error('arquivo não é do formato de jogos deste HTML');
  const totalJogos=j.bancos.reduce((s,b)=>s+(b.digitos||'').length,0);
  let feitos=0, gravados=0; const steps=[];
  for(const b of j.bancos){
    const str=String(b.digitos||''), step=+b.step, t0=+b.t0, banco=b.banco||d5BankName(step);
    if(!step||!t0) continue;
    if(bankIntervalSec(banco)) steps.push(step);
    for(let i=0;i<str.length;i+=20000){
      const recs=[];
      for(let k=i;k<Math.min(str.length,i+20000);k++){
        const c=str.charCodeAt(k); if(c<48||c>57) continue;
        const d=c-48, T=t0+k*step;
        recs.push({id:T*1000,t:T*1000,d,p:d%2,q:'',s:banco,src:'ARQUIVO'});
      }
      if(recs.length){ await ingest(recs,{skipMem:true}); gravados+=recs.length; }
      feitos+=Math.min(20000,str.length-i);
      arqSet(100*feitos/Math.max(1,totalJogos),`Gravando ${banco} · ${num(gravados)} jogos…`);
      await new Promise(r=>setTimeout(r,0));
    }
  }
  await arqRecarregar(steps);
  return gravados;
}
async function arqEnviar(files){
  if(!files||!files.length) return;
  let total=0;
  for(const f of files){
    try{
      arqSet(1,`Lendo ${f.name}…`);
      const j=JSON.parse(await f.text());
      total+=await arqImportObj(j);
    }catch(e){ arqSet(null,`Erro em ${f.name}: ${e.message||e}`); return; }
  }
  arqSet(100,`✅ ${num(total)} jogos enviados para o banco. Repetidos não duplicam. Já dá para usar em Horários Fixos, Horas Pagantes etc.`);
  status(`Arquivo importado: ${num(total)} jogos`,'ok');
}
// salva em arquivo o que já existe nos bancos DERIV (captura ao vivo + downloads)
async function arqSalvarBanco(){
  const bancos=[];
  let de=Infinity, ate=0;
  for(const s of D5_STEPS){
    arqSet(5+20*D5_STEPS.indexOf(s),`Lendo banco ${s}s…`);
    const rows=await idbBank(d5BankName(s));
    if(!rows.length) continue;
    let lo=Infinity,hi=-Infinity;
    for(const r of rows){ const T=slotSecOf(r.t,s); if(T<lo)lo=T; if(T>hi)hi=T; }
    const u8=new Uint8Array(Math.floor((hi-lo)/s)+1).fill(45);
    for(const r of rows){ if(r.d==null) continue; u8[(slotSecOf(r.t,s)-lo)/s]=48+(+r.d); }
    bancos.push({banco:d5BankName(s),step:s,t0:lo,jogos:rows.length,digitos:arqDec(u8)});
    de=Math.min(de,lo); ate=Math.max(ate,hi);
  }
  if(!bancos.length){ arqSet(null,'Os bancos DERIV R_100 estão vazios.'); return; }
  const obj={formato:ARQ_FMT,versao:1,simbolo:curSym(),regra:'último tick até o segundo',criado:new Date().toISOString(),de,ate,bancos};
  baixar(arqNome(bancos,de,ate).replace('deriv_R100','backup_banco_R100'),JSON.stringify(obj),'application/json');
  arqSet(100,`✅ Backup criado: ${bancos.map(b=>`${b.step}s ${num(b.jogos)}`).join(' · ')} jogos.`);
}

VIEWS.max = { nome: '📏 Máximas', res() {
  const W = S.win, C = S.C, n = C.length; if (!n) return vazio();
  const R = runs(C), cur = R.at(-1);
  const maxOf = c => R.filter(r => r.c === c).reduce((m, r) => r.len > m.len ? r : m, { len: 0 });
  const mV = maxOf(1), mG = maxOf(0), K = Math.max(mV.len, mG.len);
  const cnt = [Array(K + 2).fill(0), Array(K + 2).fill(0)];
  for (const r of R) if (r !== cur) cnt[r.c][r.len]++;       // sequência atual ainda aberta fica de fora

  </div>

// ---- 🔬 Scanner de padrões: número + pulo + até G2 / somas ----
function scEval(W, starts, alvo, skip=0, maxNivel=2) {
  let sg=0,g1=0,g2=0,red=0,aberto=0;
  maxNivel=Math.max(0,Math.min(2,+maxNivel||0));
  for (const ti of starts) {
    const base=ti+1+skip;
    if(base>=W.length){aberto++;continue;}
    let hit=-1, incompleto=false;
    for(let g=0;g<=maxNivel;g++){
      const idx=base+g;
      if(idx>=W.length){incompleto=true;break;}
      if(W[idx].p===alvo){hit=g;break;}
    }
    if(incompleto && hit<0){aberto++;continue;}
    if(hit===0)sg++;
    else if(hit===1)g1++;
    else if(hit===2)g2++;
    else red++;
  }
  const done=sg+g1+g2+red, gr=sg+g1+g2;
  return {sg,g1,g2,red,aberto,done,gr,rate:done?gr/done:0,maxNivel};
}
function scDigitStarts(W,d){const a=[];for(let i=0;i<W.length;i++)if(W[i].d===d)a.push(i);return a;}
function scScanDigits(W){
  const out=[], maxSkip=Math.max(0,Math.min(50,+cfg.sc_skip||0)), minOcc=Math.max(3,+cfg.sc_min||3);
  for(let d=0;d<=9;d++){
    const starts=scDigitStarts(W,d);
    for(let skip=0;skip<=maxSkip;skip++)for(const alvo of [0,1]){
      const s=scEval(W,starts,alvo,skip,+cfg.rb_auto_nivel||0);
      if(s.done>=minOcc)out.push({kind:'Número',d,gat:String(d),skip,alvo,...s});
    }
  }
  return out.sort((a,b)=>b.rate-a.rate||b.done-a.done);
}
function scSumMap(W,n){
  const M=new Map();
  for(let i=n-1;i<W.length;i++){
    let s=0,ok=true;
    for(let k=i-n+1;k<=i;k++){if(W[k].d==null){ok=false;break;}s+=W[k].d;}
    if(!ok)continue;
    const mod=s%10;
    if(!M.has(mod))M.set(mod,[]);
    M.get(mod).push(i);
  }
  return M;
}
function scScanSums(W){
  const out=[], minN=Math.max(2,Math.min(8,+cfg.sc_sum_min||2)),
        maxN=Math.max(minN,Math.min(8,+cfg.sc_sum_max||5)),
        maxSkip=Math.max(0,Math.min(500,+cfg.sc_sum_skip||0)),
        minOcc=Math.max(3,+cfg.sc_min||3);
  for(let n=minN;n<=maxN;n++){
    const M=scSumMap(W,n);
    for(const [mod,starts] of M)for(let skip=0;skip<=maxSkip;skip++)for(const alvo of [0,1]){
      const s=scEval(W,starts,alvo,skip,+cfg.rb_auto_nivel||0);
      if(s.done>=minOcc)out.push({kind:`Soma ${n}`,gat:`Σ%10=${mod}`,n,mod,skip,alvo,...s});
    }
  }
  return out.sort((a,b)=>b.rate-a.rate||b.done-a.done);
}
// ---------- situação AO VIVO de cada linha do scanner (armado / em jogo / acabou de fechar) ----------
function scNivel(){ return Math.max(0,Math.min(2,+cfg.rb_auto_nivel||0)); }
function scStartsOf(W,o,C){
  if(o.kind==='Número'){ C.dig=C.dig||{}; return C.dig[o.d]||(C.dig[o.d]=scDigitStarts(W,o.d)); }
  if(o.kind==='Trio'){ C.trio=C.trio||scTrioMap(W); return C.trio.get(`${o.a}-${o.b}-${o.c}`)||[]; }
  if(o.kind==='Dupla'){ C.pair=C.pair||scPairMap(W); return C.pair.get(o.pair||`${o.a}-${o.b}`)||[]; }
  C.sum=C.sum||{}; const M=C.sum[o.n]||(C.sum[o.n]=scSumMap(W,o.n)); return M.get(o.mod)||[];
}
// devolve a lista de entradas vivas desta combinação (pode haver mais de uma quando o gatilho repete)
function scLive(W,o,nivel,C,stepMs){
  const n=W.length, last=n-1, out=[], step=stepMs||gameIntervalSec()*1000, lastT=W[last]?.t||Date.now();
  const starts=scStartsOf(W,o,C);
  for(let k=starts.length-1;k>=0;k--){
    const ti=starts[k], base=ti+1+o.skip;
    if(base+nivel+1<last) break;                                   // já fechou há mais de 1 casa
    const trigT=W[ti].t;
    if(base>last){                                                // ARMADO: ainda falta chegar na entrada
      const faltam=base-last;
      out.push({st:'armado',faltam,trigT,entT:lastT+faltam*step,trigTxt:scGatTxt(W,o,ti)});
      continue;
    }
    let hit=-1; const nums=[];
    for(let g=0;g<=nivel && base+g<=last;g++){ nums.push(W[base+g].d); if(W[base+g].p===o.alvo){ hit=g; break; } }
    const feitas=Math.min(nivel+1,last-base+1);
    if(hit>=0){ if(base+hit>=last-1) out.push({st:'green',nivel:hit,nums,trigT,trigTxt:scGatTxt(W,o,ti)}); continue; }
    if(feitas>nivel){ if(base+nivel>=last-1) out.push({st:'red',nums,trigT,trigTxt:scGatTxt(W,o,ti)}); continue; }
    out.push({st:'jogo',prox:feitas,entT:lastT+step,nums,trigT,trigTxt:scGatTxt(W,o,ti)}); // EM JOGO: próxima tentativa é G{feitas}
  }
  return out.reverse();
}
function scGatTxt(W,o,ti){
  if(o.kind==='Número') return `nº ${W[ti].d}`;
  if(o.kind==='Trio') return `${W[ti-2]?.d}-${W[ti-1]?.d}-${W[ti].d}`;
  if(o.kind==='Dupla') return `${W[ti-1]?.d}-${W[ti].d}`;
  const g=[]; for(let k=ti-o.n+1;k<=ti;k++) g.push(W[k]?.d);
  return `${g.join('+')}=${g.reduce((a,b)=>a+b,0)}`;
}
function scLiveTxt(x){
  const hh=t=>rbFmtClock(t);
  if(x.st==='armado') return x.faltam===1
    ? `<span class="sclive arm">⏳ ENTRA NA PRÓXIMA · TS ${hh(x.entT)}</span>`
    : `<span class="sclive arm">⏳ armado · entra daqui ${x.faltam} casas · ${hh(x.entT)}</span>`;
  if(x.st==='jogo') return `<span class="sclive jogo">🎯 EM JOGO · próxima ${NIVEL[x.prox]} ${hh(x.entT)} <span class="mu">(${x.nums.join('/')})</span></span>`;
  if(x.st==='green') return `<span class="sclive ok">✅ pagou ${NIVEL[x.nivel]} agora</span>`;
  return `<span class="sclive red">❌ red agora <span class="mu">(${x.nums.join('/')})</span></span>`;
}
function scRows(list,top,W,stepMs){
  const nivel=scNivel(), C={};
  return list.slice(0,top).map((o,i)=>{

// painel do topo: tudo o que está armado ou em jogo agora, entre as linhas mostradas
function scAgoraPanel(list,top,W,stepMs){

    ${A.length?`<div class="tw" style="max-height:300px"><table><tr><th>#</th><th>Gatilho</th><th>Pulo</th><th>Entrada</th><th>Taxa</th><th style="text-align:left">Situação</th></tr>
      ${A.map(({o,i,x})=>`<tr class="scativo"><td>${i+1}</td><td>${o.kind==='Número'?`Número ${o.d}`:o.gat} <span class="mu">(${x.trigTxt} às ${rbFmtClock(x.trigT)})</span></td><td>${o.skip}</td><td>${tagc(o.alvo)}</td><td>${(o.rate*100).toFixed(1)}%</td><td style="text-align:left">${scLiveTxt(x)}</td></tr>`).join('')}
    </table></div>`:'<div class="nota">Nenhuma combinação da lista está armada ou em jogo neste momento.</div>'}
