  $('#bank').onchange = e => trocarBanco(e.target.value);
  $('#btnBuscar').onclick = buscar;
  $('#autoSeg').onchange = e => { cfg.auto = Math.max(2, +e.target.value || 10); saveCfg(); if ($('#auto').checked) { clearInterval(S.timer); S.timer = setInterval(buscar, cfg.auto * 1000); } };
  $('#auto').onchange = e => { cfg.autoOn = e.target.checked ? 1 : 0; saveCfg(); clearInterval(S.timer); if (e.target.checked) { buscar(); S.timer = setInterval(buscar, cfg.auto * 1000); } };
  setPonte();
  window.postMessage({ dd: 'ping' }, '*');
  setTimeout(() => { setPonte(); if (S.tab === 'fonte') VIEWS.fonte.after(); }, 1500);
  rbLoad();
  uoLoadStore();
  dmLoadLog();
  cfLoad();
  cfHistLoad();
  try {
    await openDB(); await loadBank(); await refreshBanks(); await liveSeed();
    const dd = await idbTail(cfg.ddBank, 1);
    if (dd.length && dd[0].id < 1e12 && dd[0].id > (+cfg.ddLastId || 0)) { cfg.ddLastId = dd[0].id; saveCfg(); }
  } catch (e) { status('IndexedDB indisponível: ' + e.message, 'err'); }
  renderTab();
  if (cfg.deriv5sOn !== 0) d5Connect();
  srLoadStore();
  if (SRB.some(r => r.on)) { cfg.sr_sym = SRB.find(r => r.on).sym; setTimeout(() => srCarregar(true), 4000); }
  srobLoad(); setTimeout(srobBtn, 1800);
  if (cfg.autoOn) { buscar(); clearInterval(S.timer); S.timer = setInterval(buscar, cfg.auto * 1000); }
  if (cfg.derivFallback) connectDerivFallback();
  // relógio dos robôs: abre o popup na hora certa e confere green/red mesmo sem dado novo
  setInterval(() => { rbProcessPending(); rbRefreshOpenPopup(); srobResolvePending(); srobRefreshPopup(); }, 1000);
})();

// =================== ☁ NUVEM (quando o HTML está hospedado na Netlify) ===================
// Guarda robôs, relatórios, banca virtual e configurações num banco da própria Netlify (Netlify Blobs),
// para abrir igual no PC e no celular. Os jogos NÃO vão para a nuvem: cada aparelho busca direto da Deriv.
// O token da conta demo nunca sai deste aparelho.
const NV={on:/^https?:$/.test(location.protocol) && !/^(localhost|127\.)/.test(location.hostname) || /[?&]nuvem=1/.test(location.search),
  api:'/api/estado', msg:'', busy:false, hash:''};
const NV_FORA=/^dpi_(demo_tok|nuvem_|deriv_symbols_cache|hdl_)|^hdl/;          // nunca sobe
function nvLS(k,v){ try{ if(v===undefined) return localStorage.getItem(k); if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){ return null; } }
function nvSenha(){ return nvLS('dpi_nuvem_senha')||''; }
function nvAuto(){ return nvLS('dpi_nuvem_auto')!=='0'; }
function nvChaves(){ const o={}; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k && k.startsWith('dpi_') && !NV_FORA.test(k)) o[k]=localStorage.getItem(k); } return o; }
async function nvGz(txt){ const s=new Blob([txt]).stream().pipeThrough(new CompressionStream('gzip')); return await new Response(s).arrayBuffer(); }
async function nvGunz(buf){ const s=new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip')); return await new Response(s).text(); }
function nvHash(o){ let h=0; const s=JSON.stringify(o); for(let i=0;i<s.length;i+=7) h=(h*31+s.charCodeAt(i))|0; return s.length+':'+h; }
async function nvReq(metodo,corpo,q=''){
  const r=await fetch(NV.api+q,{method:metodo,headers:{'x-senha':nvSenha(),...(corpo?{'content-type':'application/octet-stream'}:{})},body:corpo||undefined,cache:'no-store'});
  if(r.status===401) throw new Error('senha da nuvem errada');
  if(r.status===404 && metodo==='GET') return null;
  if(!r.ok) throw new Error((await r.text().catch(()=>''))||('erro '+r.status));
  return r;
}
async function nvMeta(){ const r=await nvReq('GET',null,'?meta=1'); return r?await r.json():null; }
async function nvBaixar(){ const r=await nvReq('GET'); if(!r) return null; return JSON.parse(await nvGunz(await r.arrayBuffer())); }
// junta listas (relatórios/logs) dos dois lados sem repetir; o resto fica com a versão deste aparelho
function nvJunta(loc,rem){
  let a,b; try{ a=JSON.parse(loc); b=JSON.parse(rem); }catch(e){ return loc; }
  if(!Array.isArray(a)||!Array.isArray(b)) return loc;
  const id=x=>x&&typeof x==='object'?String(x.id??x.T0??x.key??x.t??JSON.stringify(x)):JSON.stringify(x);
  const M=new Map(); for(const x of b) M.set(id(x),x); for(const x of a) M.set(id(x),x);
  const out=[...M.values()]; const ord=x=>x&&typeof x==='object'?(+x.T0||+x.t||+x.T||+x.criadoEm||0):0;
  if(out.every(x=>ord(x))) out.sort((x,y)=>ord(x)-ord(y));
  return JSON.stringify(out);
}
function nvAplica(D,juntar){
  let n=0;
  for(const [k,v] of Object.entries(D.keys||{})){
    if(NV_FORA.test(k)) continue;
    const loc=nvLS(k); const nv=juntar&&loc!=null?nvJunta(loc,v):v;
    if(nv!==loc){ nvLS(k,nv); n++; }
  }
  return n;
}
async function nvEnviar(manual){
  if(NV.busy) return; if(!nvSenha()){ if(manual) nvMsg('⚠ Coloque a senha da nuvem primeiro'); return; }
  NV.busy=true;
  try{
    // se outro aparelho enviou depois da minha última sincronização, junta antes de mandar
    const m=await nvMeta(); const meu=+(nvLS('dpi_nuvem_ts')||0);
    let juntou=false;
    if(m && m.ts>meu){
      if(!manual){ nvMsg('⚠ Outro aparelho enviou dados depois deste. Abra ☁ e clique em ⬇ Receber (junta tudo, nada se perde).'); NV.busy=false; return; }
      const D=await nvBaixar(); if(D) juntou=nvAplica(D,true)>0;
    }
    const K=nvChaves(), h=nvHash(K);
    if(!manual && h===NV.hash && m && m.ts<=meu){ NV.busy=false; return; }
    const ts=Date.now(), corpo=await nvGz(JSON.stringify({v:1,ts,dev:navigator.userAgent.slice(0,80),keys:K}));
    const r=await nvReq('PUT',corpo,'?ts='+ts); const j=await r.json();
    nvLS('dpi_nuvem_ts',String(j.ts||ts)); NV.hash=h;
    nvMsg(`✅ Enviado ${hmsOf(Date.now()/1000)} · ${(corpo.byteLength/1024).toFixed(0)} KB`);
    if(juntou && confirm('Juntei os dados do outro aparelho com os deste. Recarregar a página para ver tudo?')) location.reload();
  }catch(e){ nvMsg('⚠ '+(e.message||e)); }
  finally{ NV.busy=false; }
}
async function nvReceber(manual){
  if(!nvSenha()){ if(manual) nvMsg('⚠ Coloque a senha da nuvem primeiro'); return 0; }
  try{
    const m=await nvMeta();
    if(!m){ nvMsg('A nuvem ainda está vazia — clique em ⬆ Enviar neste aparelho'); return 0; }
    if(!manual && m.ts<=+(nvLS('dpi_nuvem_ts')||0)){ nvMsg(`☁ em dia · última ${fmtT(m.ts)}`); return 0; }
    const D=await nvBaixar(); if(!D) return 0;
    const n=nvAplica(D,true); nvLS('dpi_nuvem_ts',String(m.ts)); NV.hash=nvHash(nvChaves());
    nvMsg(`✅ Recebido da nuvem (${fmtT(m.ts)}) · ${n} item(ns) atualizados`);
    return n;
  }catch(e){ nvMsg('⚠ '+(e.message||e)); return 0; }
}
function nvMsg(t){ NV.msg=t; const b=$('#nuvemBtn'); if(b) b.title=t; const e=$('#nvMsg'); if(e) e.innerHTML=t; if(b) b.className=/^⚠/.test(t)?'nverr':'nvok'; }
function nvAbrir(){
  const p=$('#nuvemPop'); if(!p) return;
  p.innerHTML=`<div class="rbpc" style="width:min(440px,94vw)">
    <div class="rbpt">☁ Nuvem (Netlify)</div>
    <div class="nota">Guarda robôs, relatórios das confluências, banca virtual e configurações para abrir igual no PC e no celular. Os jogos não sobem: cada aparelho busca direto da Deriv. O token da conta demo nunca sai deste aparelho.</div>
    <div class="ctl" style="margin-top:8px"><label style="flex:1">Senha da nuvem <input type="password" id="nvSenhaIn" value="${nvSenha().replace(/"/g,'&quot;')}" style="flex:1" placeholder="a mesma do SYNC_SENHA"></label></div>
    <div class="ctl"><label><input type="checkbox" id="nvAutoIn" ${nvAuto()?'checked':''}> sincronizar sozinho (a cada 3 min e ao abrir)</label></div>
    <div class="rbactions">
      <button onclick="nvLS('dpi_nuvem_senha',$('#nvSenhaIn').value.trim());nvLS('dpi_nuvem_auto',$('#nvAutoIn').checked?'1':'0');nvEnviar(true)">⬆ Enviar agora</button>
      <button onclick="nvLS('dpi_nuvem_senha',$('#nvSenhaIn').value.trim());nvLS('dpi_nuvem_auto',$('#nvAutoIn').checked?'1':'0');nvReceber(true).then(n=>{ if(n&&confirm('Dados recebidos. Recarregar a página agora para usar?')) location.reload(); })">⬇ Receber da nuvem</button>
      <button onclick="nvLS('dpi_nuvem_senha',$('#nvSenhaIn').value.trim());nvLS('dpi_nuvem_auto',$('#nvAutoIn').checked?'1':'0');$('#nuvemPop').style.display='none'">Fechar</button>
    </div>
    <div id="nvMsg" class="nota" style="margin-top:8px">${NV.msg||'—'}</div>
  </div>`;
  p.style.display='flex';
}
async function nvInicia(){
  if(!NV.on) return;
  const b=$('#nuvemBtn'); if(b) b.style.display='';
  if(!nvSenha()){ nvMsg('☁ nuvem: coloque a senha para sincronizar'); return; }
  if(nvAuto()){
    const n=await nvReceber(false);
    if(n && !sessionStorage.getItem('dpi_nv_reload')){ sessionStorage.setItem('dpi_nv_reload','1'); location.reload(); return; }
    NV.hash=nvHash(nvChaves());
  }
  setInterval(()=>{ if(nvAuto()&&nvSenha()) nvEnviar(false); },3*60*1000);
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden'&&nvAuto()&&nvSenha()) nvEnviar(false); });
}
setTimeout(nvInicia,1500);
// app instalável (atalho no celular) — só quando hospedado
if(NV.on && 'serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});

</script>
