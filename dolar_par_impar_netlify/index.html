const SC_HEAD='<tr><th>#</th><th>Tipo</th><th>Gatilho</th><th>Pulo</th><th>Entrada</th><th>Casos</th><th>SG</th><th>G1</th><th>G2</th><th>Red</th><th>Taxa</th><th style="text-align:left">Agora</th></tr>';
const scNivelSel=()=>`<label>Entrada ${sel('rb_auto_nivel',[[0,'tiro seco'],[1,'até G1'],[2,'até G2']])}</label>`;

// =================== 🎯 CONFLUÊNCIA (abas Scanner + Somas) ===================
// Quando ≥ N sinais ativos (armados para entrar agora ou em jogo) apontam a MESMA cor para o MESMO próximo jogo,
// abre uma entrada até G2. O gale só continua se no jogo seguinte ainda houver ≥ N sinais azuis apontando a mesma cor;
// se o apoio cair (ex.: os sinais de base deram red no G2 deles), conta RED.
let CF={lista:null,listaKey:'',listaT:0,ativo:null,log:[],pop:null};
function cfLoad(){ try{ CF.log=JSON.parse(localStorage.getItem('dpi_conf_log_v1')||'[]')||[]; }catch(e){ CF.log=[]; } }
function cfSave(){ try{ localStorage.setItem('dpi_conf_log_v1',JSON.stringify(CF.log.slice(-1000))); }catch(e){} }
function cfMin(){ return Math.max(2,+cfg.cf_min||3); }
// lista de combinações (a mesma das abas), refeita a cada 60s ou quando muda filtro/banco
function cfLista(W){
  const key=[cfg.bank,cfg.janela,cfg.sc_min,cfg.sc_skip,cfg.sc_top,cfg.sc_sum_min,cfg.sc_sum_max,cfg.sc_sum_skip,cfg.rb_auto_nivel,cfg.cf_fontes].join('|');
  if(CF.lista && CF.listaKey===key && Date.now()-CF.listaT<60000) return CF.lista;
  const top=Math.max(5,Math.min(150,+cfg.sc_top||40)), f=cfg.cf_fontes||'ambos';
  let L=[];
  if(f!=='somas') L=L.concat(scScanDigits(W).slice(0,top).map(o=>({...o,fonte:'Scanner'})));
  if(f!=='scanner') L=L.concat(scScanSums(W).slice(0,top).map(o=>({...o,fonte:'Somas'})));
  CF.lista=L; CF.listaKey=key; CF.listaT=Date.now(); try{ atuLista(`Scanner/Somas ${gameIntervalSec()}s`,L); }catch(e){} return L;
}
function cfNomeRow(o){ return o.kind==='Número'?`Nº ${o.d} pula ${o.skip}`:`${o.gat} pula ${o.skip}`; }
// quem aponta para o PRÓXIMO jogo (armado entrando agora ou em jogo), separado por cor
function cfApoio(W){
  const L=cfLista(W), nivel=scNivel(), C={}, out={0:[],1:[]}, vistos=new Set();
  for(const o of L){
    const id=`${o.kind}|${o.gat||o.d}|${o.skip}|${o.alvo}`; if(vistos.has(id)) continue;
    const st=scLive(W,o,nivel,C);
    const aponta=st.find(x=>(x.st==='armado'&&x.faltam===1)||x.st==='jogo');
    if(!aponta) continue;
    vistos.add(id);
    out[o.alvo].push({nome:cfNomeRow(o),fonte:o.fonte,fase:aponta.st==='jogo'?NIVEL[aponta.prox]:'TS',taxa:o.rate});
  }
  return out;
}
function cfOk(ap,alvo){ const n=ap[alvo].length, c=ap[1-alvo].length, b=+(cfg.cf_bloq??1); return n>=cfMin() && (b===0 || (b===1 ? c===0 : b===3 ? n>c : n>=2*c)); }
// decisão para o próximo jogo + motivo (aparece no painel)
// quantos sinais da lista têm taxa ≥ cf_p100 (padrão 100%)
function cfP100(){ return Math.min(100,Math.max(80,+(cfg.cf_p100??100))); }
function cfTop(lista){ const p=cfP100()/100-1e-9; return (lista||[]).filter(s=>s.taxa>=p).length; }
function cfN100(){ return Math.max(0,+(cfg.cf_n100??0)); }
function cfDecisao(ap,filtro100=true){
  const d=cfDecisao0(ap), n=cfN100();
  if(d.alvo==null || !n || !filtro100) return d;
  const k=cfTop(ap[d.alvo]);
  if(k<n) return {alvo:null,motivo:`${d.alvo?'ÍMPAR':'PAR'} tem só ${k} sinal(is) ${cfP100()}% (precisa ${n})`,bloq100:true};
  return {...d,motivo:d.motivo+` · ${k}⭐`};
}
function cfDecisao0(ap){
  for(const alvo of [0,1]) if(cfOk(ap,alvo)) return {alvo,motivo:`entrada ${alvo?'ÍMPAR':'PAR'}`};
  const n0=ap[0].length, n1=ap[1].length, b=+(cfg.cf_bloq??1), m=cfMin();
  if(n0<m && n1<m) return {alvo:null,motivo:`poucos sinais (precisa ${m} iguais)`};
  return {alvo:null,motivo:b===1?'bloqueado: tem sinal da cor contrária':b===3?'empate ou maioria na outra cor':'bloqueado: a outra cor tem mais da metade'};
}
function cfEsperaMax(){ return +(cfg.cf_espera??60)||1e9; }
// chamado a cada jogo novo do banco aberto
function cfCheck(){
  if(!cfg.cf_on && !(cfg.cf2_on??1)) return;
  const W=S.win; if(!W||W.length<50) return;
  const last=W.at(-1), step=gameIntervalSec()*1000, prox=last.t+step;
  const ap=cfApoio(W), dec=cfDecisao(ap), decG=(cfg.cf_100gale??1)?dec:cfDecisao(ap,false);
  cfHistReg(prox,ap);
  try{ cf2Check(W,last,step,prox,ap,dec,decG); }catch(e){ console.warn('confluência 2',e); }
  if(!cfg.cf_on) return;
  let A=CF.ativo;
  // 1) entrada aberta: confere a tentativa que acabou de sair
  if(A && !A.fim && A.estado==='jogo' && last.t>=A.Tcur){
    const x=W.slice(-60).find(z=>z.t===A.Tcur);
    if(!x){ A.tent.push({g:A.g,T:A.Tcur,d:null,alvo:A.alvoCur}); cfFecha(A,'sem dado'); }
    else{
      A.tent.push({g:A.g,T:A.Tcur,d:x.d,p:x.p,alvo:A.alvoCur,n:A.nCur});
      if(x.p===A.alvoCur) cfFecha(A,'green');
      else if(A.g>=2) cfFecha(A,'red','perdeu no G2');
      else { A.g++; A.estado='aguardando'; A.espera=0; if(CF.pop===A.id&&!cfg.il_on) cfPopup(); }
    }
  }
  // 2) aguardando o gale: entra quando aparecer a próxima confluência
  if(A && !A.fim && A.estado==='aguardando'){
    const corOk=decG.alvo!=null && (cfg.cf_galeCor!=='mesma' || decG.alvo===A.alvo);
    if(corOk){
      A.estado='jogo'; A.Tcur=prox; A.alvoCur=decG.alvo; A.nCur=ap[decG.alvo].length; A.sinaisCur=ap[decG.alvo].slice();
      A.apoios.push({g:A.g,n:ap[decG.alvo].length,c:ap[1-decG.alvo].length,T:prox});
      cfDec(prox,ap,`${NIVEL[A.g]} ${decG.alvo?'ÍMPAR':'PAR'} (gale)`);
      try{ esSinal(A); }catch(e){ console.warn('estratégia',e); }
      if((cfg.cf_pop??1)&&!cfg.il_on) cfPopup(); if(!cfg.il_on) beep();
    } else {
      A.espera++;
      cfDec(prox,ap,`aguardando sinal p/ ${NIVEL[A.g]} · ${decG.motivo}`);
      if(A.espera>=cfEsperaMax()) cfFecha(A,'red',`sem novo sinal em ${A.espera} jogos para o ${NIVEL[A.g]}`);
      else if(CF.pop===A.id) cfPopRefresh();
    }
  }
  if(A && !A.fim){ if(['scan','soma'].includes(S.tab)) cfLive(); return; }
  // 3) nova entrada
  cfDec(prox,ap,dec.motivo);
  if(dec.alvo==null || CF.ultimoT===prox){ if(['scan','soma'].includes(S.tab)) cfLive(); return; }
  CF.ultimoT=prox;
  CF.ativo={id:'CF'+prox,T0:prox,Tcur:prox,step,alvo:dec.alvo,alvoCur:dec.alvo,g:0,estado:'jogo',espera:0,tent:[],fim:false,bank:cfg.bank,
    n100:cfTop(ap[dec.alvo]),sinais:ap[dec.alvo].slice(),sinaisCur:ap[dec.alvo].slice(),nCur:ap[dec.alvo].length,contra:ap[1-dec.alvo].length,apoios:[{g:0,n:ap[dec.alvo].length,c:ap[1-dec.alvo].length,T:prox}],
    extras:(()=>{ try{ return cfExtras(prox).map(x=>({tipo:x.tipo,txt:x.txt,alvo:x.alvo})); }catch(e){ return []; } })()};
  try{ CF.ativo.forca=fzForca({alvo:dec.alvo,ap:CF.ativo.nCur,c:CF.ativo.contra,s100:cfTop(CF.ativo.sinais),extras:CF.ativo.extras}).forca; }catch(e){}
  try{ esSinal(CF.ativo); }catch(e){ console.warn('estratégia',e); }
  if((cfg.cf_pop??1)&&!cfg.il_on) cfPopup();
  if(!cfg.il_on) beep();
  if(['scan','soma'].includes(S.tab)) cfLive();
}
// apoio (quantos sinais de cada cor) de cada jogo — guardado para a simulação com troca de cor
function cfHistLoad(){ try{ CF.hist=JSON.parse(localStorage.getItem('dpi_conf_hist_v1')||'{}')||{}; }catch(e){ CF.hist={}; } }
function cfHistReg(T,ap){
  if(!CF.hist) cfHistLoad();
  CF.hist[T]=[ap[0].length,ap[1].length];
  const lim=Date.now()-2*86400e3; let n=0;
  for(const k in CF.hist){ if(+k<lim) delete CF.hist[k]; else n++; }
  if(n%20===0) try{ localStorage.setItem('dpi_conf_hist_v1',JSON.stringify(CF.hist)); }catch(e){}
}
// em que gale teria pago seguindo a MESMA cor nos jogos seguintes (a partir da 1ª entrada)
function cfPagouNo(x,M){
  const c=x.tent[0]?.alvo??x.alvo;
  for(let k=0;k<=12;k++){ const r=M.get(x.T0+k*x.step); if(!r) return {k:null,ate:k}; if(r.p===c) return {k}; }
  return {k:-1};
}
function cfPagouTxt(o){ return o.k==null?(o.ate?`seguindo direto: sem pagar até ${NIVEL[o.ate-1]||'G'+(o.ate-1)} (aguardando dados)`:''):o.k<0?'seguindo direto: não pagou até G12':`seguindo direto: pagou no ${o.k===0?'TS':'gale '+o.k}`; }
function cfDec(T,ap,motivo){ CF.dec=(CF.dec||[]); if(CF.dec.length&&CF.dec.at(-1).T===T) CF.dec.pop(); CF.dec.push({T,p:ap[0].length,i:ap[1].length,motivo}); if(CF.dec.length>12) CF.dec.shift(); }
function cfFecha(A,res,obs=''){
  A.fim=true; A.res=res; A.obs=obs;
  CF.log.push({forca:A.forca,n100:A.n100??cfTop(A.sinais),T0:A.T0,step:A.step,alvo:A.alvo,res,nivel:res==='green'?A.g:-1,tent:A.tent,sinais:A.sinais,apoios:A.apoios,obs,bank:A.bank,extras:A.extras||[]});
  cfSave(); try{ if(!ilSo()) ATU.ult={T:Date.now(),txt:`💪 Força aprendeu com a entrada ${hmsOf(A.T0/1000)} (${res==='green'?'✅ '+NIVEL[A.g]:res}) · ${fzModelo().n} entradas`}; atuRender(); pgChip(); }catch(e){}
  try{ esFechou(CF.log.at(-1)); }catch(e){ console.warn('estratégia',e); }
  try{ if(!bvC2()) bvProcessa(CF.log.at(-1)); cfaAuto(); }catch(e){ console.warn('banca virtual',e); } if(CF.pop===A.id&&!cfg.il_on) cfPopup();
  if(['scan','soma'].includes(S.tab)){ cfLive(); cf2Live(); }
}

// ---------- outros sinais que apontam o MESMO jogo (aparecem junto no popup da confluência) ----------
let CF_HP={key:'',when:0,rows:[]};
function cfHpAtualiza(){
  if(!(cfg.cf_exHp??1) || !S.all.length) return;
  const key=cfg.bank+'|'+cfg.hpPer+'|'+cfg.hpOrd;
  if(CF_HP.key===key && Date.now()-CF_HP.when<10*60*1000) return;
  CF_HP={key,when:Date.now(),rows:[]};
  setTimeout(()=>{ try{
    const step=gameIntervalSec(), per=+cfg.hpPer||0, G=gridBuild(S.all,step,per?S.all.at(-1).t-per*3600e3:0); if(!G) return;
    const Lk=cfg.hpOrd==='ts'?0:cfg.hpOrd==='g1'?1:2, min=+(cfg.cf_hpMin??3);
    CF_HP.rows=hpScan(G,'all').filter(r=>r.L[Lk].cur>=min).map(r=>({off:r.off,alvo:r.alvo,cur:r.L[Lk].cur,rate:r.L[Lk].rate,lvl:Lk}));
  }catch(e){ console.warn('horas pagantes (confluência)',e); } },50);
}
// devolve quem aponta para o jogo T (ms): robôs, robôs de segundos, horas pagantes e colunas 10 min
function cfExtras(Tms){
  const out=[], step=gameIntervalSec()*1000, W=S.win, par=t=>{ const x=W.slice(-80).find(z=>z.t===t); return x?x.p:null; };
  // 🤖 robôs (aba Robôs) do mesmo banco
  if(cfg.cf_exRob??1) for(const sig of RB_PENDING){
    if(sig.done||sig.bank!==cfg.bank) continue;
    const rb=RBOTS.find(r=>r.id===sig.rbId); if(!rb||!rb.on||rb.cfPop===false) continue;
    for(let g=0;g<=sig.maxNivel;g++){
      const Tg=sig.entryT+g*sig.stepMs;
      if(Tg>Tms) break;
      if(Tg===Tms){ out.push({tipo:'rob',txt:`🤖 ${rbName(rb)}`,alvo:sig.alvo,fase:NIVEL[g]}); break; }
      const p=par(Tg); if(p===null||p===sig.alvo) break;          // já pagou (ou sem dado) → não aponta mais
    }
  }
  // ⏱ robôs de segundos no mesmo jogo
  if((cfg.cf_exRob??1) && typeof SR_PEND!=='undefined') for(const s of SR_PEND){
    if(s.done||s.E*1000!==step||TK.sym!==curSym()) continue;
    const r=SRB.find(x=>x.id===s.rid); if(!r||!r.on||r.cfPop===false) continue;
    if((s.T+s.res.length*s.E)*1000===Tms) out.push({tipo:'rob',txt:`⏱ ${srNome(r)}`,alvo:s.alvo,fase:NIVEL[s.res.length]});
  }
  // ⏰ horas pagantes (minuto:segundo da hora, pagando há ≥ N horas)
  if(cfg.cf_exHp??1){
    cfHpAtualiza();
    const T=Tms/1000, off=((T%3600)+3600)%3600;
    const hpL=[];   // junta tudo e mostra só a mais forte de cada cor (+ quantas outras)
    for(const r of CF_HP.rows){
      for(let g=0;g<=r.lvl;g++){
        if(r.off+g*step/1000!==off) continue;
        let ok=true; for(let h=0;h<g;h++){ const p=par(Tms-(g-h)*step); if(p===null||p===r.alvo){ ok=false; break; } }
        if(ok) hpL.push({r,g});
      }
    }
    for(const cor of [0,1]){
      const L=hpL.filter(x=>x.r.alvo===cor).sort((x,y)=>y.r.cur-x.r.cur||y.r.rate-x.r.rate); if(!L.length) continue;
      const {r,g}=L[0];
      out.push({tipo:'hp',txt:`⏰ Horas pagantes :${msOf(r.off)} · ${r.cur}h pagando · ${(r.rate*100).toFixed(0)}%${L.length>1?` <span class="mu">+${L.length-1} horário(s)</span>`:''}`,alvo:cor,fase:NIVEL[g],n:L.length});
    }
  }
  // 🧱 colunas 10 min: mesma coluna + mesmo segundo repetindo a cor ≥ N vezes
  if(cfg.cf_exCol??1){
    const G=gridBuild(W.slice(-5000),step/1000);
    if(G){ const T=Tms/1000, d=new Date(Tms), col=d.getMinutes()%10, j=d.getSeconds()/(step/1000);
      if(Number.isInteger(j)){ const r=c10Seq(G,col,j); if(r && r.len>=(+(cfg.cf_colMin??4)) && r.next===T) out.push({tipo:'col',txt:`🧱 Coluna ${col} · J${j+1}: ${r.len}× ${r.p?'ÍMPAR':'PAR'} seguidos (máx ${r.max})`,alvo:r.p,fase:'seq.'}); } }
  }
  // ⏱ padrões de 5 segundos no segundo exato deste jogo
  if(cfg.p5_cruz??1) try{ out.push(...p5Resumo(p5Aponta(Tms))); }catch(e){ console.warn('5s',e); }
  if(cfg.p10_cruz??1) try{ out.push(...p10Resumo(p10Aponta(Tms))); }catch(e){ console.warn('10s',e); }
  return out;
}

// simulações (não abrem popup):
//  'direto' → gale nos jogos seguintes, sempre a mesma cor da 1ª entrada
//  'troca'  → gale nos jogos seguintes, mas troca para a outra cor quando o próximo jogo tiver MAIS sinais nela (sinal mais forte)
function cfSimulacao(modo='direto'){
  if(!CF.hist) cfHistLoad();
  const M=new Map(S.all.slice(-50000).map(x=>[x.t,x]));
  let n=0,lv=[0,0,0],red=0,trocas=0,semApoio=0;
  for(const x of CF.log){
    if(x.res==='sem dado'||!x.tent.length) continue;
    let c=x.tent[0].alvo??x.alvo, hit=-1, falta=false;
    for(let g=0;g<=2;g++){
      const T=x.T0+g*x.step;
      if(modo==='troca' && g>0){
        const h=CF.hist[T];
        if(!h){ semApoio++; }
        else if(h[1-c]>h[c] && h[1-c]>=cfMin()){ c=1-c; trocas++; }
      }
      const r=M.get(T); if(!r){ falta=true; break; } if(r.p===c){ hit=g; break; }
    }
    if(hit<0&&falta) continue;
    n++; if(hit>=0) lv[hit]++; else red++;
  }
  return {n,lv,red,p:n?(n-red)/n:0,trocas,semApoio};
}
function cfRelatorio(){
  const L=CF.log.filter(x=>x.res!=='sem dado'), n=L.length;
  const lv=[0,1,2].map(g=>L.filter(x=>x.nivel===g).length), red=L.filter(x=>x.res==='red').length;

// =================== 💰 BANCA VIRTUAL DA CONFLUÊNCIA (só as entradas dos popups) ===================
// Aposta de mentira em cada entrada que o popup da confluência abre. Gale só até onde o popup vai (G2).
let BV={on:0,ini:100,saldo:100,ops:[],desde:0,parado:'',pico:100,fundo:100};
function bvLoad(){ try{ Object.assign(BV,JSON.parse(localStorage.getItem('dpi_conf_banca_v1')||'{}')); }catch(e){} }
function bvSave(){ try{ BV.ops=BV.ops.slice(-500); localStorage.setItem('dpi_conf_banca_v1',JSON.stringify(BV)); }catch(e){} }
const bvR=v=>Math.round(v*100)/100;
const bvM=v=>(v<0?'-':'')+'$ '+Math.abs(v).toFixed(2);
function bvPay(){ return Math.max(1,+cfg.bv_payout||95)/100; }
function bvC2(){ return cfg.bv_fonte==='c2'; }
function bvGaleMax(){ return Math.min(bvC2()?Math.max(0,cf2Max()<1e9?cf2Max()-1:9):2,Math.max(0,+cfg.bv_gale||0)); }
// valor de cada tentativa: g=0 entrada, g=1 G1 …
function bvStakes(){
  const e=Math.max(0.01,+cfg.bv_entrada||1), pay=bvPay(), out=[]; let perdido=0;
  for(let g=0;g<=bvGaleMax();g++){
    const s=g===0?e:cfg.bv_modo==='auto'?(perdido+e*pay)/pay:e*Math.pow(+cfg.bv_mult||2,g);
    out.push(bvR(s)); perdido+=bvR(s);
  }
  return out;
}
// chamado quando uma entrada da confluência fecha
function bvProcessa(x){
  if(!BV.on || x.T0<BV.desde || x.res==='sem dado') return;
  const st=bvStakes(), pay=bvPay(), tent=(x.tent||[]).filter(t=>t.d!=null);
  let lucro=0, apostado=0, nivel=-1, i=0;
  for(;i<tent.length && i<st.length;i++){
    const t=tent[i]; apostado+=st[i];
    if(t.p===t.alvo){ lucro+=st[i]*pay; nivel=i; break; }
    lucro-=st[i];
  }
  if(!tent.length) return;                       // nenhuma tentativa jogada → não mexe na banca
  lucro=bvR(lucro); BV.saldo=bvR(BV.saldo+lucro);
  BV.pico=Math.max(BV.pico,BV.saldo); BV.fundo=Math.min(BV.fundo,BV.saldo);
  BV.ops.push({T0:x.T0,alvo:x.alvo,res:nivel>=0?'green':'red',nivel,apostado:bvR(apostado),lucro,saldo:BV.saldo,tent:i+(nivel>=0?1:0)});
  const res=BV.saldo-BV.ini, sw=+cfg.bv_sw||0, sl=+cfg.bv_sl||0;
  if(sw>0 && res>=sw){ BV.on=0; BV.parado=`🏁 STOP WIN atingido (${bvM(res)}) às ${hmsOf(Date.now()/1000)}`; }
  else if(sl>0 && -res>=sl){ BV.on=0; BV.parado=`🛑 STOP LOSS atingido (${bvM(res)}) às ${hmsOf(Date.now()/1000)}`; }
  else if(BV.saldo<st.reduce((a,b)=>a+b,0)){ BV.on=0; BV.parado=`⚠ Banca não cobre a entrada + gales (${bvM(BV.saldo)})`; }
  bvSave();
  if(BV.parado && !BV.on) status(BV.parado,'warn');
}
function bvIniciar(){ if(!BV.ops.length||BV.saldo<=0){ BV.ini=BV.saldo=BV.pico=BV.fundo=bvR(+cfg.bv_ini||100); } BV.on=1; BV.parado=''; BV.desde=Date.now()-60000; bvSave(); cfLive(); }
function bvParar(){ BV.on=0; BV.parado=`⏸ Parada por você às ${hmsOf(Date.now()/1000)}`; bvSave(); cfLive(); }
function bvZerar(){ if(!confirm('Zerar a banca virtual e apagar as entradas dela?')) return; BV={on:0,ini:bvR(+cfg.bv_ini||100),saldo:bvR(+cfg.bv_ini||100),ops:[],desde:0,parado:'',pico:bvR(+cfg.bv_ini||100),fundo:bvR(+cfg.bv_ini||100)}; bvSave(); cfLive(); }
// linha no popup: quanto a banca está apostando nesta tentativa

}
function bvHtml(){

      <label>Gale ${sel('bv_modo',[['mult','multiplicar'],['auto','automático (recupera + lucro)']])}</label>
      ${cfg.bv_modo==='auto'?'':`<label>× ${inp('bv_mult',45)}</label>`}

    <div class="nota" style="margin:2px 0 6px">Apostas por entrada: ${st.map((v,i)=>`${nvG(i)} <b>${bvM(v)}</b>`).join(' · ')} → risco total ${bvM(st.reduce((a,b)=>a+b,0))}. 0 no stop = sem stop.${BV.parado?` <b class="ruim">${BV.parado}</b>`:''}</div>

    ${ops.length?redSeqHtml('Reds seguidos — banca virtual',ops.map(o=>({T:o.T0,red:o.res==='red'})))+perdasSeqHtml(ops.flatMap(o=>{ const n=Math.max(1,o.tent||1), a=[]; for(let i=0;i<n;i++) a.push({T:o.T0+i*1000,win:o.res==='green'&&i===n-1}); return a; })):''}
    ${R.length?`<div class="tw" style="max-height:220px"><table><tr><th>Entrada</th><th>Alvo</th><th>Resultado</th><th>Apostado</th><th>Lucro</th><th>Saldo</th></tr>
      ${R.map(o=>`<tr><td>${fmtT(o.T0)}</td><td>${tagc(o.alvo)}</td><td class="${o.res==='green'?'ok':'ruim'}"><b>${o.res==='green'?'✅ '+nvG(o.nivel):'❌ RED'}</b></td><td>${bvM(o.apostado)}</td><td class="${o.lucro>=0?'ok':'ruim'}">${o.lucro>=0?'+':''}${bvM(o.lucro)}</td><td>${bvM(o.saldo)}</td></tr>`).join('')}</table></div>`:''}

}

// =================== 🟣 CONFLUÊNCIA 2 — mesma estratégia, mas NÃO fecha em red: segue o gale até dar green ===================
// Usa os mesmos sinais da Confluência 1 (Scanner + Somas, mínimo, bloqueio, cor do gale).
// Diferença: se perder no G2 marca "seria RED até G2", mas continua aberta e entra no G3, G4… sempre
// no próximo jogo que tiver confluência, até dar green (ou até o limite de entradas escolhido).
let CF2={ativo:null,log:[],pop:null,oculto:null};
const nvG=g=>g<=0?'TS':'G'+g;
function cf2Load(){ if(cfg.cf2_v!==1){ cfg.cf2_max=7; cfg.cf2_v=1; try{ saveCfg(); }catch(e){} } try{ CF2.log=JSON.parse(localStorage.getItem('dpi_conf2_log_v1')||'[]')||[]; }catch(e){ CF2.log=[]; } }
function cf2Save(){ try{ localStorage.setItem('dpi_conf2_log_v1',JSON.stringify(CF2.log.slice(-1000))); }catch(e){} }
function cf2Max(){ return +(cfg.cf2_max??7)||1e9; }            // nº máximo de entradas (7 = até G6; passou disso é RED)
function cf2EsperaMax(){ return +(cfg.cf2_espera??0)||1e9; }    // jogos esperando o próximo sinal (0 = sem limite)
function cf2Check(W,last,step,prox,ap,dec,decG=dec){
  if(!(cfg.cf2_on??1)) return;
  let A=CF2.ativo;
  // 1) confere a tentativa que acabou de sair
  if(A && !A.fim && A.estado==='jogo' && last.t>=A.Tcur){
    const x=W.slice(-60).find(z=>z.t===A.Tcur);
    if(!x){ A.tent.push({g:A.g,T:A.Tcur,d:null,alvo:A.alvoCur,esp:A.esperaG}); cf2Fecha(A,'sem dado'); }
    else{
      A.tent.push({g:A.g,T:A.Tcur,d:x.d,p:x.p,alvo:A.alvoCur,n:A.nCur,esp:A.esperaG,o:A.origemCur||'conf'});
      if(x.p===A.alvoCur) cf2Fecha(A,'green');
      else if(A.g+1>=cf2Max()) cf2Fecha(A,'limite',`perdeu as ${A.g+1} entradas (TS até ${nvG(A.g)})`);
      else { if(A.g===2) A.red2=true; A.g++; A.estado='aguardando'; A.espera=0; cf2PopMostra(A); }
    }
  }
  // 2) aguardando: entra no próximo jogo com confluência
  if(A && !A.fim && A.estado==='aguardando'){
    // segue o que o popup 1 mandar para este jogo, na cor que vier (não fica preso à cor da 1ª entrada)
    let alvo=decG.alvo, origem='conf', nSin=alvo!=null?ap[alvo].length:0;
    if(alvo==null && (cfg.cf2_rob??1)){
      const rb=(()=>{ try{ return cfExtras(prox).filter(x=>x.tipo==='rob'); }catch(e){ return []; } })();
      const c0=rb.filter(x=>x.alvo===0).length, c1=rb.filter(x=>x.alvo===1).length;
      if(c0!==c1){ alvo=c0>c1?0:1; origem='robô'; nSin=Math.max(c0,c1); }
    }
    if(alvo!=null){
      A.estado='jogo'; A.Tcur=prox; A.alvoCur=alvo; A.nCur=nSin; A.esperaG=A.espera; A.origemCur=origem;
      A.apoios.push({g:A.g,n:nSin,c:origem==='conf'?ap[1-alvo].length:0,T:prox,origem});
      cf2PopMostra(A,true);
    } else {
      A.espera++; A.esperaTot++;
      if(A.espera>=cf2EsperaMax()) cf2Fecha(A,'expirou',`sem novo sinal em ${A.espera} jogos para o ${nvG(A.g)}`);
    }
  }
  if(A && !A.fim){ cf2Refresh(); return; }

  if(dec.alvo==null || CF2.ultimoT===prox){ cf2Refresh(); return; }
  CF2.ultimoT=prox;
  CF2.ativo={id:'CF2'+prox,origemCur:'conf',T0:prox,Tcur:prox,step,alvo:dec.alvo,alvoCur:dec.alvo,g:0,estado:'jogo',espera:0,esperaG:0,esperaTot:0,tent:[],fim:false,red2:false,bank:cfg.bank,
    n100:cfTop(ap[dec.alvo]),sinais:ap[dec.alvo].slice(),nCur:ap[dec.alvo].length,contra:ap[1-dec.alvo].length,apoios:[{g:0,n:ap[dec.alvo].length,c:ap[1-dec.alvo].length,T:prox}],
    extras:(()=>{ try{ return cfExtras(prox).map(x=>({tipo:x.tipo,alvo:x.alvo})); }catch(e){ return []; } })()};
  try{ CF2.ativo.forca=fzForca({alvo:dec.alvo,ap:CF2.ativo.nCur,c:CF2.ativo.contra,s100:CF2.ativo.n100,extras:CF2.ativo.extras}).forca; }catch(e){}
  cf2PopMostra(CF2.ativo,true);
}
function cf2Fecha(A,res,obs=''){
  A.fim=true; A.res=res; A.obs=obs;

    tent:A.tent.map(t=>({g:t.g,T:t.T,d:t.d,p:t.p,alvo:t.alvo,n:t.n,esp:t.esp||0,o:t.o||'conf'})),
    apoio0:A.apoios[0]?.n||0,contra:A.contra||0,fontes:cf2Fontes(A.sinais),extras:A.extras||[],esperaTot:A.esperaTot||0,obs,bank:A.bank,

}
function cf2Fontes(s){ const sc=(s||[]).filter(x=>x.fonte==='Scanner').length, so=(s||[]).length-sc; return sc&&so?'mista':sc?'scanner':'somas'; }

// ---------- popup 2 (fica no canto, não tampa a tela nem o popup 1) ----------
function cf2PopMostra(A,novo){

function cf2PopRender(){
  const A=CF2.ativo, p=$('#cf2Pop'); if(!A||!p||CF2.pop!==A.id) return;

// nível "efetivo" de cada entrada: 0=TS,1=G1,2=G2, 3+=passou do G2 (na Confluência 1 o red conta como 3)
function cfaRows(){
  const r1=CF.log.filter(x=>x.res==='green'||x.res==='red').map(x=>({f:1,T:x.T0,alvo:x.alvo,ap:x.apoios?.[0]?.n??x.sinais.length,contra:x.apoios?.[0]?.c||0,
    nv:x.res==='green'?x.nivel:3,fontes:cf2Fontes(x.sinais),s100:x.n100??cfTop(x.sinais),ex:(x.extras||[]).filter(e=>e.alvo===x.alvo).length}));
  const r2=CF2.log.filter(x=>x.res!=='sem dado').map(x=>({f:2,T:x.T0,alvo:x.alvo,ap:x.apoio0,contra:x.contra,nv:x.res==='green'?x.nivel:99,fontes:x.fontes,s100:x.n100??0,ex:(x.extras||[]).filter(e=>e.alvo===x.alvo).length}));
  return cfg.cfa_fonte==='1'?r1:cfg.cfa_fonte==='2'?r2:r1.concat(r2);
}
function cfaGrupo(rows,chave){
  const M=new Map();
  for(const r of rows){ const k=chave(r); if(k==null) continue; if(!M.has(k)) M.set(k,[]); M.get(k).push(r); }
  return [...M.entries()].map(([k,a])=>{ const n=a.length, ts=a.filter(r=>r.nv===0).length, g1=a.filter(r=>r.nv<=1).length, g2=a.filter(r=>r.nv<=2).length, foi2=a.filter(r=>r.nv>=2).length;
    const cap=a.map(r=>Math.min(r.nv,6)); return {k,n,ts,g1,g2,foi2,red:n-g2,media:cap.reduce((x,y)=>x+y,0)/n,apMed:a.reduce((x,r)=>x+r.ap,0)/n}; });
}
function cfaTabela(tit,G,rotulo){

    <div class="tw" style="max-height:260px"><table><tr><th>${tit.split(' ')[1]||''}</th><th>Entradas</th><th>TS</th><th>até G1</th><th>até G2</th><th>foram p/ G2+</th><th>passou G2</th><th>gale médio</th></tr>
    ${G.map(g=>`<tr class="${bom&&g.k===bom.k?'cfa-best':''}"><td><b>${rotulo(g.k)}</b></td><td>${g.n}</td><td>${(100*g.ts/g.n).toFixed(0)}%</td><td>${(100*g.g1/g.n).toFixed(0)}%</td><td class="${g.g2/g.n>=.9?'ok':g.g2/g.n<.75?'ruim':''}"><b>${(100*g.g2/g.n).toFixed(0)}%</b></td><td>${g.foi2}</td><td class="${g.red?'ruim':''}">${g.red}</td><td>${g.media.toFixed(2)}</td></tr>`).join('')}</table></div></div>`;

function cfaResumo(rows){
  const med=a=>a.length?(a.reduce((x,r)=>x+r.ap,0)/a.length).toFixed(1):'—';
  const ts=rows.filter(r=>r.nv===0), g1=rows.filter(r=>r.nv===1), g2=rows.filter(r=>r.nv===2), mais=rows.filter(r=>r.nv>=3);
  return {txt:`Apoio médio (nº de confirmações) — green no TS: <b>${med(ts)}</b> · no G1: <b>${med(g1)}</b> · no G2: <b>${med(g2)}</b> · passou do G2: <b class="ruim">${med(mais)}</b>`,
    ts:med(ts),g1:med(g1),g2:med(g2),mais:med(mais)};
}

// ---------- 🔴 reds seguidos: recebe [{T,red}] em ordem ----------
function redSeqHtml(tit,L,obs=''){
  if(!L.length) return '';
  const seqs=[]; let cur=null;
  for(const x of L){ if(x.red){ if(!cur) cur={ini:x.T,fim:x.T,n:0}; cur.n++; cur.fim=x.T; } else if(cur){ seqs.push(cur); cur=null; } }
  const aberta=cur; if(cur) seqs.push(cur);

function perdasSeqHtml(A){

  const all=runs.concat(aberta?[aberta]:[]);

// =================== ⏱ PADRÕES DE 5 SEGUNDOS (rodam sempre no banco de 5s, qualquer banco aberto em cima) ===================
// Scanner, Somas, horas pagantes e robôs calculados no banco "DERIV <símbolo> · 5s".
// Como o jogo de 5s no segundo X é o MESMO número do jogo de 20s no segundo X, um padrão de 5s que cai
// no segundo exato da entrada do popup aponta a mesma coisa → aparece nos cruzamentos marcado "⏱ 5s".
let P5={lista:null,listaKey:'',listaT:0,hp:[],hpT:0,hpKey:'',ultimoT:0,auto:[],autoInfo:null};
function p5On(){ return !!cfg.p5_on; }
function p5Bank(){ return d5BankName(5); }
function p5W(){ const W=liveW(p5Bank())||[]; const n=Math.max(1000,+cfg.p5_n||5000); return W.length>n?W.slice(-n):W; }
function p5Fresco(W){ return W.length>=200 && srvNow()*1000-W.at(-1).t<20000; }          // último jogo de 5s tem menos de 20s
function p5Lista(W){
  const key=[p5Bank(),cfg.p5_n,cfg.sc_min,cfg.sc_skip,cfg.sc_top,cfg.sc_sum_min,cfg.sc_sum_max,cfg.sc_sum_skip,cfg.rb_auto_nivel,cfg.cf_fontes].join('|');
  if(P5.lista && P5.listaKey===key && Date.now()-P5.listaT<60000) return P5.lista;
  const top=Math.max(5,Math.min(150,+cfg.sc_top||40)), f=cfg.cf_fontes||'ambos'; let L=[];
  if(f!=='somas') L=L.concat(scScanDigits(W).slice(0,top).map(o=>({...o,fonte:'Scanner'})));
  if(f!=='scanner') L=L.concat(scScanSums(W).slice(0,top).map(o=>({...o,fonte:'Somas'})));
  P5.lista=L; P5.listaKey=key; P5.listaT=Date.now(); try{ atuLista('⏱ Scanner/Somas 5s',L); }catch(e){} return L;
}
// horas pagantes do banco de 5s (refeito a cada 10 min)
function p5Hp(){
  const W=liveW(p5Bank())||[]; if(W.length<500) return [];
  const key=p5Bank()+'|'+cfg.hpPer+'|'+cfg.p5_hpMin;
  if(P5.hpKey===key && Date.now()-P5.hpT<10*60*1000) return P5.hp;
  P5.hpKey=key; P5.hpT=Date.now();
  try{
    const per=+cfg.hpPer||24, G=gridBuild(W,5,W.at(-1).t-per*3600e3); if(!G) return P5.hp=[];
    const min=Math.max(1,+(cfg.p5_hpMin??3));
    P5.hp=hpScan(G,'all').filter(r=>r.L[2].cur>=min).map(r=>({off:r.off,alvo:r.alvo,cur:r.L[2].cur,rate:r.L[2].rate,n:r.L[2].n,max:r.L[2].max}))
      .sort((a,b)=>b.cur-a.cur||b.rate-a.rate);
  }catch(e){ console.warn('horas pagantes 5s',e); P5.hp=[]; }
  return P5.hp;
}
// tudo que os padrões de 5s apontam para o jogo T (ms): [{tipo:'p5',txt,alvo,fase,sub}]
function p5Aponta(Tms){
  if(!p5On() || cfg.bank===p5Bank()) return [];   // com o próprio banco de 5s aberto, a confluência já usa ele
  const W=p5W(); if(!p5Fresco(W)) return [];
  const out=[], nivel=scNivel(), C={};
  // 🔬/➕ Scanner e Somas do 5s: armado para cair em T ou em jogo com a próxima tentativa em T
  for(const o of p5Lista(W)){
    for(const x of scLive(W,o,nivel,C,5000)){
      if((x.st==='armado'||x.st==='jogo') && x.entT===Tms)
        out.push({tipo:'p5',sub:'sc',txt:`⏱ 5s · ${o.fonte} ${cfNomeRow(o)} · ${(o.rate*100).toFixed(0)}%`,alvo:o.alvo,fase:x.st==='jogo'?NIVEL[x.prox]:'TS',taxa:o.rate});
    }
  }
  // 🕐 horas pagantes do 5s (minuto:segundo exato), sem ter pago nas tentativas anteriores
  const par=t=>{ const z=W.slice(-40).find(y=>y.t===t); return z?z.p:null; };
  const off=(((Tms/1000)%3600)+3600)%3600;
  for(const r of p5Hp()){
    for(let g=0;g<=2;g++){
      if(r.off+g*5!==off) continue;
      let ok=true; for(let h=0;h<g;h++){ const p=par(Tms-(g-h)*5000); if(p===null||p===r.alvo){ ok=false; break; } }
      if(ok) out.push({tipo:'p5',sub:'hp',txt:`⏱ 5s · Horas pagantes :${msOf(r.off)} · ${r.cur}h pagando · ${(r.rate*100).toFixed(0)}%`,alvo:r.alvo,fase:NIVEL[g],taxa:r.rate});
    }
  }
  // 🤖 robôs criados no banco de 5s
  for(const sig of RB_PENDING){
    if(sig.done||sig.bank!==p5Bank()) continue;
    const rb=RBOTS.find(r=>r.id===sig.rbId); if(!rb||!rb.on||rb.cfPop===false) continue;
    for(let g=0;g<=sig.maxNivel;g++){
      const Tg=sig.entryT+g*sig.stepMs; if(Tg>Tms) break;
      if(Tg===Tms){ out.push({tipo:'p5',sub:'rb',txt:`⏱ 5s · 🤖 ${rbName(rb)}`,alvo:sig.alvo,fase:NIVEL[g],taxa:rb.taxaCriacao||0}); break; }
      const p=par(Tg); if(p===null||p===sig.alvo) break;
    }
  }
  return out;
}
// resumo por cor para o popup (as 3 mais fortes de cada cor + quantas outras)
function p5Resumo(E){
  const out=[];
  for(const cor of [0,1]){
    const L=E.filter(x=>x.alvo===cor).sort((a,b)=>(b.sub==='rb')-(a.sub==='rb')||b.taxa-a.taxa);
    L.slice(0,3).forEach((x,i)=>out.push({...x,txt:x.txt+(i===2&&L.length>3?` <span class="mu">+${L.length-3} de 5s</span>`:'')}));
  }
  return out;
}

function p5Buscar(){

  all.sort((a,b)=>b.rate-a.rate||b.done-a.done||a.skip-b.skip);

    }

  // 🕐 horas pagantes do 10s (minuto:segundo exato), sem ter pago nas tentativas anteriores
  const par=t=>{ const z=W.slice(-40).find(y=>y.t===t); return z?z.p:null; };
  const off=(((Tms/1000)%3600)+3600)%3600;
  for(const r of p10Hp()){
    for(let g=0;g<=2;g++){
      if(r.off+g*10!==off) continue;
      let ok=true; for(let h=0;h<g;h++){ const p=par(Tms-(g-h)*10000); if(p===null||p===r.alvo){ ok=false; break; } }

    }
  }
  // 🤖 robôs criados no banco de 10s
  for(const sig of RB_PENDING){
    if(sig.done||sig.bank!==p10Bank()) continue;
    const rb=RBOTS.find(r=>r.id===sig.rbId); if(!rb||!rb.on||rb.cfPop===false) continue;

}

// =================== 💪 FORÇA DO SINAL (aprende com as entradas que já fecharam) ===================
// Cada entrada fechada (Confluência 1 e 2) guarda: quantos sinais apoiavam, quantos eram contra, quantos ⭐100%,
// e o que apareceu junto no popup (robôs, horas pagantes, colunas, ⏱5s) a favor e contra.
// Para cada faixa dessas o sistema vê quantas vezes deu green até G2. A força junta tudo isso (com amortecimento,
// porque as confirmações andam juntas) e compara com a média geral.
const FZ_TIPOS=[['rob','🤖 robôs'],['hp','⏰ horas pagantes'],['col','🧱 colunas'],['p5','⏱ 5s/10s']];
let FZ={key:'',m:null};
function fzFaixaAp(n){ return n<=3?'3':n<=5?'4–5':n<=9?'6–9':n<=15?'10–15':'16+'; }
function fzFaixaEx(a,c){ if(!a&&!c) return 'nenhum'; const d=a-c; return d<0?'mais contra':d===0?'empatado':d===1?'+1 a favor':'+2 ou mais'; }
// características de uma entrada (do relatório ou ao vivo)
function fzFeat(o){
  const ex=o.extras||[], F={};
  F.ap='ap:'+fzFaixaAp(o.ap||0);
  F.c='c:'+(o.c>=2?'2+':o.c||0);
  F.s='s:'+(o.s100>=2?'2+':o.s100||0);
  for(const [t] of FZ_TIPOS){ const a=ex.filter(e=>e.tipo===t&&e.alvo===o.alvo).length, c=ex.filter(e=>e.tipo===t&&e.alvo!==o.alvo).length; F[t]=t+':'+fzFaixaEx(a,c); }
  return F;
}
function fzRows(){
  const r1=CF.log.filter(x=>x.res==='green'||x.res==='red').map(x=>({T:x.T0,alvo:x.alvo,ap:x.apoios?.[0]?.n??x.sinais.length,c:x.apoios?.[0]?.c||0,s100:x.n100??cfTop(x.sinais),extras:x.extras||[],y:x.res==='green'?1:0,nv:x.res==='green'?x.nivel:3,forca:x.forca}));
  const r2=(typeof CF2!=='undefined'?CF2.log:[]).filter(x=>x.res!=='sem dado').map(x=>({T:x.T0,alvo:x.alvo,ap:x.apoio0,c:x.contra||0,s100:x.n100||0,extras:x.extras||[],y:x.res==='green'&&x.nivel<=2?1:0,nv:x.res==='green'?x.nivel:9,forca:x.forca}));
  return r1.concat(r2);
}
const fzLogit=p=>Math.log(p/(1-p)), fzSig=z=>1/(1+Math.exp(-z));
function fzModelo(){
  const key=CF.log.length+'|'+(typeof CF2!=='undefined'?CF2.log.length:0);
  if(FZ.key===key && FZ.m) return FZ.m;
  const R=fzRows(), n=R.length, g=R.filter(r=>r.y).length;
  const base=n?(g+1)/(n+2):0.85, K=8, B={};
  for(const r of R){ const F=fzFeat(r); for(const k in F){ const b=B[F[k]]||(B[F[k]]={n:0,g:0}); b.n++; b.g+=r.y; } }
  for(const k in B){ const b=B[k]; b.rate=b.g/b.n; b.suave=(b.g+K*base)/(b.n+K); }
  FZ={key,m:{n,g,base,B}}; return FZ.m;
}
// força de 0 a 100 + estimativa de green até G2 + o que pesou
function fzForca(o){
  const M=fzModelo(), F=fzFeat(o), base=Math.min(0.995,Math.max(0.02,M.base));
  let z=fzLogit(base); const peso=[];
  for(const k in F){
    const b=M.B[F[k]]; if(!b) continue;
    const p=Math.min(0.995,Math.max(0.02,b.suave)), d=0.6*(fzLogit(p)-fzLogit(base));
    z+=d; peso.push({f:F[k],d,rate:b.rate,n:b.n});
  }
  const p=fzSig(z), forca=Math.round(Math.max(0,Math.min(100,50+30*(z-fzLogit(base)))));
  return {forca,p,base,n:M.n,peso:peso.sort((a,b)=>Math.abs(b.d)-Math.abs(a.d))};
}
function fzNivel(f){ return f>=75?{t:'💎 FORTE',c:'#22c55e',d:'confirmações que mais pagaram até agora'}:f>=58?{t:'🟢 BOM',c:'#84cc16',d:'acima da média do histórico'}:f>=43?{t:'⚪ NA MÉDIA',c:'#a3a3a3',d:'parecido com a média'}:f>=25?{t:'🟠 ABAIXO DA MÉDIA',c:'#f59e0b',d:'essas confirmações falharam mais que o normal'}:{t:'🔴 FRACO',c:'#ef4444',d:'historicamente esse tipo de sinal falha — cuidado'}; }
function fzNome(f){
  const [k,v]=f.split(':'), T=Object.fromEntries(FZ_TIPOS);
  if(k==='ap') return `${v} sinais de apoio`; if(k==='c') return `${v} sinal(is) contra`; if(k==='s') return `${v} ⭐100%`;

// =================== 🔗 INTERLIGADO (5s + 10s + 20s juntos · só 100%) ===================

const IL_TEMPOS=[5,10,20,30];

const IL_NT=['TS','G1','G2'];
// ---------- 🔬 lista 100% de cada tempo (refeita a cada 3 min) ----------
function ilLista(s,W){
  const B=IL.bk[s]||(IL.bk[s]={});
  const key=[ilNivel(),ilMinCasos(),cfg.il_pulo,cfg.sc_sum_min,cfg.sc_sum_max,cfg.il_n,curSym()].join('|');
  if(B.lista && B.key===key && Date.now()-B.t<180000) return B.lista;
  if(B.lista && Date.now()-(IL.calcT||0)<2000) return B.lista;           // um tempo por vez, para não travar a tela
  const t0=performance.now(), nivel=ilNivel(), min=ilMinCasos(), pulo=Math.max(0,Math.min(40,+(cfg.il_pulo??15)));
  let all=[]; for(const f of ['somas','duplas','trios','numeros']) all=all.concat(scScanFamily(W,f,pulo,nivel,min,0));
  B.lista=all.filter(x=>x.red===0 && x.done>=min).sort((a,b)=>b.done-a.done).slice(0,400);
  B.key=key; B.t=Date.now(); B.n=W.length; B.ms=Math.round(performance.now()-t0); IL.calcT=Date.now();

// ---------- 🕐 horas pagantes 100% de cada tempo (refeitas a cada 10 min) ----------
function ilHp(s){

  const key=[ilNivel(),cfg.il_hpMin,cfg.hpPer,curSym()].join('|');
  if(H.rows && H.key===key && Date.now()-H.t<600000) return H.rows;
  H.key=key; H.t=Date.now(); H.rows=[];
  try{
    const W=liveW(d5BankName(s))||[]; if(W.length<500) return H.rows;
    const per=Math.max(6,+cfg.hpPer||24), G=gridBuild(W,s,W.at(-1).t-per*3600e3); if(!G) return H.rows;
    const lv=ilNivel(), min=Math.max(2,+(cfg.il_hpMin??6));
    H.rows=hpScan(G,'all').filter(r=>r.L[lv].n>=min && r.L[lv].ok===r.L[lv].n).map(r=>({off:r.off,alvo:r.alvo,n:r.L[lv].n}));
  }catch(e){ console.warn('interligado horas',e); }
  return H.rows;
}
// ---------- 🤖 robôs do tempo: só entram se estão 100% no nível escolhido ----------
function ilRbOk(rb,W){

function ilChave(s,kind,id,skip,alvo){ return `${s}|${kind}|${id}|${skip}|${alvo}`; }
// tudo que o tempo s aponta (entradas futuras no TS)
function ilAponta(s){
  const W=ilW(s); if(!ilFresco(W,s)) return [];
  const out=[], stepMs=s*1000, C={}, vistos=new Set();
  const add=(o,chave)=>{ if(vistos.has(chave)) return; vistos.add(chave); out.push(o); };
  if(+(cfg.il_sc??1)) for(const o of ilLista(s,W)){
    for(const x of scLive(W,o,0,C,stepMs)) if(x.st==='armado')
      add({s,tipo:'sc',txt:`${o.kind} ${o.gat} · pula ${o.skip}`,alvo:o.alvo,T:x.entT,casos:o.done},ilChave(s,o.kind.startsWith('Soma')?'Soma':o.kind,o.pair||(o.d!=null?o.d:o.n+'/'+o.mod),o.skip,o.alvo)+'|'+x.entT);
  }
  if(+(cfg.il_rb??1)){
    const bank=d5BankName(s);
    for(const sig of RB_PENDING){
      if(sig.done||sig.bank!==bank) continue;
      const rb=RBOTS.find(r=>r.id===sig.rbId); if(!rb||!rb.on) continue;
      const st=ilRbOk(rb,W); if(!st.ok) continue;
      const kind=rb.tipo==='trio'?'Trio':rb.tipo==='dupla'?'Dupla':rb.tipo==='num'?'Número':rb.tipo==='soma'?'Soma':rb.tipo, id=rb.tipo==='trio'?`${rb.a}-${rb.b}-${rb.c}`:rb.tipo==='dupla'?`${rb.a}-${rb.b}`:rb.tipo==='num'?rb.d:rb.tipo==='soma'?rb.n+'/'+rb.mod:rb.id;
      const ch=ilChave(s,kind,id,rb.skip,rb.alvo)+'|'+sig.entryT;
      if(vistos.has(ch)){ const o=out.find(x=>x.T===sig.entryT&&x.tipo==='sc'&&x.alvo===rb.alvo&&x.s===s); if(o){ o.tipo='rb'; o.txt=`🤖 ${rbName(rb)}`; } continue; }  // mesmo padrão do scanner = conta uma vez só
      add({s,tipo:'rb',txt:`🤖 ${rbName(rb)}`,alvo:sig.alvo,T:sig.entryT,casos:st.done},ch);
    }
  }
  if(+(cfg.il_hp??1)){
    const agora=Date.now()/1000, hz=Math.max(30,+(cfg.il_horiz??90));
    for(const r of ilHp(s)){ const T=hpNext(r.off); if(T-agora<=hz) add({s,tipo:'hp',txt:`🕐 Horas pagantes :${msOf(r.off)} · ${r.n}h seguidas 100%`,alvo:r.alvo,T:T*1000,casos:r.n},`${s}|hp|${r.off}|${r.alvo}`); }
  }
  return out;
}
// junta os três tempos por segundo
function ilColeta(){
  const agora=srvNow()*1000, hz=agora+Math.max(30,+(cfg.il_horiz??90))*1000, M=new Map();
  for(const s of ilTempos()){
    let L=[]; try{ L=ilAponta(s); }catch(e){ console.warn('interligado '+s+'s',e); }
    for(const x of L){
      if(x.T<=agora||x.T>hz||x.T%(ilAlvoS()*1000)) continue;            // só os segundos do jogo alvo (padrão: 20s)
      const g=M.get(x.T)||{T:x.T,f:{0:[],1:[]}}; g.f[x.alvo].push(x); M.set(x.T,g);
    }
  }
  return [...M.values()].sort((a,b)=>a.T-b.T);
}
function ilCond(g,alvo){
  const a=g.f[alvo], c=g.f[1-alvo], tempos=new Set(a.map(x=>x.s)).size;
  if(a.length<ilMinF()) return false;
  if((cfg.il_bloq??1) && c.length) return false;
  if(+(cfg.il_dif??0) && tempos<2) return false;
  return true;
}
// ---------- motor: roda a cada jogo novo de qualquer tempo ----------
function ilScan(){
  const G=ilColeta(); IL.agenda=G; IL.scanT=Date.now();
  const agora=srvNow()*1000, lead=Math.max(1,+(cfg.il_lead??3))*1000;
  for(const g of G){
    const ab=IL.abertas.find(e=>e.T0===g.T);
    if(ab){ if(!ab.fim && ab.g===0 && g.T-agora>1000){ const f=g.f[ab.alvo]; if(f.length>ab.fontes.length) ab.fontes=f.map(ilSlim); ab.contra=Math.max(ab.contra,g.f[1-ab.alvo].length); ilPopRefresh(); } continue; }
    for(const alvo of [0,1]){
      if(!ilCond(g,alvo)) continue;
      if(g.T-agora<lead) continue;                                        // tarde demais para avisar
      const E={id:'IL'+g.T,T0:g.T,alvo,g:0,tent:[],fim:false,abriu:Date.now(),fontes:g.f[alvo].map(ilSlim),n0:g.f[alvo].length,contra:g.f[1-alvo].length,gstep:ilAlvoS()*1000};
      E.forca=ilForca(ilFeatObj(E)).forca;
      IL.abertas.push(E); IL.abertas.sort((a,b)=>a.T0-b.T0);
      beep(); try{ atuAviso(`🔗 Interligado: ${E.fontes.length} fontes 100% → ${NOME(alvo)} às ${hmsOf(g.T/1000)}`,'il'); }catch(e){}
      if(+(cfg.il_pop??1)) ilPopup();

    }
  }
}
function ilSlim(x){ return {s:x.s,tipo:x.tipo,txt:x.txt,casos:x.casos}; }
function ilDig(T){
  for(const s of [5,10,20]){ const W=liveW(d5BankName(s))||[]; for(let i=W.length-1;i>=0&&i>=W.length-80;i--){ if(W[i].t===T) return W[i]; if(W[i].t<T) break; } }
  return null;
}
function ilResolve(){
  const agora=srvNow()*1000;
  for(const E of IL.abertas){
    if(E.fim) continue;
    const Tg=E.T0+E.g*E.gstep; if(agora<Tg) continue;
    const x=ilDig(Tg);
    if(!x){ if(agora>Tg+25000) ilFecha(E,'sem dado'); continue; }
    E.tent.push({g:E.g,T:Tg,d:x.d,p:x.p});
    if(x.p===E.alvo) ilFecha(E,'green');
    else if(E.g>=ilGale()) ilFecha(E,'red');
    else { E.g++; ilPopRefresh(); }
  }
  IL.abertas=IL.abertas.filter(e=>!e.fim||Date.now()-e.fimT<8000);
}

// ---------- 💪 força do interligado (aprende com as entradas dele) ----------
function ilFeatObj(E){ return {n:E.fontes.length,c:E.contra||0,tempos:[...new Set(E.fontes.map(f=>f.s))].sort((a,b)=>a-b),tipos:[...new Set(E.fontes.map(f=>f.tipo))].sort()}; }
function ilFeat(o){
  const n=o.n; return {n:'n:'+(n<=3?'3':n===4?'4':n<=6?'5–6':'7+'),c:'c:'+(o.c>=2?'2+':o.c),t:'t:'+o.tempos.join('+')+'s',k:'k:'+o.tipos.map(t=>({sc:'scanner',rb:'robô',hp:'horas'}[t]||t)).join('+')};
}
function ilModelo(){
  const L=ilLogArr().filter(x=>x.res==='green'||x.res==='red'), key=L.length;
  if(IL.fz.key===key && IL.fz.m) return IL.fz.m;
  const n=L.length, g=L.filter(x=>x.res==='green').length, base=n?(g+1)/(n+2):0.5, K=8, B={};
  for(const x of L){ const F=ilFeat(ilFeatObj(x)); for(const k in F){ const b=B[F[k]]||(B[F[k]]={n:0,g:0}); b.n++; b.g+=x.res==='green'?1:0; } }
  for(const k in B){ const b=B[k]; b.rate=b.g/b.n; b.suave=(b.g+K*base)/(b.n+K); }
  IL.fz={key,m:{n,g,base,B}}; return IL.fz.m;
}
function ilForca(o){
  const M=ilModelo(), F=ilFeat(o), base=Math.min(0.995,Math.max(0.02,M.base));
  let z=fzLogit(base); const peso=[];
  for(const k in F){ const b=M.B[F[k]]; if(!b) continue; const p=Math.min(0.995,Math.max(0.02,b.suave)), d=0.6*(fzLogit(p)-fzLogit(base)); z+=d; peso.push({f:F[k],d,rate:b.rate,n:b.n}); }
  return {forca:Math.round(Math.max(0,Math.min(100,50+30*(z-fzLogit(base))))),p:fzSig(z),base,n:M.n,peso:peso.sort((a,b)=>Math.abs(b.d)-Math.abs(a.d))};
}

// ---------- cenário similar (histórico de situações parecidas) ----------
function ilCenarioSim(E){
  // retorna todos os logs fechados similares a E
  // Similar = mesmo alvo, fontes ±1, pelo menos 1 tempo em comum
  const all=Object.values(IL.log).flat().filter(x=>x.res==='green'||x.res==='red');
  if(!all.length) return null;
  const nF=E.fontes.length, alvo=E.alvo;
  const et=new Set(E.fontes.map(f=>f.s));
  return all.filter(x=>x.alvo===alvo && Math.abs((x.fontes||[]).length-nF)<=1 && (x.fontes||[]).some(f=>et.has(f.s)));
}

// ---------- análise ao vivo dos dígitos 5s no popup ----------
function ilDig5Recent(T0){
  // retorna {ante: ticks antes de T0, wait: ticks a partir de T0}
  const W=LIVE[d5BankName(5)]||[];
  if(!W.length) return {ante:[],wait:[]};
  const ante=W.filter(x=>x.t<T0).slice(-14);
  const wait=W.filter(x=>x.t>=T0).slice(0,30);
  return {ante,wait};
}
function ilDig5Pct(ticks,alvo){
  if(!ticks.length) return null;
  const match=ticks.filter(x=>+x.p===alvo).length;
  return {match,n:ticks.length,pct:Math.round(100*match/ticks.length)};
}
function ilDig5Seq(ticks,n){
  // codifica últimos n ticks como string "0101..." para lookup histórico
  const last=ticks.slice(-n);
  if(last.length<n) return null;
  return last.map(x=>''+((+x.p)?1:0)).join('');
}
function ilDig5DetectPat(ps){
  // ps = array de 0/1 (do mais antigo ao mais novo)
  const n=ps.length; if(n<3) return null;
  // 1. Sequência (streak final)
  let streak=1;
  for(let i=n-2;i>=0;i--){ if(ps[i]===ps[n-1]) streak++; else break; }
  if(streak>=3) return {type:'streak',streak,cor:ps[n-1],next:1-ps[n-1]};
  // 2. Alternado (últimos 4+)
  if(n>=4){
    const l4=ps.slice(-4);
    if(l4.every((v,i)=>i===0||v!==l4[i-1])) return {type:'alt',next:1-ps[n-1]};
  }
  // 3. Bloco 2+2 (PPII ou IIPP)
  if(n>=4){
    const l4=ps.slice(-4);
    if(l4[0]===l4[1]&&l4[2]===l4[3]&&l4[0]!==l4[2]) return {type:'block2',next:l4[0]};
  }
  // 4. Quebra após sequência (XXX→Y, será que volta?)
  if(n>=4){
    const l4=ps.slice(-4);

function ilDig5PadraoHtml(ante,alvo){
  if(ante.length<3) return '';

  const pat=ilDig5DetectPat(ps);
  if(!pat) return '';
  const NC=c=>c===0?'PAR':'ÍMPAR';
  const alvoNome=NC(alvo), outroNome=NC(1-alvo);
  const isFav=(pat.next===alvo);
  const cls=isFav?'ok':'ruim';
  let desc='';
  if(pat.type==='streak') desc=`🔥 ${pat.streak}× ${NC(pat.cor)} seguidos → quebra esperada: <b>${NC(pat.next)}</b>`;
  else if(pat.type==='alt') desc=`🔄 Alternado (P↔I) → próximo seria: <b>${NC(pat.next)}</b>`;
  else if(pat.type==='block2') desc=`🔁 Bloco 2+2 → próximo bloco: <b>${NC(pat.next)}</b>`;
  else if(pat.type==='quebra') desc=`↩ Quebrou sequência → possível continuação: <b>${NC(pat.next)}</b>`;
  // lookup histórico por sequência
  let histHtml='';
  const seq3=ilDig5Seq(ante,3);
  const allLog=Object.values(IL.log).flat().filter(x=>(x.res==='green'||x.res==='red')&&x.dig5seq&&x.alvo===alvo);
  if(allLog.length>=5&&seq3){
    const sim=allLog.filter(x=>x.dig5seq.slice(-3)===seq3);
    if(sim.length>=3){
      const hg=sim.filter(x=>x.res==='green').length, hp=Math.round(100*hg/sim.length);
      const hn=hp>=60?'ok':hp>=40?'mu':'ruim';
      histHtml=` · <span class="${hn}">hist padrão: ${hg}/${sim.length} green (${hp}%)</span>`;
    }
  }
  const bgPat=isFav?'rgba(34,197,94,.08)':'rgba(239,68,68,.08)';
  return `<div style="font-size:10px;padding:3px 8px;border-radius:4px;background:${bgPat};margin-top:3px;border-left:2px solid ${isFav?'var(--g)':'var(--v)'}">📐 Padrão: <span class="${cls}">${desc}</span> <span class="mu">${isFav?'→ '+alvoNome+' favorável':'→ '+outroNome+' esperado (contra)'}</span>${histHtml}</div>`;
}
function ilDig5TiraHtml(ticks,alvo){

}
function ilDig5Html(E){
  if(!E||!E.T0) return '';
  const {ante,wait}=ilDig5Recent(E.T0);
  if(!ante.length&&!wait.length) return '';
  const alvo=E.alvo; // 0=PAR, 1=ÍMPAR
  const alvoNome=alvo===0?'PAR':'ÍMPAR', outroNome=alvo===0?'ÍMPAR':'PAR';
  const all=[...ante,...wait];
  const sAll=ilDig5Pct(all,alvo), sAnte=ilDig5Pct(ante,alvo), sWait=ilDig5Pct(wait,alvo);
  const sLast5=ilDig5Pct(all.slice(-5),alvo);
  // histórico: entradas com padrão pré-sinal parecido
  let histHtml='';
  if(sAnte&&sAnte.n>=5){
    const allLog=Object.values(IL.log).flat().filter(x=>(x.res==='green'||x.res==='red')&&x.dig5pct!=null&&x.alvo===alvo);
    if(allLog.length>=5){
      const sim=allLog.filter(x=>Math.abs(x.dig5pct-sAnte.pct)<=18);
      if(sim.length>=3){
        const hg=sim.filter(x=>x.res==='green').length, hp=Math.round(100*hg/sim.length);
        const hn=hp>=60?'ok':hp>=40?'mu':'ruim';
        histHtml=` · hist parecido: <span class="${hn}">${hg}/${sim.length} green (${hp}%)</span>`;
      }
    }
  }
  // veredito
  let ver='', verCls='mu';
  if(sAll){
    if(sAll.pct>=62){ver='✅ Favorável';verCls='ok';}
    else if(sAll.pct>=40){ver='⚠ Neutro';verCls='mu';}
    else{ver='⛔ Contrário';verCls='ruim';}
    if(sLast5){
      if(sLast5.pct>=60&&sAll.pct<60) ver+=' ↗';
      else if(sLast5.pct<40&&sAll.pct>=40) ver+=' ↘';
    }
  }
  let html=`<div class="ild5wrap">`;
  html+=`<div class="ild5tit">🎲 Dígitos 5s ao vivo · aguardando ${alvoNome}</div>`;
  html+=`<div class="ild5strip">`;
  if(ante.length){html+=`<span class="ild5lbl">antes</span>${ilDig5TiraHtml(ante,alvo)}`;}
  if(wait.length){html+=`<span class="ild5sep"></span><span class="ild5lbl" style="color:var(--am)">espera</span>${ilDig5TiraHtml(wait,alvo)}`;}
  html+=`</div>`;
  if(sAll){
    const bar=`<div style="display:flex;height:4px;border-radius:3px;overflow:hidden;margin-bottom:3px"><div style="flex:${sAll.match};background:var(--g)"></div><div style="flex:${sAll.n-sAll.match};background:var(--v)"></div></div>`;
    html+=bar;
    html+=`<div class="ild5ver">`;
    html+=`<span class="${verCls}"><b>${ver}</b></span> · `;
    html+=`<span class="ok">${sAll.match} ${alvoNome}</span> · <span class="ruim">${sAll.n-sAll.match} ${outroNome}</span> nos últimos ${sAll.n}`;
    if(sWait&&sWait.n>0) html+=` · <span style="color:var(--am)">espera: ${sWait.match}/${sWait.n} ${alvoNome}</span>`;
    html+=histHtml;
    html+=`</div>`;
    // análise de padrão de formação
    html+=ilDig5PadraoHtml(ante,alvo);
  }
  html+=`</div>`;
  return html;
}

// =================== ♻ ROBÔS AUTOMÁTICOS (20s e 5s) — varre a cada N minutos e renova ===================
// Procura padrões de somas, duplas e números com 100% (sem red) no banco de 20s e no de 5s.
// Achou novos 100% → cria os robôs novos e apaga os automáticos antigos que saíram da lista.
// Não achou nenhum 100% → mantém os antigos ligados até aparecerem outros.
// Robôs criados à mão nunca são mexidos. Robô com entrada em andamento só sai depois que ela fecha.
let RA={ultimo:0,rodando:false,log:[]};
function raLoad(){ try{ RA.log=JSON.parse(localStorage.getItem('dpi_ra_log_v1')||'[]')||[]; RA.ultimo=+(localStorage.getItem('dpi_ra_ultimo')||0); }catch(e){} }
function raSave(){ try{ localStorage.setItem('dpi_ra_log_v1',JSON.stringify(RA.log.slice(-60))); localStorage.setItem('dpi_ra_ultimo',String(RA.ultimo)); }catch(e){} }
function raJanelas(){ const J=[]; if(cfg.ra_w20??1) J.push(20); if(cfg.ra_w10??1) J.push(10); if(cfg.ra_w5??1) J.push(5); return J; }
function raAchar(step){
  const bank=d5BankName(step); let W=liveW(bank)||[];
  const lim=step===5?Math.max(2000,+cfg.p5_n||5000):step===10?Math.max(2000,+cfg.p10_n||5000):5000; if(W.length>lim) W=W.slice(-lim);
  if(W.length<500) return {bank,W,lista:null,motivo:`só ${W.length} jogos`};
  const nivel=scNivel(), min=Math.max(5,+(step===5?cfg.ra_min5:step===10?cfg.ra_min10:cfg.ra_min20)||(step===5?30:step===10?25:20)), maxSkip=Math.max(0,Math.min(60,+cfg.ra_pulo||20));
  const cut=(cfg.ra_valid??1)?Math.floor(W.length*0.7):0;
  let all=[]; for(const fam of ['somas','duplas','trios','numeros']) all=all.concat(scScanFamily(W,fam,maxSkip,nivel,min,cut));
  let L=all.filter(x=>x.red===0 && x.done>=min && (!cut || (x.test && x.test.done>=2 && x.test.red===0)));
  L.sort((a,b)=>(b.done+(b.test?.done||0))-(a.done+(a.test?.done||0))||b.sg-a.sg||a.skip-b.skip);
  return {bank,W,lista:L.slice(0,Math.max(1,Math.min(40,+cfg.ra_max||10))),achados:L.length};
}
function raNovoRobo(x,bank){
  const nivel=scNivel(), id=rbIdOf(x,nivel,bank);
  const base={id,skip:x.skip,alvo:x.alvo,maxNivel:nivel,bank,on:true,popup:!!cfg.ra_pop,cfPop:true,auto:true,criadoEm:Date.now(),minOcc:x.done||0,taxaCriacao:x.rate,casos:x.done+(x.test?.done||0)};
  return x.kind==='Trio'?{...base,tipo:'trio',a:x.a,b:x.b,c:x.c}:x.kind==='Dupla'?{...base,tipo:'dupla',a:x.a,b:x.b}:x.kind==='Número'?{...base,tipo:'num',d:x.d}:{...base,tipo:'soma',n:x.n,mod:x.mod};
}
async function raRodar(manual){
  if(RA.rodando) return; if(!(cfg.ra_on??1) && !manual) return;
  RA.rodando=true; RA.ultimo=Date.now();
  try{
    for(const step of raJanelas()){
      await new Promise(r=>setTimeout(r,30));                         // deixa a tela respirar entre os bancos
      const t0=performance.now(), R=raAchar(step), bank=R.bank;
      const velhos=RBOTS.filter(r=>r.auto && r.bank===bank);
      const reg={T:Date.now(),w:step,jogos:R.W.length,achados:R.achados||0,novos:0,removidos:0,mantidos:0,ms:0,obs:''};
      // limpa os que já estavam aposentados e sem entrada aberta
      for(const r of velhos.filter(r=>r.aposentar && !RB_PENDING.some(s=>s.rbId===r.id&&!s.done))){ RBOTS=RBOTS.filter(x=>x.id!==r.id); reg.removidos++; }
      if(!R.lista){ reg.obs=`não varreu: ${R.motivo}`; }
      else if(!R.lista.length){ reg.mantidos=RBOTS.filter(r=>r.auto&&r.bank===bank).length; reg.obs='nenhum 100% novo · antigos continuam'; }
      else{
        const ids=new Set();
        for(const x of R.lista){
          const rb=raNovoRobo(x,bank); ids.add(rb.id);
          const ja=RBOTS.find(r=>r.id===rb.id);
          if(ja){ ja.on=true; ja.aposentar=false; if(ja.auto) ja.casos=rb.casos; reg.mantidos++; }
          else { RBOTS.unshift(rb); reg.novos++; }
        }
        for(const r of RBOTS.filter(r=>r.auto && r.bank===bank && !ids.has(r.id))){
          if(RB_PENDING.some(s=>s.rbId===r.id&&!s.done)) r.aposentar=true;         // sai quando a entrada fechar
          else { RBOTS=RBOTS.filter(x=>x.id!==r.id); reg.removidos++; }
        }
      }
      reg.ms=Math.round(performance.now()-t0);
      RA.log.push(reg);
      try{ if(reg.novos||reg.removidos) atuAviso(`♻ Robôs ${step}s: ${reg.novos} criado(s) · ${reg.removidos} removido(s) · ${reg.mantidos} mantido(s)`,'ra'); else ATU.ult={T:Date.now(),txt:`♻ Varredura ${step}s: ${reg.obs||'nada mudou'}`}; atuRender(); }catch(e){}
    }
    rbSave(); raSave();
    if(['robos','p5','p10','il'].includes(S.tab)) renderTab();
  }catch(e){ console.warn('robôs automáticos',e); }
  finally{ RA.rodando=false; }
}

// =================== 🪤 PEGADINHA: sinais fortes pagando o contrário ===================
// Para cada jogo o sistema guarda quantos sinais (Scanner+Somas) apontavam PAR e ÍMPAR.
// "Sinal forte" = tinha o mínimo de sinais E a cor tinha pelo menos o dobro da outra.
// Mede, nos últimos sinais fortes, quantas vezes o jogo saiu da cor CONTRÁRIA (no tiro seco)

function pgCalc(){
  const W=S.all; if(!W||W.length<50) return null;
  if(!CF.hist) cfHistLoad();
  const step=gameIntervalSec()*1000, key=W.at(-1).t+'|'+Object.keys(CF.hist||{}).length+'|'+cfg.pg_n;
  if(PG.key===key && PG.r) return PG.r;
  const M=new Map(W.slice(-20000).map(x=>[x.t,x])), m=cfMin(), rows=[];
  for(const k of Object.keys(CF.hist||{})){
    const T=+k; if(T%step) continue;
    const r=M.get(T); if(!r||r.p==null) continue;
    const [n0,n1]=CF.hist[k], a=n1>n0?1:0, forte=Math.max(n0,n1), fraco=Math.min(n0,n1);
    if(forte<m || forte<2*fraco) continue;
    rows.push({T,alvo:a,n:forte,c:fraco,ok:r.p===a});
  }
  rows.sort((x,y)=>x.T-y.T);
  const N=Math.max(6,+cfg.pg_n||15), rec=rows.slice(-N), base=rows.length?rows.filter(x=>!x.ok).length/rows.length:0.5;
  const contra=rec.filter(x=>!x.ok).length, r=rec.length?contra/rec.length:0;
  let seq=0; for(let i=rec.length-1;i>=0&&!rec[i].ok;i--) seq++;
  // entradas de verdade dos popups (Confluência 1 e 2): quantas perderam o TS nas últimas 10
  const E=CF.log.concat(typeof CF2!=='undefined'?CF2.log:[]).filter(x=>x.tent&&x.tent[0]&&x.tent[0].d!=null).sort((a,b)=>a.T0-b.T0).slice(-10);
  const eTs=E.filter(x=>x.tent[0].p!==x.tent[0].alvo).length;
  let nivel='aprendendo', cor='#64748b';
  if(rec.length>=6){
    const dif=r-base;
    if(dif>=0.20||seq>=4){ nivel='ALTA'; cor='#ef4444'; }
    else if(dif>=0.10||seq>=3){ nivel='MÉDIA'; cor='#f59e0b'; }
    else if(dif<=-0.10){ nivel='mercado a favor'; cor='#22c55e'; }
    else { nivel='normal'; cor='#a3a3a3'; }
  }
  PG.key=key; PG.r={nivel,cor,rec,contra,r,base,seq,total:rows.length,eTs,eN:E.length};
  if(PG.nivelAnt && PG.nivelAnt!==nivel && ['ALTA','MÉDIA'].includes(nivel)) atuAviso(`🪤 Pegadinha ${nivel}: ${contra} de ${rec.length} sinais fortes pagaram o contrário (normal ${(base*100).toFixed(0)}%)`,'pg');
  else if(PG.nivelAnt && ['ALTA','MÉDIA'].includes(PG.nivelAnt) && !['ALTA','MÉDIA'].includes(nivel)) atuAviso(`🪤 Pegadinha voltou ao ${nivel}`,'pg');
  PG.nivelAnt=nivel;
  return PG.r;
}

// =================== 🧪 SIMULADOR: esperar X reds seguidos → entrar até tomar Y red(s) → recuperar ===================
// Roda em cima das entradas reais dos popups (Confluência 1 ou 2).
// Esperando: só observa (não aposta) até sair X reds seguidos.
// Apostando: entra em todas as entradas; o gale recupera o que perdeu na entrada; se "recuperar red" estiver ligado,
// a próxima aposta também embute o red que ficou para trás. Ao tomar Y red(s) volta a esperar.
function srdSeq(){
  const fonte=cfg.srd_fonte||'c1', G=Math.max(0,+(cfg.srd_gale??2));
  if(fonte==='c2') return (typeof CF2!=='undefined'?CF2.log:[]).filter(x=>x.res!=='sem dado').map(x=>({T:x.T0,alvo:x.alvo,nv:x.res==='green'?x.nivel:99}))
    .sort((a,b)=>a.T-b.T).map(x=>({...x,red:x.nv>G}));
  return CF.log.filter(x=>x.res==='green'||x.res==='red').map(x=>({T:x.T0,alvo:x.alvo,nv:x.res==='green'?x.nivel:99}))
    .sort((a,b)=>a.T-b.T).map(x=>({...x,red:x.nv>Math.min(G,2)}));
}
function srdRodar(L,opt){
  const {esp,para,pay,base,G,rec,conta,ini}=opt;
  let st='esperando', seq=0, reds=0, pend=0, saldo=ini, minS=ini, pico=ini, maxDD=0, maxAp=0, maxRisco=0;
  const R=[]; let ap=0, gr=0, rd=0;
  for(const x of L){
    if(st==='esperando'){
      if(x.red) seq++; else seq=0;
      R.push({x,st:'👀 esperando',obs:`${seq} red(s) seguidos`,saldo});
      if(seq>=esp){ st='apostando'; seq=0; reds=0; }
      continue;
    }
    // apostando: monta as apostas da escada TS..G
    const st0=[]; let perdido=pend;
    for(let g=0;g<=G;g++){ const s=Math.max(0.01,Math.round(((perdido+base*pay)/pay)*100)/100); st0.push(s); perdido+=s; }
    const risco=st0.reduce((a,b)=>a+b,0); maxRisco=Math.max(maxRisco,risco);
    ap++;
    let gasto=0, lucro=0, nivel=-1;
    for(let g=0;g<=G;g++){
      gasto+=st0[g]; maxAp=Math.max(maxAp,st0[g]);
      if(!x.red && x.nv===g){ lucro=st0[g]*pay-(gasto-st0[g]); nivel=g; break; }
    }
    if(nivel<0) lucro=-gasto;
    saldo=Math.round((saldo+lucro)*100)/100;
    if(nivel>=0){ gr++; pend=0; }
    else { rd++; reds++; pend=rec?Math.round((pend+gasto)*100)/100:0; }
    pico=Math.max(pico,saldo); minS=Math.min(minS,saldo); maxDD=Math.max(maxDD,pico-saldo);
    R.push({x,st:'💰 apostando',stakes:st0,nivel,gasto,lucro,saldo,pend});
    if(nivel<0 && reds>=para){ st='esperando'; seq=conta?1:0; reds=0; }
  }
  return {R,ap,gr,rd,saldo,lucro:saldo-ini,minS,maxDD,maxAp,maxRisco,pend,st};
}
function srdOpt(){ return {esp:Math.max(0,+(cfg.srd_esp??2)),para:Math.max(1,+(cfg.srd_para??1)),pay:Math.max(0.05,(+(cfg.srd_pay??85))/100),base:Math.max(0.01,+(cfg.srd_base??1)),
  G:Math.max(0,Math.min((cfg.srd_fonte||'c1')==='c2'?9:2,+(cfg.srd_gale??2))),rec:(cfg.srd_rec??1)?1:0,conta:cfg.srd_conta?1:0,ini:+(cfg.srd_ini??100)||100}; }

  return `<div class="panel srdpanel"><h3>🧪 Simulador: esperar ${o.esp} red(s) seguidos → entrar até tomar ${o.para} red <small>nas entradas reais dos popups</small></h3>

      <label>Payout % ${inp('srd_pay',45)}</label>

      <label><input type="checkbox" ${(cfg.srd_rec??1)?'checked':''} onchange="cfg.srd_rec=this.checked?1:0;saveCfg();fillRes()"> próxima entrada recupera o red</label>

    <div class="nota">Agora: <b>${S1.st==='esperando'?'👀 esperando '+o.esp+' reds seguidos':'💰 apostando'}</b>. Nas entradas reais, depois de ${o.esp} reds seguidos a próxima deu red em
      ${(()=>{ let n=0,r=0,s=0; for(const x of L){ if(s>=o.esp && o.esp>0){ n++; if(x.red) r++; } s=x.red?s+1:0; } return n?`<b>${r} de ${n}</b> (${(100*r/n).toFixed(0)}%) — em todas as entradas o red foi ${(100*L.filter(x=>x.red).length/L.length).toFixed(0)}%`:'nenhum caso ainda'; })()}.</div>
    <div class="tw" style="max-height:340px"><table><tr><th>Entrada</th><th>Estado</th><th>Resultado</th><th style="text-align:left">Apostas (TS→G)</th><th>Lucro</th><th>Saldo</th><th>Pendente</th></tr>
      ${ult.map(r=>`<tr class="${r.stakes?'scativo':''}"><td>${fmtT(r.x.T)}</td><td>${r.st}</td><td class="${r.x.red?'ruim':'ok'}"><b>${r.x.red?'❌ RED':'✅ '+nvG(r.x.nv)}</b></td>
        <td style="text-align:left;font-size:11px">${r.stakes?r.stakes.map((s,g)=>`<span class="${g===r.nivel?'ok':g<(r.nivel<0?99:r.nivel)?'ruim':'mu'}">${nvG(g)} ${s.toFixed(2)}</span>`).join(' · '):`<span class="mu">${r.obs}</span>`}</td>

// =================== 🧠 ESTRATÉGIAS NA CONTA DEMO (1ª: "popup" = entradas da Confluência 1) ===================
// Cada estratégia recebe os sinais, decide se entra (esperar X reds, depois do red esperar X wins, stops)
// e manda a ordem pelo motor da conta DEMO (que acerta o segundo do jogo). Só opera em conta DEMO.
const ES_ESTR={ popup:{nome:'🎯 Popup (Confluência 1)',desc:'entra em cada tentativa que o popup da confluência abre (TS, G1, G2 esperando o próximo sinal)'} };
let ES={estado:'desligada',seqR:0,seqW:0,pend:0,perdEnt:0,entId:null,pl:0,n:0,g:0,r:0,pay:0.95,log:[],ini:null,motivo:''};
function esLoad(){ try{ Object.assign(ES,JSON.parse(localStorage.getItem('dpi_es_v1')||'{}')); }catch(e){} }
function esSave(){ try{ localStorage.setItem('dpi_es_v1',JSON.stringify({...ES,log:ES.log.slice(-300)})); }catch(e){} }
function esBase(){ return Math.max(0.35,Math.round((+cfg.es_base||0.35)*100)/100); }
function esGale(){ return Math.max(0,Math.min(2,+(cfg.es_gale??2))); }
function esStake(g,perdEnt,pend){
  const b=esBase(), pay=ES.pay||0.95;
  if(g===0 && !pend) return b;
  if((cfg.es_modo||'rec')==='rec') return Math.max(0.35,Math.round(((pend+perdEnt+b*pay)/pay)*100)/100);
  return Math.max(0.35,Math.round(b*Math.pow(+cfg.es_mult||2.1,g)*100)/100);
}
function esEstadoInicial(){ return (+cfg.es_aposRed||0)>0?'esperando reds':'livre'; }
function esLigar(on){
  cfg.es_on=on?1:0; saveCfg();
  if(on){ ES.estado=esEstadoInicial(); ES.seqR=0; ES.seqW=0; ES.motivo=''; if(!ES.ini){ ES.ini=Date.now(); } atuAviso(`🧠 Estratégia ${ES_ESTR[cfg.es_estr||'popup'].nome} ligada · ${ES.estado}`,'es'); }
  else { ES.estado='desligada'; atuAviso('🧠 Estratégia desligada','es'); }
  esSave(); if(S.tab==='demo') renderTab();
}
function esZerar(){ Object.assign(ES,{pend:0,perdEnt:0,entId:null,pl:0,n:0,g:0,r:0,log:[],ini:Date.now(),motivo:'',seqR:0,seqW:0,estado:cfg.es_on?esEstadoInicial():'desligada'}); esSave(); if(S.tab==='demo') renderTab(); }
// o que impede de entrar agora
function esPode(){
  if(!cfg.es_on) return 'estratégia desligada';
  if(!DM.ok||!DM.virt) return 'conta DEMO não conectada';
  const sw=+cfg.es_sw||0, sl=+cfg.es_sl||0;
  if(sw>0 && ES.pl>=sw){ esParar(`🏁 stop win +${ES.pl.toFixed(2)}`); return ES.motivo; }
  if(sl>0 && ES.pl<=-sl){ esParar(`🛑 stop loss ${ES.pl.toFixed(2)}`); return ES.motivo; }
  if(ES.estado==='parado') return ES.motivo||'parada';
  return '';
}
function esParar(m){ if(ES.estado!=='parado') atuAviso(`🧠 Estratégia parou: ${m}`,'es'); ES.estado='parado'; ES.motivo=m; esSave(); }
// chamado quando o popup abre uma tentativa (entrada nova ou gale)
function esSinal(A){
  if((cfg.es_estr||'popup')!=='popup' || !cfg.es_on || !A || A.fim) return;
  const bloq=esPode(); if(bloq) return;
  if(ES.estado!=='livre') return;                                   // esperando reds / wins
  if(A.g>esGale()) return;
  if(!/^DERIV /.test(cfg.bank)){ ES.motivo='abra um banco DERIV (ex.: R_100 · 20s)'; return; }
  if(ES.entId!==A.id){ ES.entId=A.id; ES.perdEnt=0; }
  const stake=esStake(A.g,ES.perdEnt,+(cfg.es_rec??1)?ES.pend:0), max=+cfg.es_max||0;
  if(max>0 && stake>max){ esParar(`aposta ${stake.toFixed(2)} passaria do máximo ${max}`); return; }
  A.esStake=stake;
  dmRegistrar({key:'es|'+A.id+'|'+A.g,src:'estratégia',es:true,esEnt:A.id,nome:`🧠 popup ${NIVEL[A.g]}`,sym:curSym(),T:A.Tcur/1000,step:gameIntervalSec(),maxN:0,ct:A.alvoCur?'DIGITODD':'DIGITEVEN',stakeFix:stake,ratio:ES.pay});
  esSave();
}
// resultado de cada contrato comprado pela estratégia
function esResultado(o,t,won){
  ES.n++; ES.pl=Math.round((ES.pl+t.profit)*100)/100;
  if(t.payout&&t.pago) ES.pay=(t.payout-t.pago)/t.pago;
  if(won){ ES.g++; ES.pend=0; ES.perdEnt=0; }
  else { ES.r++; ES.perdEnt=Math.round((ES.perdEnt+t.stake)*100)/100; }
  ES.log.push({t:Date.now(),nome:o.nome,stake:t.stake,profit:t.profit,won,bal:DM.bal,pl:ES.pl});
  esSave(); esPode(); if(S.tab==='demo') esLive();
}
// quando a entrada do popup fecha (green/red até G2): anda os contadores e decide o próximo estado
function esFechou(x){
  if(!cfg.es_on || !x) return;
  const red=x.res==='red'||(x.res==='green'&&x.nivel>esGale()), green=!red && x.res==='green';
  if(ES.entId && x.T0 && ES.perdEnt>0 && red){ if(+(cfg.es_rec??1)) ES.pend=Math.round((ES.pend+ES.perdEnt)*100)/100; ES.perdEnt=0; }
  const aR=+cfg.es_aposRed||0, aW=+cfg.es_aposWin||0;
  if(ES.estado==='esperando reds'){ ES.seqR=red?ES.seqR+1:0; if(ES.seqR>=aR){ ES.estado='livre'; ES.seqR=0; atuAviso(`🧠 ${aR} reds seguidos → estratégia entra na próxima`,'es'); } }
  else if(ES.estado==='esperando wins'){ ES.seqW=green?ES.seqW+1:0; if(ES.seqW>=aW){ ES.estado=aR>0?'esperando reds':'livre'; ES.seqW=0; atuAviso(`🧠 ${aW} wins seguidos → ${ES.estado}`,'es'); } }
  else if(ES.estado==='livre' && red){
    if(aW>0){ ES.estado='esperando wins'; ES.seqW=0; }
    else if(aR>0){ ES.estado='esperando reds'; ES.seqR=0; }
  }
  esSave(); if(S.tab==='demo') esLive();
}
// ---------- simulação da mesma estratégia no histórico do popup (dinheiro de mentira) ----------
function esSimular(){
  const L=CF.log.filter(x=>x.res==='green'||x.res==='red').sort((a,b)=>a.T0-b.T0), pay=ES.pay||0.95, b=esBase(), G=esGale();
  const aR=+cfg.es_aposRed||0, aW=+cfg.es_aposWin||0, sw=+cfg.es_sw||0, sl=+cfg.es_sl||0, rec=+(cfg.es_rec??1);
  let st=aR>0?'esperando reds':'livre', sR=0, sW=0, pend=0, pl=0, n=0, g=0, r=0, maxAp=0, pico=0, dd=0, parou='';
  for(const x of L){
    if(parou) break;
    const tent=(x.tent||[]).filter(t=>t.d!=null);
    let hit=-1; for(let i=0;i<tent.length&&i<=G;i++) if(tent[i].p===tent[i].alvo){ hit=i; break; }
    const red=hit<0;
    if(st==='livre'){
      let perd=0;
      for(let i=0;i<tent.length&&i<=G;i++){
        const s=i===0&&!pend?b:(cfg.es_modo||'rec')==='rec'?Math.max(0.35,(pend+perd+b*pay)/pay):b*Math.pow(+cfg.es_mult||2.1,i);
        maxAp=Math.max(maxAp,s); n++;
        if(i===hit){ pl+=s*pay; g++; pend=0; perd=0; break; } else { pl-=s; perd+=s; r++; }
      }
      if(red){ if(rec) pend+=perd; if(aW>0){ st='esperando wins'; sW=0; } else if(aR>0){ st='esperando reds'; sR=0; } }
      pico=Math.max(pico,pl); dd=Math.max(dd,pico-pl);
      if(sw>0&&pl>=sw) parou='stop win'; if(sl>0&&pl<=-sl) parou='stop loss';
    } else if(st==='esperando reds'){ sR=red?sR+1:0; if(sR>=aR){ st='livre'; sR=0; } }
    else if(st==='esperando wins'){ sW=!red?sW+1:0; if(sW>=aW){ st=aR>0?'esperando reds':'livre'; sW=0; } }
  }
  return {L:L.length,n,g,r,pl,maxAp,dd,parou,pend};
}

function dmAppId(){ return String(cfg.dm_appId||'').trim().replace(/[^A-Za-z0-9_-]/g,''); }
function dmAppNovo(){ return /[A-Za-z]/.test(dmAppId()); }          // App ID com letras = portal novo (developers.deriv.com)
function dmRedir(){ return location.origin+'/'; }
function dmB64u(buf){ return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
async function dmOAuth(){
  const id=dmAppId();
  if(!id){ alert('Primeiro coloque o App ID do seu aplicativo Deriv (veja o passo a passo logo abaixo do botão).'); return; }
  if(!dmAppNovo()){ location.href=`https://oauth.deriv.com/oauth2/authorize?app_id=${id}&l=PT`; return; }
  if(!/^https:/.test(location.origin)){ alert('O login da Deriv só funciona com o site aberto pelo endereço da Netlify (https).'); return; }
  const v=dmB64u(crypto.getRandomValues(new Uint8Array(48))), st=dmB64u(crypto.getRandomValues(new Uint8Array(16)));
  const ch=dmB64u(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)));
  try{ localStorage.setItem('dpi_demo_tok_pkce',JSON.stringify({v,st,id,r:dmRedir(),t:Date.now()})); }catch(e){}
  const q=new URLSearchParams({response_type:'code',client_id:id,redirect_uri:dmRedir(),scope:'trade',state:st,code_challenge:ch,code_challenge_method:'S256'});
  location.href='https://auth.deriv.com/oauth2/auth?'+q.toString();
}
async function dmApi(corpo){
  const r=await fetch('/api/deriv',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(corpo)});
  let j={}; try{ j=await r.json(); }catch(e){ j={erro:'função /api/deriv não respondeu ('+r.status+')'}; }
  if(!r.ok||j.erro){ const e=new Error(j.erro||('erro '+r.status)); e.status=r.status; throw e; }
  return j;
}

async function dmConectarNovo(oa){
  dmSet('🔐 Pedindo à Deriv o acesso da conta DEMO…');
  let j;
  try{ j=await dmApi({acao:'otp',client_id:oa.id,token:oa.at}); }

    if(e.status===401 && oa.rt){
      try{ const n=await dmApi({acao:'renova',client_id:oa.id,refresh:oa.rt}); oa={...oa,at:n.access_token,rt:n.refresh_token||oa.rt}; localStorage.setItem('dpi_demo_tok_oa2',JSON.stringify(oa)); j=await dmApi({acao:'otp',client_id:oa.id,token:oa.at}); }

    } else { dmSet('⛔ '+e.message+(e.status===401?' — clique de novo em 🔐 ENTRAR COM A DERIV.':'')); return; }
  }
  if(!/\/ws\/demo/.test(j.url)){ dmSet('⛔ Endereço recebido não é de conta DEMO — bloqueado.'); return; }

// índices onde a paridade completou exatamente X vezes seguidas (chave "cor|X")
function scSeqMap(W,maxX){
  const M=new Map(); let run=0;
  for(let i=0;i<W.length;i++){
    run=(i&&W[i].p===W[i-1].p)?run+1:1;
    if(run<=maxX){ const k=`${W[i].p}|${run}`; if(!M.has(k)) M.set(k,[]); M.get(k).push(i); }
  }
  return M;
}
// ---------- duplas de números ----------
function scPairMap(W){
  const M=new Map();
  for(let i=1;i<W.length;i++){
    if(W[i-1].d==null || W[i].d==null) continue;
    const key=`${W[i-1].d}-${W[i].d}`;
    if(!M.has(key))M.set(key,[]);
    M.get(key).push(i); // gatilho termina na 2ª pedra
  }
  return M;
}
// ---------- trios de números ----------
function scTrioMap(W){
  const M=new Map();
  for(let i=2;i<W.length;i++){
    if(W[i-2].d==null||W[i-1].d==null||W[i].d==null) continue;
    const key=`${W[i-2].d}-${W[i-1].d}-${W[i].d}`;
    if(!M.has(key))M.set(key,[]);
    M.get(key).push(i); // gatilho termina na 3ª pedra
  }
  return M;
}
function scScanPairs(W, maxSkipOverride=null){
  const out=[];
  const minOcc=Math.max(3,+cfg.rb_auto_min||+cfg.sc_min||3);
  const maxSkip=Math.max(0,Math.min(500, maxSkipOverride==null ? (+cfg.rb_auto_pulo||500) : +maxSkipOverride));
  const M=scPairMap(W);
  for(const [pair,starts] of M){
    for(let skip=0;skip<=maxSkip;skip++){
      for(const alvo of [0,1]){
        const s=scEval(W,starts,alvo,skip,+cfg.rb_auto_nivel||0);
        if(s.done>=minOcc){
          const [a,b]=pair.split('-').map(Number);
          out.push({kind:'Dupla',pair,a,b,gat:pair,skip,alvo,...s});
        }
      }
    }
  }
  return out.sort((a,b)=>b.rate-a.rate||b.done-a.done||a.skip-b.skip);
}
function rbPairName(rb){
  return `Dupla ${rb.a}-${rb.b} · pula ${rb.skip} · ${NOME(rb.alvo)} até G2`;
}

let RB_PENDING=[];
let RB_LOG=[];
function rbKey(){ return 'dpi_robos_soma_v1'; }
function rbLoad(){
  try{ RBOTS=JSON.parse(localStorage.getItem(rbKey())||'[]')||[]; }catch(e){ RBOTS=[]; }
  try{ RB_LOG=JSON.parse(localStorage.getItem('dpi_robos_log_v1')||'[]')||[]; }catch(e){ RB_LOG=[]; }
}
function rbSave(){ try{ localStorage.setItem(rbKey(),JSON.stringify(RBOTS.slice(0,300))); }catch(e){} }
function rbSaveLog(){ try{ localStorage.setItem('dpi_robos_log_v1',JSON.stringify(RB_LOG.slice(-800))); }catch(e){} }
function rbStep(rb){ return bankIntervalSec(rb.bank)||gameIntervalSec(); }
function rbNivel(rb){ return rb.maxNivel==null?2:+rb.maxNivel; }
function rbNivelNome(rb){ const n=rbNivel(rb); return n===0?'TIRO SECO':(n===1?'até G1':'até G2'); }
function rbGat(rb){
  if(rb.tipo==='dupla') return `Dupla ${rb.a}-${rb.b}`;
  if(rb.tipo==='trio') return `Trio ${rb.a}-${rb.b}-${rb.c}`;
  if(rb.tipo==='num') return `Número ${rb.d}`;
  if(rb.tipo==='seq') return `${rb.x}× ${rb.c?'ÍMPAR':'PAR'} seguidos`;
  return `Σ${rb.n} %10 = ${rb.mod}`;
}
function rbName(rb){ return `${rb.auto?'♻ ':''}${rbGat(rb)} · pula ${rb.skip} · ${NOME(rb.alvo)} · ${rbNivelNome(rb)}`; }
function rbBankTag(rb){ return rb.bank?`<span class="scanbadge">${rb.bank.replace('DERIV R_100 · ','R_100 ')}</span>`:'<span class="scanbadge">banco aberto</span>'; }
function rbIdOf(x,nivel,bank){
  const base = (x.kind==='Trio'||x.tipo==='trio') ? `T|${x.a}|${x.b}|${x.c}` : (x.kind==='Dupla'||x.tipo==='dupla') ? `D|${x.a}|${x.b}` : (x.kind==='Número'||x.tipo==='num') ? `N|${x.d}` : (x.kind==='Sequência'||x.tipo==='seq') ? `Q|${x.c}|${x.x}` : `S|${x.n}|${x.mod}`;
  return `${base}|${x.skip}|${x.alvo}|${nivel}|${bank||''}`;
}
function rbCreate(x){
  const nivel=+cfg.rb_auto_nivel||0, bank=cfg.bank;
  const id=rbIdOf(x,nivel,bank);
  let rb=RBOTS.find(r=>r.id===id);
  if(rb){ rb.on=true; rbSave(); return rb; }
  const base={id,skip:x.skip,alvo:x.alvo,maxNivel:nivel,bank,on:true,popup:true,criadoEm:Date.now(),minOcc:x.done||0,taxaCriacao:x.rate};
  if(x.kind==='Trio') rb={...base,tipo:'trio',a:x.a,b:x.b,c:x.c};
  else if(x.kind==='Dupla') rb={...base,tipo:'dupla',a:x.a,b:x.b};
  else if(x.kind==='Número') rb={...base,tipo:'num',d:x.d};
  else if(x.kind==='Sequência') rb={...base,tipo:'seq',c:x.c,x:x.x};
  else rb={...base,tipo:'soma',n:x.n,mod:x.mod};
  RBOTS.unshift(rb); rbSave();
  if(!LIVE[bank]) LIVE[bank]=S.all.slice(-LIVE_CAP);
  return rb;
}
function rbDelete(id){ RBOTS=RBOTS.filter(r=>r.id!==id); rbSave(); fillRes(); }
function rbDeleteAll(){
  if(!RBOTS.length){ alert('Não há robôs para apagar.'); return; }
  if(!confirm(`Apagar todos os ${RBOTS.length} robô(s)? Esta ação não pode ser desfeita.`)) return;
  RBOTS=[]; rbSave(); RB_LAST_EVENT={}; RB_PENDING=[]; fillRes();
}
function rbClearLog(){ if(!confirm('Limpar o placar ao vivo de todos os robôs?')) return; RB_LOG=[]; rbSaveLog(); fillRes(); }
function rbToggle(id,k){ const rb=RBOTS.find(r=>r.id===id); if(!rb)return; rb[k]=!rb[k]; rbSave(); fillRes(); }
function rbToggleGlobal(el){ cfg.rb_popup=el.checked?1:0; saveCfg(); }
function rbPopupFechar(){ RB_OPEN_POPUP_ID=null; RB_OPEN_SIG=null; const e=$('#rbPopDPI'); if(e)e.style.display='none'; }
function rbFmtClock(t){ if(!t)return '—'; const d=new Date(t); return `${p2d(d.getHours())}:${p2d(d.getMinutes())}:${p2d(d.getSeconds())}`; }
function rbFmtDateClock(t){ if(!t)return '—'; const d=new Date(t); return `${p2d(d.getDate())}/${p2d(d.getMonth()+1)} ${rbFmtClock(t)}`; }
function rbStarts(rb,W){
  if(rb.tipo==='trio') return scTrioMap(W).get(`${rb.a}-${rb.b}-${rb.c}`)||[];
  if(rb.tipo==='dupla') return scPairMap(W).get(`${rb.a}-${rb.b}`)||[];
  if(rb.tipo==='num') return scDigitStarts(W,rb.d);
  if(rb.tipo==='seq') return scSeqMap(W,rb.x).get(`${rb.c}|${rb.x}`)||[];
  return scSumMap(W,rb.n).get(rb.mod)||[];
}
function rbGatTexto(rb,W,ti){
  if(rb.tipo==='trio') return `${W[ti-2]?.d ?? '?'} - ${W[ti-1]?.d ?? '?'} - ${W[ti]?.d ?? '?'}`;
  if(rb.tipo==='dupla') return `${W[ti-1]?.d ?? '?'} - ${W[ti]?.d ?? '?'}`;
  if(rb.tipo==='num') return `${W[ti]?.d ?? '?'}`;
  if(rb.tipo==='seq') return `${rb.x}× ${rb.c?'ÍMPAR':'PAR'}: ${W.slice(Math.max(0,ti-rb.x+1),ti+1).map(x=>x.d).join(' ')}`;
  const g=[]; for(let k=ti-rb.n+1;k<=ti;k++) if(k>=0 && W[k]?.d!=null) g.push(W[k].d);
  const s=g.reduce((a,b)=>a+b,0);
  return `${g.join(' + ')} = ${s} → final ${s%10}`;
}
// histórico com GREENS e REDS
function rbOccurrenceHistory(rb,W,limit=20){
  const rows=[], maxNivel=rbNivel(rb);
  for(const ti of rbStarts(rb,W)){
    const base=ti+1+(+rb.skip||0);
    let hit=-1;
    for(let g=0;g<=maxNivel;g++){ const idx=base+g; if(idx>=W.length) break; if(W[idx].p===rb.alvo){ hit=g; break; } }
    if(hit<0 && base+maxNivel>=W.length) continue;   // entrada ainda aberta
    const gx=hit>=0?W[base+hit]:W[base+maxNivel];
    rows.push({trig:W[ti]?.t||0,gatTexto:rbGatTexto(rb,W,ti),entrada:W[base]?.t||0,ok:hit>=0,nivel:hit>=0?NIVEL[hit]:'RED',greenT:gx?.t||0,dig:gx?.d,nums:W.slice(base,base+(hit>=0?hit:maxNivel)+1).map(x=>x.d)});
  }
  return rows.slice(-limit).reverse();
}
function rbHistoryHtml(rb,W,limit=12){
  const H=rbOccurrenceHistory(rb,W,limit);
  if(!H.length)return '<div class="nota">Ainda não há entradas fechadas nesta amostra.</div>';
  return `<div class="rbhist"><table>
    <tr><th>Gatilho</th><th>Horário gatilho</th><th>Entrada</th><th>Resultado</th><th>Números da entrada</th></tr>
    ${H.map(h=>`<tr><td style="text-align:left"><b>${h.gatTexto}</b></td><td>${rbFmtDateClock(h.trig)}</td><td>${rbFmtDateClock(h.entrada)}</td>
      <td class="${h.ok?'ok':'ruim'}"><b>${h.ok?'✅ '+h.nivel:'❌ RED'}</b></td>
      <td>${h.nums.map(d=>`<span class="b s2 ${d%2?'v':'g'}">${d}</span>`).join('')}</td></tr>`).join('')}
  </table></div>`;
}
function rbCurrentStats(rb,W){ return scEval(W,rbStarts(rb,W),rb.alvo,rb.skip,rbNivel(rb)); }
function rbCurrentTrigger(W,rb){
  if(!W.length) return null;
  const y=W.at(-1);
  if(rb.tipo==='trio'){ const x=W.at(-2),z=W.at(-3); return (z?.d===rb.a && x?.d===rb.b && y?.d===rb.c)?y:null; }
  if(rb.tipo==='dupla'){ const x=W.at(-2); return (x?.d===rb.a && y?.d===rb.b)?y:null; }
  if(rb.tipo==='num') return y?.d===rb.d?y:null;
  if(rb.tipo==='seq'){ let k=0; for(let i=W.length-1;i>=0&&W[i].p===y.p;i--) k++; return (y.p===rb.c && k===rb.x)?y:null; }
  if(W.length<rb.n) return null;
  let s=0; for(let i=W.length-rb.n;i<W.length;i++){ if(W[i].d==null) return null; s+=W[i].d; }
  return (s%10)===rb.mod?y:null;
}

// muda a janela (banco) de um robô par/ímpar existente, mantendo o mesmo mercado
async function rbSetWin(id,w){
  const rb=RBOTS.find(r=>r.id===id); if(!rb) return;
  const sym=bankSym(rb.bank)||curSym();
  rb.bank=d5BankName(+w,sym); RB_LAST_EVENT[rb.id]=null; rbSave();
  if(!LIVE[rb.bank]) LIVE[rb.bank]=await idbTail(rb.bank,LIVE_CAP);
  fillRes(); status(`Robô agora usa ${rb.bank}`,'ok');
}
function srSetE(id,E){ const r=SRB.find(x=>x.id===id); if(!r) return; r.E=+E; r._lastT=0; srSave(); fillRes(); status(`Robô de segundos agora entra no jogo de ${E}s`,'ok'); }
function rbArmSignal(rb,trig){
  if(!trig||!trig.t) return;
  const stepMs=rbStep(rb)*1000;
  const entryT=trig.t+(Math.max(0,+rb.skip||0)+1)*stepMs;
  const key=`${rb.id}|${trig.t}`;
  if(RB_PENDING.some(x=>x.key===key)) return;
  RB_PENDING.push({key,rbId:rb.id,bank:rb.bank,trigT:trig.t,trigD:trig.d,entryT,alertT:entryT-60000,stepMs,maxNivel:rbNivel(rb),alvo:rb.alvo,alerted:false,done:false});
  dmDoRobo(rb,'rb',{key:'rb|'+key,nome:rbName(rb),sym:bankSym(rb.bank),T:entryT/1000,step:stepMs/1000,maxN:rbNivel(rb),ct:rb.alvo?'DIGITODD':'DIGITEVEN'});
  RB_PENDING=RB_PENDING.filter(x=>!x.done && x.entryT>Date.now()-6*3600e3);
}
// confere o resultado ao vivo de cada sinal armado
function rbResolve(sig){
  const W=liveW(sig.bank), M=new Map(W.slice(-400).map(x=>[x.t,x]));
  const nums=[]; let hit=-1, falta=false;
  for(let g=0;g<=sig.maxNivel;g++){
    const x=M.get(sig.entryT+g*sig.stepMs);
    if(!x){ falta=true; break; }
    nums.push(x.d);
    if(x.p===sig.alvo){ hit=g; break; }
  }
  if(hit>=0) return {res:'green',nivel:hit,nums};
  if(falta) return null;
  return {res:'red',nivel:-1,nums};
}
function rbProcessPending(){
  if(!RB_PENDING.length) return;
  const now=srvNow()*1000;
  for(const sig of RB_PENDING){
    if(sig.done) continue;
    const rb=RBOTS.find(r=>r.id===sig.rbId);
    if(!rb||!rb.on){ sig.done=true; continue; }
    if(!sig.alerted && now>=sig.alertT){ sig.alerted=true; rbPopup(rb,sig); }
    const endT=sig.entryT+sig.maxNivel*sig.stepMs;
    if(now>=endT+1500){
      const r=rbResolve(sig);
      if(r || now>endT+120000){
        sig.done=true;
        RB_LOG.push({rbId:rb.id,bank:sig.bank,trigT:sig.trigT,entryT:sig.entryT,alvo:sig.alvo,res:r?r.res:'sem dado',nivel:r?r.nivel:-1,nums:r?r.nums:[]});
        rbSaveLog();
        sig.result=r||{res:'sem dado'};
        if(RB_OPEN_SIG===sig.key) rbRefreshOpenPopup();
        if(S.tab==='robos') rbLive();
      }
    }
  }
  RB_PENDING=RB_PENDING.filter(x=>!x.done||RB_OPEN_SIG===x.key);
}
function rbWatchNew(){
  if(!RBOTS.length) return;
  for(const rb of RBOTS){
    if(!rb.on) continue;
    const W=liveW(rb.bank);
    const trig=rbCurrentTrigger(W,rb);
    if(!trig) continue;
    if(srvNow()*1000-trig.t>3*rbStep(rb)*1000) continue;          // gatilho velho (ex.: veio do completar buracos)
    const ev=`${rb.id}|${trig.t}`;
    if(RB_LAST_EVENT[rb.id]===ev) continue;
    RB_LAST_EVENT[rb.id]=ev;
    rbArmSignal(rb,trig);
  }
  rbProcessPending();
}
function rbPlacar(rbId){
  const L=RB_LOG.filter(x=>x.rbId===rbId);
  const g=L.filter(x=>x.res==='green').length, r=L.filter(x=>x.res==='red').length;
  return {g,r,n:g+r,L};
}
