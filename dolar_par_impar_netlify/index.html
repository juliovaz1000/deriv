  if(!cfg.rb_popup||rb.popup===false||rb.on===false) return;
  const p=$('#rbPopDPI'); if(!p) return;
  RB_OPEN_POPUP_ID=rb.id; RB_OPEN_SIG=sig.key;
  const W=liveW(rb.bank), st=rbCurrentStats(rb,W), pl=rbPlacar(rb.id);
  const step=sig.stepMs, n=rbNivel(rb);
  p.innerHTML=`<div class="rbpc">
    <div class="rbpt">🤖 ${rbGat(rb)} ${rbBankTag(rb)}</div>
    <div class="nota">Gatilho às ${rbFmtClock(sig.trigT)} (número ${sig.trigD}) · pula ${rb.skip}</div>
    <div class="rbpbig">Entrar ${tagc(rb.alvo)} às <span id="rbEntryClock">${rbFmtClock(sig.entryT)}</span></div>
    <div id="rbCountdown" class="big"></div>
    <div class="rbsched">
      <div>🎯 TIRO SECO<b>${rbFmtClock(sig.entryT)}</b></div>
      ${n>=1?`<div>G1<b>${rbFmtClock(sig.entryT+step)}</b></div>`:''}
      ${n>=2?`<div>G2<b>${rbFmtClock(sig.entryT+2*step)}</b></div>`:''}
    </div>
    <div id="rbLiveGreen" style="display:none;margin-top:10px;padding:10px;border-radius:9px;font-size:16px;font-weight:800"></div>
    <div class="nota" style="margin-top:8px">Histórico no banco (${num(W.length)} jogos): <b>${st.done}</b> casos · SG ${st.sg} · G1 ${st.g1} · G2 ${st.g2} · RED ${st.red} · <b>${st.done?(st.rate*100).toFixed(1):'—'}%</b><br>
      Placar ao vivo deste robô: <b class="ok">${pl.g} ✅</b> · <b class="ruim">${pl.r} ❌</b></div>
    <div style="margin-top:12px"><b>📜 Últimas entradas (greens e reds)</b><div id="rbLiveHist">${rbHistoryHtml(rb,W,12)}</div></div>
    <div class="rbactions"><button onclick="rbPopupFechar()">Fechar</button>
      <button onclick="rbToggle('${rb.id}','popup');rbPopupFechar()">Desativar popup deste robô</button></div>
  </div>`;
  p.style.display='flex';
  try{ beep(); }catch(e){}
  rbRefreshOpenPopup();
}
function rbRefreshOpenPopup(){
  if(!RB_OPEN_SIG) return;
  const sig=RB_PENDING.find(x=>x.key===RB_OPEN_SIG); if(!sig) return;
  const cd=document.getElementById('rbCountdown');
  const falta=Math.ceil((sig.entryT-srvNow()*1000)/1000);
  if(cd) cd.textContent=falta>0?`⏳ faltam ${falta}s`:(sig.result?'':'🎲 em jogo…');
  const el=document.getElementById('rbLiveGreen');
  if(el && sig.result){
    const r=sig.result;
    el.style.display='block';
    el.style.border=`1px solid ${r.res==='green'?'var(--g)':'var(--v)'}`;
    el.innerHTML=r.res==='green'?`<span class="ok">✅ GREEN ${NIVEL[r.nivel]} · números ${r.nums.join(' / ')}</span>`:r.res==='red'?`<span class="ruim">❌ RED · números ${r.nums.join(' / ')}</span>`:'<span class="mu">sem dado para conferir</span>';
  }
}

// ---------- varredura "criar sozinho" ----------
function scScanFamily(W,fam,maxSkip,nivel,minOcc,cut){
  const out=[];
  const push=(base,starts)=>{
    const tr=cut?starts.filter(i=>i<cut):starts, te=cut?starts.filter(i=>i>=cut):[];
    for(let skip=0;skip<=maxSkip;skip++) for(const alvo of [0,1]){
      const s=scEval(W,tr,alvo,skip,nivel);
      if(s.done<minOcc) continue;
      const o={...base,skip,alvo,...s};
      if(cut) o.test=scEval(W,te,alvo,skip,nivel);
      out.push(o);
    }
  };
  if(fam==='somas'){
    const minN=Math.max(2,Math.min(8,+cfg.sc_sum_min||2)), maxN=Math.max(minN,Math.min(8,+cfg.sc_sum_max||5));
    for(let n=minN;n<=maxN;n++) for(const [mod,starts] of scSumMap(W,n)) push({kind:`Soma ${n}`,gat:`Σ${n}%10=${mod}`,n,mod},starts);
  }
  if(fam==='duplas') for(const [pair,starts] of scPairMap(W)){ const [a,b]=pair.split('-').map(Number); push({kind:'Dupla',pair,a,b,gat:pair},starts); }
  if(fam==='trios') for(const [trio,starts] of scTrioMap(W)){ const [a,b,c]=trio.split('-').map(Number); push({kind:'Trio',trio,a,b,c,gat:trio},starts); }
  if(fam==='numeros') for(let d=0;d<=9;d++) push({kind:'Número',d,gat:String(d)},scDigitStarts(W,d));
  if(fam==='seq'){ const mx=Math.max(1,Math.min(15,+cfg.rb_seqMax||8)); for(const [key,starts] of scSeqMap(W,mx)){ const [c,x]=key.split('|').map(Number); push({kind:'Sequência',c,x,gat:`${x}× ${c?'ÍMPAR':'PAR'}`},starts); } }
  return out;
}
function rbFind100(){
  const W=S.win;
  const t0=performance.now();
  const min=Math.max(3,+cfg.rb_auto_min||20), nivel=+cfg.rb_auto_nivel||0, maxSkip=Math.max(0,Math.min(500,+cfg.rb_auto_pulo||50));
  const fam=cfg.rb_auto_family||'ambos';
  const fams=fam==='ambos'?['somas','duplas']:fam==='tudo'?['somas','duplas','trios','numeros','seq']:[fam];
  const cut=cfg.rb_valid?Math.floor(W.length*0.7):0;
  let all=[]; for(const f of fams) all=all.concat(scScanFamily(W,f,maxSkip,nivel,min,cut));
  if(cfg.rb_auto_only100) all=all.filter(x=>x.red===0&&x.done>0);
  all.sort((a,b)=>b.rate-a.rate||b.done-a.done||a.skip-b.skip);
  RB_AUTO_RESULTS=all.slice(0,Math.max(10,Math.min(1000,+cfg.rb_auto_top||100)));
  RB_CHECKED.clear();
  const tested=all.filter(x=>x.test&&x.test.done);
  RB_AUTO_INFO={when:Date.now(),bank:cfg.bank,n:W.length,cut,ms:Math.round(performance.now()-t0),achados:all.length,
    confirmados:tested.filter(x=>x.test.red===0).length,testados:tested.length,
    mediaTeste:tested.length?tested.reduce((s,x)=>s+x.test.rate,0)/tested.length:0};
  fillRes();
}
function rbAutoSet(k,v){ cfg[k]=(v===''||isNaN(+v))?v:+v; saveCfg(); }
let RB_CHECKED=new Set();
function rbCheck(i,v){ if(v) RB_CHECKED.add(i); else RB_CHECKED.delete(i); }
function rbCreateSelected(){
  if(!RB_CHECKED.size){ alert('Marque pelo menos um padrão antes de criar.'); return; }
  let n=0;
  for(const i of RB_CHECKED){ const x=RB_AUTO_RESULTS[i]; if(x){ rbCreate(x); n++; } }
  RB_CHECKED.clear();
  liveSeed().then(()=>fillRes());
  status(`${n} robô(s) criado(s) no banco ${cfg.bank}`,'ok');
}
function rbSelectAll(v){ RB_CHECKED=new Set(v?RB_AUTO_RESULTS.map((_,i)=>i):[]); document.querySelectorAll('.rb-auto-check').forEach(e=>e.checked=v); }
function rbLive(){ const a=$('#rbCards'); if(a) a.innerHTML=rbRobotCards(); const b=$('#rbLog'); if(b) b.innerHTML=rbLogHtml(); }
function rbRobotCards(){

  return `<div class="rbgrid">${RBOTS.map(rb=>{
    const W=liveW(rb.bank), st=rbCurrentStats(rb,W), pl=rbPlacar(rb.id);
    const pend=RB_PENDING.find(s=>s.rbId===rb.id&&!s.done);
    return `<div class="rbcard ${rb.on?'':'off'}">
      <div class="rbt">${pend?'⚡ ':''}${rbName(rb)}</div>
      <div><span class="scanbadge">⏱ ${rbStep(rb)}s</span> ${rbBankTag(rb)} ${pend?`<span class="scanbadge scanhot">entrada ${rbFmtClock(pend.entryT)}</span>`:''}</div>

// =================== ⏱ ROBÔS DE SEGUNDOS ===================
// Gatilho feito com os ticks de 1s/2s que saem ANTES do jogo; entrada no jogo de 10/20/30s.
// Ex.: jogo de 20s às 12:30:20 · decisão às 12:30:16 (4s antes) · gatilho = soma dos últimos 3 ticks até 12:30:16.
let TK={sym:'',t:[],d:[],q:[],ws:null,loading:false,msg:'',lastDecT:0};
let SRB=[], SR_LOG=[], SR_SCAN=null, SR_PEND=[], SR_CHECK=new Set(), SR_ENT_CACHE=null, SR_POP_KEY=null;
function srLoadStore(){
  try{ SRB=JSON.parse(localStorage.getItem('dpi_srobos_v1')||'[]')||[]; }catch(e){ SRB=[]; }
  try{ SR_LOG=JSON.parse(localStorage.getItem('dpi_srobos_log_v1')||'[]')||[]; }catch(e){ SR_LOG=[]; }
}
function srSave(){ try{ localStorage.setItem('dpi_srobos_v1',JSON.stringify(SRB.slice(0,200))); }catch(e){} }
function srSaveLog(){ try{ localStorage.setItem('dpi_srobos_log_v1',JSON.stringify(SR_LOG.slice(-1500))); }catch(e){} }
const SR_SYMS=Object.fromEntries(SYMS_ALL.map(([k,v])=>[k,`${v} (${k})${k.startsWith('1HZ')?' · tick a cada 1s':' · tick a cada 2s'}`]));
function srMsg(m){ TK.msg=m; const e=$('#srMsg'); if(e) e.textContent=m; }
// último tick com horário ≤ t (índice)
function srAob(t){ const T=TK.t; let lo=0,hi=T.length-1,a=-1; while(lo<=hi){ const m=(lo+hi)>>1; if(T[m]<=t){a=m;lo=m+1;}else hi=m-1; } return a; }
async function srCarregar(force){
  const sym=cfg.sr_sym||'R_100', horas=+cfg.sr_horas||6;
  if(TK.loading) return; if(!force && TK.sym===sym && TK.t.length) return;
  TK.loading=true; srMsg(`Buscando ${horas}h de ticks do ${sym} na Deriv…`);
  try{
    const now=Math.floor(Date.now()/1000);
    const h=await d5Hist2(sym,now-horas*3600,now);
    const t=[],d=[],q=[];
    for(let i=0;i<h.times.length;i++){ const e=+h.times[i], dd=d5DigitFromQuote(h.prices[i]); if(dd==null) continue; if(t.length && e<=t.at(-1)) continue; t.push(e); d.push(dd); q.push(h.prices[i]); }
    TK={...TK,sym,t,d,q,lastDecT:0}; SR_ENT_CACHE=null;
    srMsg(`✅ ${num(t.length)} ticks do ${sym} (${horas}h) · ao vivo ligado`);
    srLiveConnect();
  }catch(e){ srMsg('Erro ao buscar ticks: '+(e.message||e)); }
  finally{ TK.loading=false; if(S.tab==='srob') fillRes(); }
}
async function d5Hist2(sym,a,b){
  let last;
  for(let i=0;i<5;i++){
    try{ HDL_CANCEL=false; DV_CANCEL=false; return await dvHistoryRange(sym,a,b); }
    catch(e){ last=e; if(hdlIsRateLimitError(e)){ await new Promise(r=>setTimeout(r,10000*(i+1))); continue; } try{DV_WS?.close();}catch(_){} DV_WS=null; DV_ENDPOINTS.push(DV_ENDPOINTS.shift()); await new Promise(r=>setTimeout(r,1500)); }
  }
  throw last;
}
// ao vivo: R_100 vem da captura principal; 1HZ100V abre uma conexão própria
function srLiveConnect(){
  try{ TK.ws?.close(); }catch(e){} TK.ws=null;
  if(d5Syms().includes(TK.sym) && cfg.deriv5sOn!==0) return;   // já chega pelo gerenciador central de ticks
  const urls=DV_ENDPOINTS.slice(); let pos=0;
  const abrir=()=>{
    if(pos>=urls.length){ setTimeout(srLiveConnect,5000); return; }
    let ws; try{ ws=new WebSocket(urls[pos++]); }catch(e){ abrir(); return; }
    let ok=false; const to=setTimeout(()=>{ if(!ok){ try{ws.close();}catch(e){} abrir(); } },8000);
    ws.onopen=()=>{ ok=true; clearTimeout(to); TK.ws=ws; ws.send(JSON.stringify({ticks:TK.sym,subscribe:1,req_id:77001})); };
    ws.onmessage=ev=>{ let j; try{j=JSON.parse(ev.data);}catch(e){return;} if(j.tick && j.tick.symbol===TK.sym || (j.tick && !j.tick.symbol)) srOnTick(+j.tick.epoch,+j.tick.quote); };
    ws.onerror=()=>{ if(!ok){ clearTimeout(to); abrir(); } };
    ws.onclose=()=>{ if(TK.ws===ws){ TK.ws=null; setTimeout(srLiveConnect,4000); } };
  };
  abrir();
}
function srOnTick(epoch,quote){
  if(!TK.t.length || epoch<=TK.t.at(-1)) return;
  const d=d5DigitFromQuote(quote); if(d==null) return;
  TK.t.push(epoch); TK.d.push(d); TK.q.push(quote);
  if(TK.t.length>200000){ TK.t.splice(0,20000); TK.d.splice(0,20000); TK.q.splice(0,20000); }
  srDecide(epoch); srResolve(epoch);
  if(S.tab==='srob') srLive();
}
// ---------- entradas históricas ----------
function srEntries(){
  const E=+cfg.sr_E||20, L=+cfg.sr_L||4, K=5, n=TK.t.length;
  const key=`${TK.sym}|${n}|${E}|${L}`;
  if(SR_ENT_CACHE && SR_ENT_CACHE.key===key) return SR_ENT_CACHE.A;
  const A=[]; if(n<100) return A;
  const par=T=>{ const i=srAob(T); return i<0?-1:TK.d[i]%2; };
  const RUN=new Int16Array(n); for(let i=0;i<n;i++) RUN[i]=(i&&TK.d[i]%2===TK.d[i-1]%2)?Math.min(RUN[i-1]+1,999):1;
  for(let T=Math.ceil((TK.t[K+2]+L)/E)*E; T+2*E<=TK.t.at(-1); T+=E){
    const iD=srAob(T-L), iT=srAob(T);
    if(iD<K || iT<=iD) continue;
    A.push({T,dig:TK.d.slice(iD-K+1,iD+1),run:RUN[iD],lp:TK.d[iD]%2,P:[par(T),par(T+E),par(T+2*E)],tD:TK.t[iD]});
  }
  SR_ENT_CACHE={key,A}; return A;
}
function srCond(x,e){
  const dig=e.dig;
  if(x.tipo==='seq') return e.lp===x.c && e.run===x.x;
  if(x.tipo==='trio') return dig[dig.length-3]===x.a && dig[dig.length-2]===x.b && dig[dig.length-1]===x.c;
  if(x.tipo==='dupla') return dig[dig.length-2]===x.a && dig[dig.length-1]===x.b;
  let s=0; for(let i=dig.length-x.k;i<dig.length;i++) s+=dig[i];
  return s%10===x.mod;
}
// sem sobrepor: enquanto uma entrada está aberta (TS/G1/G2), o robô não abre outra
function srEval(A,x,nivel,i0=0,i1=A.length){
  let sg=0,g1=0,g2=0,red=0;
  const K=+x.skip||0;
  for(let i=i0;i<i1;i++){
    if(!srCond(x,A[i])) continue;
    const j=i+K; if(j>=i1 || A[j].T!==A[i].T+K*(+cfg.sr_E||20)) continue;   // entrada K jogos depois
    let hit=-1; for(let g=0;g<=nivel;g++){ if(A[j].P[g]<0){hit=-2;break;} if(A[j].P[g]===x.alvo){hit=g;break;} }
    if(hit===-2) continue;
    if(hit===0)sg++; else if(hit===1)g1++; else if(hit===2)g2++; else red++;
    i=j+(hit>=0?hit:nivel);
  }
  const done=sg+g1+g2+red; return {sg,g1,g2,red,done,rate:done?(sg+g1+g2)/done:0};
}
function srNome(x){ if(x.tipo==='seq') return `Depois de ${x.x}× ${x.c?'ÍMPAR':'PAR'} seguidos · ${x.skip?`pula ${x.skip} jogo${x.skip>1?'s':''}`:'sem pular'}`; if(x.tipo==='trio') return `Trio ${x.a}-${x.b}-${x.c}`; return x.tipo==='dupla'?`Dupla ${x.a}-${x.b}`:`Σ${x.k} ${x.k>1?'últimos ticks':'último tick'} final ${x.mod}`; }
function srScan(){
  const A=srEntries(); const nivel=+cfg.sr_nivel||0;
  if(A.length<50){ SR_SCAN={erro:`Poucas entradas (${A.length}). Carregue mais horas de ticks.`}; fillRes(); return; }
  const cut=Math.floor(A.length*0.7), out=[], fam=cfg.sr_fam||'ambos', kmax=Math.max(1,Math.min(5,+cfg.sr_kmax||4));
  const combos=[];
  if(fam==='ambos'||fam==='somas'||fam==='tudo') for(let k=1;k<=kmax;k++) for(let m=0;m<10;m++) combos.push({tipo:'soma',k,mod:m});
  if(fam==='ambos'||fam==='duplas'||fam==='tudo') for(let a=0;a<10;a++) for(let b=0;b<10;b++) combos.push({tipo:'dupla',a,b});
  if(fam==='trios'||fam==='tudo') for(let a=0;a<10;a++) for(let b=0;b<10;b++) for(let c=0;c<10;c++) combos.push({tipo:'trio',a,b,c});
  if(fam==='seq'||fam==='tudo'){ const mx=Math.max(1,Math.min(15,+cfg.sr_seqMax||6)), pk=Math.max(0,Math.min(10,+cfg.sr_pulo||3));
    for(let xx=1;xx<=mx;xx++) for(const c of [0,1]) for(let sk=0;sk<=pk;sk++) combos.push({tipo:'seq',x:xx,c,skip:sk}); }
  for(const c of combos) for(const alvo of [0,1]){
    const x={...c,alvo};
    const tr=srEval(A,x,nivel,0,cut); if(tr.done<(+cfg.sr_min||20)) continue;
    const te=srEval(A,x,nivel,cut,A.length);
    out.push({...x,tr,te});
  }
  out.sort((p,q)=>q.tr.rate-p.tr.rate||q.te.rate-p.te.rate||q.tr.done-p.tr.done);
  const base=1-Math.pow(.5,nivel+1);
  SR_SCAN={when:Date.now(),n:A.length,cut,nivel,base,E:+cfg.sr_E,L:+cfg.sr_L,sym:TK.sym,
    list:out.slice(0,Math.max(10,Math.min(500,+cfg.sr_top||80))),
    media:(()=>{const f=out.filter(o=>o.te.done);return f.length?f.reduce((s,o)=>s+o.te.rate,0)/f.length:0;})()};
  SR_CHECK.clear(); fillRes();
}
function srCriar(){
  if(!SR_SCAN||!SR_CHECK.size){ alert('Marque pelo menos um padrão.'); return; }
  let n=0;
  for(const i of SR_CHECK){ const o=SR_SCAN.list[i]; if(!o) continue;
    const id=`${o.tipo}|${o.k??''}|${o.mod??''}|${o.a??''}|${o.b??''}|${o.x??''}|${o.c??''}|${o.skip??0}|${o.alvo}|${SR_SCAN.nivel}|${SR_SCAN.E}|${SR_SCAN.L}|${SR_SCAN.sym}`;
    if(SRB.some(r=>r.id===id)) continue;
    SRB.unshift({id,tipo:o.tipo,k:o.k,mod:o.mod,a:o.a,b:o.b,x:o.x,c:o.c,skip:o.skip||0,alvo:o.alvo,nivel:SR_SCAN.nivel,E:SR_SCAN.E,L:SR_SCAN.L,sym:SR_SCAN.sym,on:true,popup:true,
      criado:Date.now(),tr:o.tr,te:o.te}); n++; }
  srSave(); SR_CHECK.clear(); fillRes(); status(`${n} robô(s) de segundos criado(s)`,'ok');
}
// ---------- ao vivo ----------
function srDecide(tnow){
  const ativos=SRB.filter(r=>r.on && r.sym===TK.sym); if(!ativos.length) return;
  for(const r of ativos){
    const T=Math.floor((tnow+r.L)/r.E)*r.E;           // jogo cuja hora de decisão (T-L) já chegou
    if(T<=tnow || r._lastT===T) continue;
    if(SR_PEND.some(s=>s.rid===r.id && !s.done)) continue;   // já tem entrada aberta
    const iD=srAob(T-r.L); if(iD<5) continue;
    const dig=TK.d.slice(iD-4,iD+1);
    r._lastT=T;
    let run=1; for(let i=iD;i>0 && TK.d[i]%2===TK.d[i-1]%2;i--) run++;
    if(!srCond(r,{dig,run,lp:TK.d[iD]%2})) continue;
    const Tent=T+(+r.skip||0)*r.E;                       // pula K jogos
    const sig={key:`${r.id}|${Tent}`,rid:r.id,T:Tent,E:r.E,alvo:r.alvo,nivel:r.nivel,dig,trigT:TK.t[iD],res:[],done:false};
    SR_PEND.push(sig);
    dmDoRobo(r,'sr',{key:'sr|'+sig.key,nome:srNome(r),sym:r.sym,T:Tent,step:r.E,maxN:r.nivel,ct:r.alvo?'DIGITODD':'DIGITEVEN'});
    if(srPodePopup(r)) srPopup(r,sig);
  }
}
function srResolve(tnow){
  for(const s of SR_PEND){
    if(s.done) continue;
    while(s.res.length<=s.nivel && tnow>=s.T+s.res.length*s.E){
      const i=srAob(s.T+s.res.length*s.E); if(i<0) break;
      s.res.push({d:TK.d[i],t:TK.t[i]});
      if(TK.d[i]%2===s.alvo) break;
    }
    const last=s.res.at(-1);
    const green=last && last.d%2===s.alvo;
    if(green || s.res.length>s.nivel){
      s.done=true;
      const r=SRB.find(x=>x.id===s.rid);
      SR_LOG.push({rid:s.rid,T:s.T,E:s.E,alvo:s.alvo,trig:s.dig,res:green?'green':'red',nivel:green?s.res.length-1:-1,nums:s.res.map(x=>x.d),nome:r?srNome(r):''});
      srSaveLog();
      if(SR_POP_KEY===s.key) srPopRefresh(s);

// ---------- dados: lê só o período pedido do banco da janela/mercado (cache por banco+período+último jogo) ----------
async function uoGetData(w=uoW(),sym=uoSym(),perH=+cfg.uo_per){
  const bank=uoBank(w,sym);

  const to=Date.now()+60000, from=perH?Date.now()-perH*3600e3:0;
  const rows=await idbRange(bank,from,to);

  UO_DATA[key]=out; return out;

// ---------- estatística / confiabilidade ----------
function wilsonLB(ok,n,z=1.96){ if(!n) return 0; const p=ok/n, d=1+z*z/n; return (p+z*z/(2*n)-z*Math.sqrt(p*(1-p)/n+z*z/(4*n*n)))/d; }
function uoScore(st,p0){
  const n=st.n, ok=st.ok; if(!n) return {p:0,lb:0,adv:0,rec:null,estab:null,score:0};
  const p=ok/n, lb=wilsonLB(ok,n);
  const qr=[]; for(let i=0;i<4;i++) if(st.qn[i]>=3) qr.push(st.qok[i]/st.qn[i]);
  let estab=null; if(qr.length>=2){ const m=qr.reduce((a,b)=>a+b,0)/qr.length; const sd=Math.sqrt(qr.reduce((a,b)=>a+(b-m)*(b-m),0)/qr.length); estab=Math.max(0,Math.min(100,100-200*sd)); }
  const rec=st.qn[3]?st.qok[3]/st.qn[3]:null;
  const cl=(x,a,b)=>Math.max(a,Math.min(b,x));
  const advN=cl((lb-p0)/Math.max(0.0001,1-p0),-1,1);
  const score=45*Math.max(0,advN)+20*((estab??50)/100)+15*(rec==null?0.5:cl((rec-p0)/Math.max(0.0001,1-p0),0,1))+10*Math.min(st.run/12,1)+10*(1-Math.min(st.maxRR/3,1));
  return {p,lb,adv:lb-p0,rec,estab,score:Math.round(score)};
}
// escada TS/G1/G2 de um mercado num jogo: 1 green · 0 red · -1 sem dado (falta de dado não vira red)
function uoLadder(G,T,m,lvl){
  for(let g=0;g<=lvl;g++){ const d=gDig(G,T+g*G.step); if(d<0) return {r:-1}; if(uoWin(m,d)) return {r:1,h:g,d}; }
  return {r:0,h:-1};
}

  const t=cfg.uo_tipo||'todos', b=cfg.uo_bar;
  return UO_MK.map((m,i)=>({...m,i})).filter(m=>(t==='todos'||m.mk===t)&&(b==='todas'||b===undefined||b===''||+b===m.b));

// ---------- varredura de horários: hora (mm:ss toda hora) ou dia (hh:mm:ss todo dia) ----------
async function uoScanHorarios(D,mode,lvl,onProg){
  const G=D.G; if(!G) return null;
  const step=G.step, per=mode==='dia'?86400:3600, nOff=per/step, NM=UO_NM;
  const N=nOff*NM;
  const n=new Int32Array(N), ok=new Int32Array(N), run=new Int32Array(N), maxRun=new Int32Array(N), rr=new Int32Array(N), maxRR=new Int32Array(N);
  const lastFail=new Float64Array(N), lastT=new Float64Array(N), lastR=new Int8Array(N).fill(-1);
  const qn=new Int32Array(N*4), qok=new Int32Array(N*4);
  const span=Math.max(1,G.last-G.first);
  // começo (hora/dia local) antes do 1º jogo
  let base=G.first; if(mode==='dia'){ const d=new Date(G.first*1000); d.setHours(0,0,0,0); base=Math.floor(d.getTime()/1000); } else base=G.first-(((G.first%3600)+3600)%3600);
  const starts=[]; if(mode==='dia'){ const d=new Date(base*1000); for(let i=0;i<400;i++){ const s=Math.floor(d.getTime()/1000); if(s>G.last) break; starts.push(s); d.setDate(d.getDate()+1); } } else for(let s=base;s<=G.last;s+=3600) starts.push(s);
  const dg=new Int8Array(3);
  let t0=performance.now();

        const R=await uoScanHorarios(D,rep,f.lvl,p=>uoMsg(`⏳ Varredura ${w}s · ${rep==='dia'?'todo dia':'toda hora'} · ${(p*100).toFixed(0)}%`));

async function uoBacktest(){
  const v=id=>$('#'+id)?.value;
  const mk=v('ubMk')||'U', b=+(v('ubBar')??5), w=+(v('ubW')||uoW()), dias=Math.max(1,+(v('ubDias')||1)), lvl=+(v('ubLvl')||0);

  const from=d0.getTime(), to=from+dias*86400e3;
  cfg.uo_bt={mk,b,w,dias,lvl,hh,mm,ss,ini:ini||''}; saveCfg();
  uoMsg('⏳ Rodando backtest…');
  const rows=await idbRange(uoBank(w),from,to+3*w*1000);
  const G=gridBuild(rows,w);
  const m={mk,b}, occ=[];
  if(G){
    for(let T=Math.ceil(from/1000/w)*w;T<to/1000;T+=w){
      const dt=new Date(T*1000);
      if(hh!=='any'&&dt.getHours()!==+hh) continue;
      if(mm!=='any'&&dt.getMinutes()!==+mm) continue;
      if(ss!=='any'&&dt.getSeconds()!==+ss) continue;
      const L=uoLadder(G,T,m,lvl); if(L.r<0) continue;
      const ds=[]; for(let g=0;g<=(L.r?L.h:lvl);g++){ const i=gIdx(G,T+g*w); ds.push(G.D[i]); }
      occ.push({T,...L,ds});
    }
  }
  const rs=uoResumo(occ);
  // máxima sem pagar em tempo (entre dois greens)
  let semPag=0,lastG=null; for(const o of occ){ if(o.r){ if(lastG!=null) semPag=Math.max(semPag,o.T-lastG); lastG=o.T; } }
  const porHora=[...Array(24)].map(()=>({n:0,g:0})), porDia=new Map();
  for(const o of occ){ const d=new Date(o.T*1000); porHora[d.getHours()].n++; porHora[d.getHours()].g+=o.r; const k=d.toLocaleDateString('pt-BR'); if(!porDia.has(k)) porDia.set(k,{n:0,g:0}); const z=porDia.get(k); z.n++; z.g+=o.r; }
  // quote real de cada jogo
  const byT=new Map(rows.map(r=>[Math.round(r.t/1000),r]));
  occ.forEach(o=>{ const r=byT.get(o.T+(o.r?o.h:lvl)*w); o.q=r?.q||''; o.te=r?.te||null; });
  UO_BT={m,w,lvl,dias,from,to,occ,rs,semPag,porHora,porDia:[...porDia.entries()],filtro:'todos',bank:uoBank(w),hh,mm,ss};
  uoMsg(`✅ Backtest: ${num(occ.length)} sinais em ${uoBank(w)}`);
  fillRes();
}

// 💼 CONTA DEMO DERIV — os robôs compram contratos de 1 tick na conta DEMO (dinheiro virtual).
// Trava de segurança: só opera se a Deriv responder que a conta é virtual (is_virtual = 1 / login VRTC…).
// Com token de conta REAL nada é comprado.
// =====================================================================================
let DM={ws:null,ok:false,virt:false,loginid:'',cur:'USD',bal:null,msg:'desconectado',req:90000,pend:new Map(),orders:[],log:[],sess:{pl:0,n:0,g:0,r:0,ini:null},parado:'',
  off:0,offOk:false,rtt:null,lat:[],nObs:{},sync:{ok:0,n:0}};
// ---------- sincronia: relógio da Deriv, latência e regra do tick de saída ----------
function dmNow(){ return DM.offOk?Date.now()/1000+DM.off:srvNow(); }                       // hora do servidor da Deriv
function dmTickIv(sym){ return String(sym).startsWith('1HZ')?1:2; }       // R_* = 1 tick a cada 2s · 1HZ = a cada 1s
// tick que decide o jogo do segundo T = último tick com horário ≤ T
function dmTickAlvo(sym,T){
  const iv=dmTickIv(sym), last=D5_TICKS[sym]?.epoch;
  const ph=last!=null?(((last%iv)+iv)%iv):0;
  return T-((((T-ph)%iv)+iv)%iv);
}
// quantos ticks depois da compra sai o resultado (aprendido; começa em 1)
function dmN(sym){ const a=DM.nObs[sym]||[]; if(!a.length) return 1; const c={}; for(const x of a) c[x]=(c[x]||0)+1; return +Object.entries(c).sort((p,q)=>q[1]-p[1])[0][0]; }
function dmLat(){ if(!DM.lat.length) return 0.35; const a=[...DM.lat].sort((x,y)=>x-y); return a[Math.floor(a.length/2)]; }
// momento (hora Deriv) de ENVIAR a ordem para que a compra caia na janela certa e o tick de saída seja o tick do jogo
function dmEnvio(sym,T){
  const iv=dmTickIv(sym), alvo=dmTickAlvo(sym,T), N=dmN(sym);
  const iniJan=alvo-N*iv, fimJan=alvo-(N-1)*iv;                          // a compra precisa cair em (iniJan, fimJan]
  const mira=(iniJan+fimJan)/2 + (+cfg.dm_ajuste||0);                     // mira no meio da janela
  return {alvo,iniJan,fimJan,envio:mira-dmLat(),N,iv};
}
async function dmSyncRelogio(){
  const amostras=[];
  for(let i=0;i<3;i++){
    try{ const t0=Date.now(); const j=await dmSend({time:1},8000); const t1=Date.now(); if(j.time) amostras.push({off:j.time+0.5-(t0+t1)/2000,rtt:(t1-t0)/1000}); }catch(e){}
  }
  if(!amostras.length) return;
  amostras.sort((a,b)=>a.rtt-b.rtt);
  DM.off=amostras[0].off; DM.rtt=amostras[0].rtt; DM.offOk=true;
  if(!DM.lat.length) DM.lat.push(Math.max(0.05,DM.rtt/2));
}

function dmAbrir(url){
  return new Promise((res,rej)=>{

    ws.onopen=()=>{ clearTimeout(to); DM.ws=ws; res(); };
    ws.onerror=()=>{ clearTimeout(to); rej(new Error('falha de conexão')); };
    ws.onclose=()=>{ if(DM.ws===ws){ DM.ws=null; DM.ok=false; dmSet('desconectado da Deriv'); if(S.tab==='demo') fillRes(); } };
    ws.onmessage=ev=>{
      let j; try{ j=JSON.parse(ev.data); }catch(e){ return; }

    };
  });
}

    if((cfg.dm_galeModo||'auto')==='auto' && o.ratio) stake=(o.perda+dmStake0()*o.ratio)/o.ratio;       // recupera as perdas + o lucro da 1ª entrada
    else stake=dmStake0()*Math.pow(+cfg.dm_mult||2.1,g);
  }
  stake=Math.max(0.35,Math.round(stake*100)/100);
  const maxS=+cfg.dm_maxStake||0; if(maxS>0 && stake>maxS){ o.estado='parado'; dmAddLog({...o,res:'não enviada',obs:`stake ${stake} acima do máximo ${maxS}`,stake,profit:0,nivel:g}); return; }
  const params={amount:stake,basis:'stake',contract_type:o.ct,currency:DM.cur||'USD',duration:1,duration_unit:'t'};
  params[DM.novo?'underlying_symbol':'symbol']=o.sym;                 // API nova usa underlying_symbol
  if(o.barrier!=null) params.barrier=String(o.barrier);
  const J=dmEnvio(o.sym,o.T+g*o.step);

    else try{ j=await dmSend({buy:1,price:stake,parameters:params}); }
    catch(e){ if(!DM.novo) throw e; DM.buyProp=true; const p=await dmSend({proposal:1,...params}); j=await dmSend({buy:p.proposal.id,price:stake}); }   // API nova pode exigir proposta antes
    const b=j.buy||{};

    dmAddLog({...o,res:'erro',obs:t.erro,stake,profit:0,nivel:g});
  }
}
function dmPoc(c){
  if(!c.is_sold && c.status!=='won' && c.status!=='lost') return;
  for(const o of DM.orders){
    const t=o.tent.find(x=>x.cid===c.contract_id); if(!t||t.fim) continue;
    t.fim=true; t.profit=+c.profit; t.exitT=+(c.exit_tick_time||c.date_expiry||0); t.exitQ=c.exit_tick??c.exit_tick_display_value??'';
    t.entryT=+(c.entry_tick_time||0);
    if(!t.pt) t.pt=+(c.purchase_time||c.date_start||0);
    // aprende a regra: quantos ticks entre a compra e o tick de saída
    if(t.pt && t.exitT){ const iv=dmTickIv(o.sym); const n=Math.round((t.exitT-dmTickAlvo(o.sym,t.pt))/iv); if(n>=1&&n<=5){ (DM.nObs[o.sym]=DM.nObs[o.sym]||[]).push(n); if(DM.nObs[o.sym].length>12) DM.nObs[o.sym].shift(); } }
    t.certo=t.exitT===t.alvo; DM.sync.n++; if(t.certo) DM.sync.ok++;
    // o dígito do tick de saída bateu com o jogo gravado no banco?
    const jb=liveW(d5BankName(o.step,o.sym)).slice(-400).find(x=>x.t===(o.T+t.g*o.step)*1000);
    const dSaida=t.exitQ!==''?d5DigitFromQuote(t.exitQ,o.sym):null;
    t.bateu=jb&&dSaida!=null?(jb.d===dSaida):null; t.dJogo=jb?jb.d:null; t.dSaida=dSaida;
    const won=t.profit>0;
    DM.sess.pl+=t.profit; won?DM.sess.g++:DM.sess.r++;
    if(o.es) try{ esResultado(o,t,won); }catch(e){ console.warn('estratégia',e); }
    dmAddLog({...o,res:won?'green':'red',nivel:t.g,stake:t.stake,profit:t.profit,cid:t.cid,exitT:t.exitT,exitQ:t.exitQ,entryT:t.entryT,planT:o.T+t.g*o.step,alvo:t.alvo,pt:t.pt,certo:t.certo,bateu:t.bateu,dJogo:t.dJogo,dSaida:t.dSaida});
    if(won){ o.estado='green'; }
    else{ o.perda+=t.stake; if(t.g<o.maxN){ o.g=t.g+1; o.estado='aguardando'; } else o.estado='red'; }
    dmHeader(); if(S.tab==='demo') dmLive();
  }
}
// relógio das ordens: envia cada tentativa no instante calculado para o tick de saída ser o tick do jogo
setInterval(()=>{
  if(!DM.orders.length) return;
  const now=dmNow();
  for(const o of DM.orders){
    if(o.estado!=='aguardando') continue;
    const Tg=o.T+o.g*o.step, J=dmEnvio(o.sym,Tg);
    if(now>=J.envio){
      // modo estrito: se já passou do ponto de acertar o tick do jogo, não entra
      if((cfg.dm_estrito??1) && now+dmLat()>J.fimJan-0.15){ o.estado='perdido'; dmAddLog({...o,res:'não enviada',obs:`sem tempo para acertar o tick ${hmsOf(J.alvo)} (${o.g?'G'+o.g:'TS'}) — modo estrito`,stake:0,profit:0,nivel:o.g,planT:Tg,alvo:J.alvo}); continue; }
      if(!(cfg.dm_estrito??1) && now>Tg+1){ o.estado='perdido'; dmAddLog({...o,res:'não enviada',obs:`perdeu o horário (${hmsOf(Tg)})`,stake:0,profit:0,nivel:o.g}); continue; }
      const m=dmPodeOperar(o); if(m){ o.estado='parado'; dmAddLog({...o,res:'não enviada',obs:m,stake:0,profit:0,nivel:o.g}); continue; }
      dmComprar(o);
    }
  }
  DM.orders=DM.orders.filter(o=>!['green','red','erro','perdido','parado'].includes(o.estado)||Date.now()-o.criado<60000);
},50);

    const ti = i; let res = null, nivel = 0;
    for (let l = 0; l <= G; l++) {
      const idx = ti + 1 + l; if (idx >= n) { res = 'aberto'; break; }
      const st = cfg.bt_stake * Math.pow(cfg.bt_mult, l); if (st > maxStake) maxStake = st;
      if (C[idx] === X) { bal += st * pay; res = 'green'; nivel = l; lv[l]++; i = idx - 1; break; }
      bal -= st; if (l === G) { res = 'red'; red++; nivel = l; i = idx - 1; }
    }
    if (res === 'aberto') break;
    if (res === 'green') rs = 0; else { rs++; if (rs > maxrs) maxrs = rs; }
    if (bal > peak) peak = bal; if (peak - bal > dd) dd = peak - bal;
    curve.push(+bal.toFixed(2)); E.push({ t: W[ti].t, id: W[ti].id, X, res, nivel, bal });
  }
  const ent = E.length, gr = ent - red;
  const be = G === 0 ? 1 / (1 + pay) : null;
  S._curve = curve;
  return `<div class="cards">
    ${card('Entradas', num(ent), `janela de ${num(n)} ticks`)}
    ${card('Greens', `<span class="ok">${num(gr)}</span>`, lv.map((v, l) => (l ? 'G' + l : 'SG') + ': ' + v).join(' · '))}
    ${card('Reds', `<span class="ruim">${num(red)}</span>`, 'maior sequência de reds: ' + maxrs)}
    ${card('Assertividade', pct(gr, ent), be ? 'empate com payout ' + cfg.bt_payout + '%: ' + (be * 100).toFixed(1) + '%' : 'acaso até G' + G + ': ' + ((1 - Math.pow(.5, G + 1)) * 100).toFixed(1) + '%')}
    ${card('Resultado', `<span class="${bal >= 0 ? 'ok' : 'ruim'}">${bal.toFixed(2)}</span>`, 'em unidades de stake')}
    ${card('Maior rebaixamento', dd.toFixed(2), 'maior stake usada: ' + maxStake.toFixed(2))}
  </div>
  <div class="panel"><h3>Curva da banca virtual</h3><div style="height:260px"><canvas id="btc"></canvas></div></div>
  <div class="panel"><h3>Últimas 60 entradas</h3><div class="tw"><table><tr><th>Horário</th><th>Tick</th><th>Entrada</th><th>Resultado</th><th>Banca</th></tr>
    ${E.slice(-60).reverse().map(e => `<tr><td>${fmtT(e.t)}</td><td>#${e.id}</td><td>${tagc(e.X)}</td><td class="${e.res === 'green' ? 'ok' : 'ruim'}">${e.res === 'green' ? '✅ ' + (e.nivel ? 'G' + e.nivel : 'SG') : '❌ red'}</td><td>${e.bal.toFixed(2)}</td></tr>`).join('')}
  </table></div></div>`;
}, after() {
  const cv = $('#btc'); if (!cv || !window.Chart) return;
  if (S.chart) S.chart.destroy();
  const d = S._curve || [0];
  S.chart = new Chart(cv, { type: 'line', data: { labels: d.map((_, i) => i), datasets: [{ data: d, borderColor: d.at(-1) >= 0 ? '#19b85a' : '#e53935', borderWidth: 1.5, pointRadius: 0, fill: false }] },

} };

// ---- 🧮 Aleatoriedade ----
VIEWS.rng = { nome: '🧮 Aleatoriedade', res() {
  const W = S.win, C = S.C, n = C.length; if (n < 30) return vazio();
  const par = C.filter(c => c === 0).length;
  const zP = (par - n / 2) / Math.sqrt(n / 4);
  const dc = Array(10).fill(0); for (const x of W) if (x.d != null) dc[x.d]++;
  const dn = dc.reduce((a, b) => a + b, 0), e = dn / 10;
  const chi = dn ? dc.reduce((s, o) => s + (o - e) ** 2 / e, 0) : 0;
  const R = runs(C).length, n1 = n - par, n2 = par;
  const mu = 2 * n1 * n2 / n + 1, va = 2 * n1 * n2 * (2 * n1 * n2 - n) / (n * n * (n - 1));
  const zR = (R - mu) / Math.sqrt(va);
  let same = 0; for (let i = 1; i < n; i++) if (C[i] === C[i - 1]) same++;
  const zS = (same - (n - 1) / 2) / Math.sqrt((n - 1) / 4);
  const RL = new Array(n); for (let i = 0; i < n; i++) RL[i] = i && C[i] === C[i - 1] ? RL[i - 1] + 1 : 1;
  let cond = '';
  for (let k = 1; k <= 10; k++) { let a = 0, t = 0; for (let i = 0; i < n - 1; i++) if (RL[i] >= k) { t++; if (C[i + 1] !== C[i]) a++; } if (t < 20) break; const z = (a - t / 2) / Math.sqrt(t / 4); cond += `<tr><td>${k}+ iguais</td><td>${num(t)}</td><td>${pct(a, t)}</td><td class="${p2(z) < 0.05 ? 'ruim' : 'ok'}">${p2(z).toFixed(3)}</td></tr>`; }
  const lin = (nome, val, p, txt) => `<tr><td>${nome}</td><td>${val}</td><td class="${p < 0.05 ? 'ruim' : 'ok'}">${p.toFixed(3)}</td><td style="text-align:left">${p < 0.05 ? '⚠️ desvio estatístico — confirme numa janela maior' : '✔ consistente com sorteio aleatório'}</td></tr>`;
  return `<div class="panel"><h3>Testes de aleatoriedade da janela <small>(${num(n)} ticks)</small></h3><table>
    <tr><th>Teste</th><th>Valor</th><th>p-valor</th><th style="text-align:left">Leitura</th></tr>
    ${lin('Par × ímpar (50/50)', pct(par, n) + ' par', p2(zP))}
    ${dn ? lin('Dígitos 0–9 (qui²)', chi.toFixed(2), chiP(chi, 9)) : ''}
    ${lin('Corridas (runs test)', `${num(R)} sequências · esperado ${mu.toFixed(0)}`, p2(zR))}
    ${lin('Repete a cor anterior', pct(same, n - 1), p2(zS))}
  </table><div class="nota">p-valor abaixo de 0,05 aparece de vez em quando por puro acaso (1 em cada 20 testes). O que importa é o desvio se repetir em janelas diferentes.</div></div>
  <div class="panel"><h3>A cor vira depois de k iguais?</h3><table><tr><th>Situação</th><th>Casos</th><th>Virou a cor</th><th>p-valor</th></tr>${cond}</table>
  <div class="nota">Se o gerador for aleatório, "virou a cor" fica perto de 50% em qualquer k — sequência longa não aumenta a chance da cor oposta.</div></div>`;
} };

// =================== 🧠 INTELIGÊNCIA ===================
// Analisa automaticamente o histórico dos relatórios (CF1, CF2, IL)
// e devolve diagnóstico: o que causou red, padrões perigosos e
// nível de confiança dos próximos sinais.

(function(){
// ---- helpers internos ----
function iaAllLogs(){
  const c1=(typeof CF!=='undefined'?CF.log:[]).filter(x=>x.res==='green'||x.res==='red').map(x=>({...x,_src:'CF1'}));
  const c2=(typeof CF2!=='undefined'?CF2.log:[]).filter(x=>x.res==='green'||x.res==='red').map(x=>({...x,_src:'CF2'}));
  const il=(typeof IL!=='undefined'?Object.values(IL.log).flat():[]).filter(x=>x.res==='green'||x.res==='red').map(x=>({...x,_src:'IL'}));
  return [...c1,...c2,...il].sort((a,b)=>a.T0-b.T0);
}

function iaSeqs(L){
  // retorna array de sequências: {cor, len, inicio, fim, items}
  const seqs=[]; let cur=null;
  for(const x of L){
    if(!cur||cur.cor!==x.res){ if(cur) seqs.push(cur); cur={cor:x.res,len:1,inicio:x.T0,fim:x.T0,items:[x]}; }
    else{ cur.len++; cur.fim=x.T0; cur.items.push(x); }
  }
  if(cur) seqs.push(cur);
  return seqs;
}

// Detecta se a entrada tinha excesso de confirmação (muitas fontes apontando)
// ---- soma dos últimos 5 resultados antes de cada sinal ----
function iaSoma5(L,idx){
  // soma de greens nos 5 resultados anteriores ao índice idx (0–5)
  const pre=L.slice(Math.max(0,idx-5),idx);
  return pre.reduce((s,x)=>s+(x.res==='green'?1:0),0);
}

function iaSomaGrupos(L){
  // anota cada entrada com _soma5 e agrupa por valor
  const La=L.map((x,i)=>({...x,_soma5:iaSoma5(L,i)}));
  const grupos={};
  for(const x of La){
    const k=x._soma5;
    if(!grupos[k]) grupos[k]={soma:k,n:0,greens:0};
    grupos[k].n++; if(x.res==='green') grupos[k].greens++;
  }
  return {
    grupos:Object.values(grupos).sort((a,b)=>a.soma-b.soma).map(g=>({...g,taxa:g.n?g.greens/g.n:0})),
    La
  };
}

function iaSomaAnalise(L){
  // análise completa: soma atual, coincidências históricas, alerta
  if(L.length<3) return null;
  const somaAtual=iaSoma5(L,L.length); // soma dos últimos 5
  const {grupos}=iaSomaGrupos(L);
  const MARGEM=1;
  const coincidentes=grupos.filter(g=>Math.abs(g.soma-somaAtual)<=MARGEM);
  const totalCasos=coincidentes.reduce((s,g)=>s+g.n,0);
  const totalGreens=coincidentes.reduce((s,g)=>s+g.greens,0);
  const taxaCoincid=totalCasos?totalGreens/totalCasos:null;
  // só é relevante com >=5 casos coincidentes
  const relevante=totalCasos>=5;
  return {somaAtual,grupos,coincidentes,totalCasos,taxaCoincid,relevante};
}

function iaNivelConf(x){
  const f=x.fontes||0; const ap=x.apoio0||x.n100||0; const c=x.contra||0;
  const forca=x.forca||0;
  if(forca>=5||ap>=8||f>=5) return 'excessiva';
  if(forca>=3||ap>=5||f>=3) return 'alta';
  if(forca>=1||ap>=2||f>=1) return 'normal';
  return 'baixa';
}

function iaCausaRed(x){
  const causas=[];
  const seqAntes=(x._seqAntesTam||0);
  if(seqAntes>=3) causas.push(`sequência de ${seqAntes} greens antes`);
  if(iaNivelConf(x)==='excessiva') causas.push('excesso de confirmação');
  if((x.contra||0)>=3) causas.push(`${x.contra} sinais contra`);
  if((x.nivel!=null&&x.nivel<0)&&(x.gMax||0)>=3) causas.push('forçou até gale alto');
  const minuto=x.T0?new Date(x.T0).getMinutes():-1;
  if([0,15,30,45].includes(minuto)) causas.push('entrada em minuto "cheio" (00/15/30/45)');
  if(x.red2) causas.push('entrada já sinalizada como arriscada (red2)');
  return causas.length?causas:['sem causa clara identificada'];
}

function iaProximoNivel(L){
  // Avalia se os próximos sinais estão num ambiente confiável ou perigoso
  if(!L.length) return {nivel:'sem dados',score:0,motivos:[]};
  const recentes=L.slice(-20);
  const ultimos5=L.slice(-5);
  const gr5=ultimos5.filter(x=>x.res==='green').length;
  const rd5=ultimos5.filter(x=>x.res==='red').length;
  const seqs=iaSeqs(L); const ultima=seqs.at(-1);
  const motivos=[];
  let score=50; // 0=perigoso 100=confiável

  // sequência atual de green aumenta confiança mas com ressalva
  if(ultima&&ultima.cor==='green'){
    if(ultima.len>=5){ score-=15; motivos.push(`⚠ ${ultima.len} greens seguidos — risco de virada`); }
    else if(ultima.len>=3){ score+=5; motivos.push(`✅ ${ultima.len} greens seguidos — momento bom`); }
  }
  // sequência atual de red → cautela mas pode ser oportunidade
  if(ultima&&ultima.cor==='red'){
    if(ultima.len>=3){ score-=20; motivos.push(`🔴 ${ultima.len} reds seguidos — evitar entrar agora`); }
    else{ score-=5; motivos.push(`⚠ Último resultado foi red`); }
  }
  // taxa nos últimos 5
  if(gr5>=4){ score+=10; motivos.push(`✅ ${gr5}/5 greens recentes`); }
  else if(rd5>=3){ score-=15; motivos.push(`🔴 ${rd5}/5 reds recentes`); }

  // excesso de confiança nos últimos reds
  const reds=recentes.filter(x=>x.res==='red');
  const redsExcesso=reds.filter(x=>iaNivelConf(x)==='excessiva').length;
  if(redsExcesso>=2){ score-=10; motivos.push(`⚠ ${redsExcesso} reds recentes com excesso de confirmação — padrão perigoso`); }

  // taxa geral
  const totR=recentes.length; const grR=recentes.filter(x=>x.res==='green').length;
  const taxaR=totR?grR/totR:0;
  if(taxaR>=0.75) { score+=8; motivos.push(`📈 Taxa recente: ${(taxaR*100).toFixed(0)}%`); }
  else if(taxaR<0.5) { score-=8; motivos.push(`📉 Taxa recente: ${(taxaR*100).toFixed(0)}%`); }

  // ---- soma dos últimos 5 ----
  const sa=iaSomaAnalise(L);
  let somaInfo=null;
  if(sa&&sa.relevante&&sa.taxaCoincid!=null){
    const pct=(sa.taxaCoincid*100).toFixed(0);
    const label=`soma ${sa.somaAtual}/5`; // ex: "soma 3/5"
    if(sa.taxaCoincid>=0.70){
      score+=12; motivos.push(`🔢 Padrão soma ${sa.somaAtual}/5 → ${pct}% greens (${sa.totalCasos} casos) — padrão FAVORÁVEL`);
    } else if(sa.taxaCoincid>=0.55){
      score+=5; motivos.push(`🔢 Padrão soma ${sa.somaAtual}/5 → ${pct}% greens (${sa.totalCasos} casos)`);
    } else if(sa.taxaCoincid<0.40){
      score-=12; motivos.push(`🔢 Padrão soma ${sa.somaAtual}/5 → ${pct}% greens (${sa.totalCasos} casos) — padrão DESFAVORÁVEL`);
    } else {
      motivos.push(`🔢 Padrão soma ${sa.somaAtual}/5 → ${pct}% greens (${sa.totalCasos} casos)`);
    }
    somaInfo=sa;
  }

  score=Math.max(0,Math.min(100,score));
  const nivel=score>=70?'confiável':score>=45?'moderado':'perigoso';
  return {nivel,score,motivos,somaInfo};
}

function iaResumo(L){
  const n=L.length; if(!n) return null;
  const greens=L.filter(x=>x.res==='green');
  const reds=L.filter(x=>x.res==='red');
  const taxa=greens.length/n;
  const seqs=iaSeqs(L);
  const maxG=Math.max(0,...seqs.filter(s=>s.cor==='green').map(s=>s.len));
  const maxR=Math.max(0,...seqs.filter(s=>s.cor==='red').map(s=>s.len));
  // Anotar seq antes de cada entrada
  let seqAntes=0; let corAntes=null;
  const Lanotado=L.map(x=>{ const sa=corAntes===x.res?0:seqAntes; const r={...x,_seqAntesTam:corAntes&&corAntes!==x.res?seqAntes:0}; if(corAntes!==x.res){corAntes=x.res;seqAntes=1;}else{seqAntes++;} return r; });
  // causas dos reds
  const redsCausas=Lanotado.filter(x=>x.res==='red').map(x=>({T0:x.T0,_src:x._src,causas:iaCausaRed(x),conf:iaNivelConf(x)}));
  // padrão: red após sequência de greens
  const redAposSeq=redsCausas.filter(x=>x.causas.some(c=>c.startsWith('sequência')));
  // padrão: excesso de confirmação
  const redExcesso=redsCausas.filter(x=>x.conf==='excessiva');
  // melhor cenário: onde o green aconteceu
  const bonsGreens=greens.filter(x=>(x.nivel>=0&&x.nivel<=1));
  return {n,greens:greens.length,reds:reds.length,taxa,maxG,maxR,redsCausas,redAposSeq,redExcesso,bonsGreens,Lanotado};
}

// ---- memória localStorage ----
const IA_MEM_KEY='dpi_ia_memoria_v1';
const IA_MEM_MAX=30;

function iaMemLer(){ try{ return JSON.parse(localStorage.getItem(IA_MEM_KEY)||'[]')||[]; }catch(e){ return []; } }

function iaMemSalvar(R,prox){
  if(!R||!R.n) return;
  // lê dados CFA se disponível
  let cfaBestAp='—',cfaBestH='—',cfaBestF='—';
  try{
    if(typeof cfaRows==='function'){
      const rows=cfaRows();
      if(rows.length>=5){
        const best=(G,rot)=>{ const b=G.filter(g=>g.n>=5).sort((a,b2)=>b2.g2/b2.n-a.g2/a.n||a.media-b2.media)[0]; return b?`${rot(b.k)}(${(100*b.g2/b.n).toFixed(0)}%)`:null; };
        cfaBestAp=best(cfaGrupo(rows,r=>cfaFaixa(r.ap)),k=>k+' sinais')||'—';
        cfaBestH=best(cfaGrupo(rows,r=>new Date(r.T).getHours()),k=>String(k).padStart(2,'0')+'h')||'—';
        cfaBestF=best(cfaGrupo(rows,r=>r.fontes),k=>k+' fontes')||'—';
      }
    }
  }catch(e){}
  const seqs=iaSeqs(R.Lanotado||[]); const ultima=seqs.at(-1);
  const snap={
    T:Date.now(),
    n:R.n,
    greens:R.greens,
    reds:R.reds,
    taxa:+R.taxa.toFixed(4),
    score:prox.score,
    nivel:prox.nivel,
    seqAtual:ultima?`${ultima.len}x ${ultima.cor}`:'—',
    cfaBestAp,cfaBestH,cfaBestF,
    redExcesso:R.redExcesso.length,
    redAposSeq:R.redAposSeq.length
  };
  const arr=iaMemLer();

}

// ---- RELATÓRIO CONTRÁRIO (baseado no log histórico da Inteligência) ----
function iaContrarioPainel(L){
  if(!L||!L.length) return '';
  // Entradas com excesso de confirmação
  const excessivas = L.filter(x => iaNivelConf(x) === 'excessiva');
  if(excessivas.length < 3) return '';

  // Normal: resultados reais das entradas com excesso
  const normGreen = excessivas.filter(x => x.res === 'green').length;
  const normRed   = excessivas.filter(x => x.res === 'red').length;
  const normTot   = excessivas.length;
  const normTaxa  = (100 * normGreen / normTot).toFixed(0);

  // Contrário: inverter todos os resultados
  const invGreen = normRed;   // os reds virariam greens
  const invRed   = normGreen; // os greens virariam reds
  const invTaxa  = (100 * invGreen / normTot).toFixed(0);

  const normCol = normGreen/normTot >= 0.6 ? 'var(--g)' : normGreen/normTot >= 0.4 ? 'var(--am)' : 'var(--v)';
  const invCol  = invGreen/normTot >= 0.6 ? 'var(--g)' : invGreen/normTot >= 0.4 ? 'var(--am)' : 'var(--v)';

  // Detalhamento por fonte (agrupando por _src)
  const fontes = {};
  for(const x of excessivas){
    const src = x._src || '?';
    if(!fontes[src]) fontes[src] = {green:0, red:0};
    if(x.res==='green') fontes[src].green++; else fontes[src].red++;
  }
  const fontesRows = Object.entries(fontes).sort((a,b)=>(b[1].green+b[1].red)-(a[1].green+a[1].red)).map(([src,v])=>{
    const tot = v.green + v.red;
    const taxa = (100*v.green/tot).toFixed(0);
    const taxaCol = v.green/tot >= 0.6 ? 'var(--g)' : v.green/tot >= 0.4 ? 'var(--am)' : 'var(--v)';
    const invT = (100*v.red/tot).toFixed(0);
    const invTCol = v.red/tot >= 0.6 ? 'var(--g)' : v.red/tot >= 0.4 ? 'var(--am)' : 'var(--v)';
    return `<tr>
      <td style="font-size:12px">${src}</td>
      <td style="text-align:center">${tot}</td>
      <td style="text-align:center;color:${taxaCol};font-weight:700">${taxa}%</td>
      <td style="text-align:center">${v.green}✅ / ${v.red}❌</td>
      <td style="text-align:center;color:${invTCol};font-weight:700">${invT}%</td>
      <td style="text-align:center">${v.red}✅ / ${v.green}❌</td>
    </tr>`;
  }).join('');

  const conselho = invGreen/normTot > normGreen/normTot + 0.1
    ? `<div style="border:1px solid var(--g);background:rgba(34,197,94,.08);border-radius:10px;padding:10px 14px;margin-top:10px">✅ <b>O contrário teria sido melhor!</b> Com excesso de confirmação, entrar na direção oposta daria <b>${invGreen} greens (${invTaxa}%)</b> vs ${normGreen} greens (${normTaxa}%) da direção normal. Considere entrar ao contrário quando houver excesso.</div>`
    : invGreen/normTot < normGreen/normTot - 0.1
    ? `<div style="border:1px solid var(--v);background:rgba(239,68,68,.05);border-radius:10px;padding:10px 14px;margin-top:10px">❌ <b>O contrário seria pior.</b> A direção normal com excesso de confirmação ainda deu <b>${normGreen} greens (${normTaxa}%)</b> vs ${invGreen} greens ao contrário (${invTaxa}%). Excesso aqui não é armadilha.</div>`
    : `<div style="border:1px solid var(--am);background:rgba(245,197,24,.07);border-radius:10px;padding:10px 14px;margin-top:10px">⚖️ <b>Resultado similar nos dois sentidos.</b> Normal: ${normGreen} greens (${normTaxa}%) · Contrário: ${invGreen} greens (${invTaxa}%). O excesso de confirmação não é um sinal confiável em nenhuma das direções.</div>`;

  return `<div class="panel" style="border-color:#f59e0b;background:linear-gradient(135deg,rgba(245,158,11,.06),var(--p1))">
    <h3>🔄 Relatório Contrário — entradas com excesso de confirmação</h3>
    <p style="font-size:13px;color:var(--mu);margin:0 0 12px">Analisa as <b>${normTot} entradas</b> registradas com <b>excesso de confirmação</b>. "Ao contrário" = entrar na cor oposta ao sinal.</p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px">
      <div style="background:var(--p2);border:1px solid var(--bd);border-radius:10px;padding:12px;text-align:center">
        <div style="font-size:11px;color:var(--mu);margin-bottom:4px">🎯 Direção normal (sinal original)</div>
        <div style="font-size:28px;font-weight:900;color:${normCol}">${normTaxa}%</div>
        <div style="font-size:12px;color:var(--mu)">${normGreen} greens · ${normRed} reds</div>
      </div>
      <div style="background:var(--p2);border:1px solid var(--bd);border-radius:10px;padding:12px;text-align:center">
        <div style="font-size:11px;color:var(--mu);margin-bottom:4px">🔄 Ao contrário (direção oposta)</div>
        <div style="font-size:28px;font-weight:900;color:${invCol}">${invTaxa}%</div>
        <div style="font-size:12px;color:var(--mu)">${invGreen} greens · ${invRed} reds</div>
      </div>
    </div>
    ${fontesRows?`<div class="tw" style="margin-bottom:10px"><table>
      <tr><th>Fonte</th><th>Total</th><th>Taxa normal</th><th>Green/Red normal</th><th>Taxa contrário</th><th>Green/Red contrário</th></tr>
      ${fontesRows}
    </table></div>`:''}
    ${conselho}
  </div>`;
}

// ---- painel CFA integrado ----
function iaCfaPainel(){
  if(typeof cfaRows!=='function') return '';
  let rows;
  try{ rows=cfaRows(); }catch(e){ return ''; }
  if(!rows||rows.length<5) return `<div class="panel"><h3>📊 CFA — Dados das Confluências</h3><div class="nota">Mínimo de 5 entradas para análise CFA (${rows?rows.length:0} até agora).</div></div>`;

  const best=(G,rot)=>{
    const b=G.filter(g=>g.n>=5).sort((a,b)=>b.g2/b.n-a.g2/a.n||a.media-b.media)[0];
    return b?{label:rot(b.k),pct:(100*b.g2/b.n).toFixed(0),n:b.n,media:b.media.toFixed(2)}:null;
  };
  const porAp=cfaGrupo(rows,r=>cfaFaixa(r.ap)).sort((a,b)=>{const O=['3','4','5','6–7','8–10','11–15','16+']; return O.indexOf(a.k)-O.indexOf(b.k);});
  const porH=cfaGrupo(rows,r=>new Date(r.T).getHours()).sort((a,b)=>a.k-b.k);
  const porF=cfaGrupo(rows,r=>r.fontes).sort((a,b)=>a.k-b.k);
  const porCor=cfaGrupo(rows,r=>r.alvo);
  const bestAp=best(porAp,k=>k+' sinais');
  const bestH=best(porH,k=>String(k).padStart(2,'0')+'h');
  const bestF=best(porF,k=>k+' fontes');
  const bestCor=best(porCor,k=>k?'ÍMPAR':'PAR');

  const mkCard=(titulo,b)=>b?
    `<div style="background:var(--p2);border:1px solid var(--bd);border-radius:10px;padding:10px 12px">
      <div style="font-size:11px;color:var(--mu);margin-bottom:2px">${titulo}</div>
      <div style="font-size:16px;font-weight:700;color:var(--g)">${b.label}</div>
      <div style="font-size:12px;color:var(--mu)">${b.pct}% até G2 · ${b.n} entradas · gale médio ${b.media}</div>

  // tabela nº confirmações
  const tblAp=porAp.map(g=>{
    const pct=(100*g.g2/g.n).toFixed(0);
    const col=g.g2/g.n>=0.85?'var(--g)':g.g2/g.n>=0.70?'var(--am)':'var(--v)';
    return `<tr><td><b>${g.k} sinais</b></td><td>${g.n}</td><td style="color:${col}"><b>${pct}%</b></td><td>${g.red}</td><td>${g.media.toFixed(2)}</td></tr>`;
  }).join('');
  // tabela hora
  const tblH=porH.map(g=>{
    const pct=(100*g.g2/g.n).toFixed(0);
    const col=g.g2/g.n>=0.85?'var(--g)':g.g2/g.n>=0.70?'var(--am)':'var(--v)';
    return `<tr><td><b>${String(g.k).padStart(2,'0')}h</b></td><td>${g.n}</td><td style="color:${col}"><b>${pct}%</b></td><td>${g.red}</td></tr>`;
  }).join('');

  return `<div class="panel" style="border-color:var(--az)">
    <h3>📊 CFA — Condições mais favoráveis (lido ao vivo)</h3>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-bottom:14px">
      ${mkCard('🏆 Melhor faixa de apoio',bestAp)}
      ${mkCard('🕐 Melhor hora',bestH)}
      ${mkCard('📡 Melhor nº de fontes',bestF)}
      ${mkCard('🎯 Cor que mais green',bestCor)}
    </div>
    <div class="grid2">
      <div>
        <b style="font-size:12px;color:var(--mu)">Por nº de confirmações</b>
        <div class="tw" style="max-height:220px;margin-top:6px"><table>
          <tr><th>Confirmações</th><th>Entradas</th><th>até G2</th><th>Reds</th><th>Gale médio</th></tr>
          ${tblAp}
        </table></div>
      </div>
      <div>
        <b style="font-size:12px;color:var(--mu)">Por hora do dia</b>
        <div class="tw" style="max-height:220px;margin-top:6px"><table>
          <tr><th>Hora</th><th>Entradas</th><th>até G2</th><th>Reds</th></tr>

    <div class="nota" style="margin-top:8px">💡 Use essas condições para filtrar quando entrar: prefira horas e faixas de apoio com alta taxa até G2.</div>
  </div>`;
}

// ---- relatório hora a hora ----
function iaRelatorioPorHora(L){
  if(!L.length) return '';

  // agrupa por hora
  const porHora={};
  for(const x of L){
    const h=x.T0?new Date(x.T0).getHours():-1;
    if(h<0) continue;
    if(!porHora[h]) porHora[h]={h,E:[],n:0,greens:0,reds:0};
    porHora[h].E.push(x); porHora[h].n++;
    x.res==='green'?porHora[h].greens++:porHora[h].reds++;
  }
  const horas=Object.values(porHora).sort((a,b)=>a.h-b.h);

  for(const H of horas){
    H.E.sort((a,b)=>a.T0-b.T0);
    H.taxa=H.greens/H.n;
    // tiro seco: resultado isolado (viz. anterior e posterior de cor diferente ou ausentes)
    H.tiroSecoG=0; H.tiroSecoR=0;
    for(let i=0;i<H.E.length;i++){
      const prev=i>0?H.E[i-1].res:null;
      const next=i<H.E.length-1?H.E[i+1].res:null;
      const iso=(prev===null||prev!==H.E[i].res)&&(next===null||next!==H.E[i].res);
      if(iso) H.E[i].res==='green'?H.tiroSecoG++:H.tiroSecoR++;
    }
    H.tiroSeco=H.tiroSecoG+H.tiroSecoR;
    // sequências internas à hora
    const seqs=iaSeqs(H.E);
    H.maxSeqG=Math.max(0,...seqs.filter(s=>s.cor==='green').map(s=>s.len));
    H.maxSeqR=Math.max(0,...seqs.filter(s=>s.cor==='red').map(s=>s.len));
    // fontes da hora
    const fsrc=[...new Set(H.E.map(x=>x._src))].join(',');
    H.fsrc=fsrc;
  }

  const comDados=horas.filter(h=>h.n>=2);
  const rankTaxa=[...comDados].sort((a,b)=>b.taxa-a.taxa);
  const melhor=rankTaxa[0]; const pior=rankTaxa.at(-1);

  // totalizadores
  const totN=horas.reduce((s,h)=>s+h.n,0);
  const totG=horas.reduce((s,h)=>s+h.greens,0);
  const totR=horas.reduce((s,h)=>s+h.reds,0);
  const totTS=horas.reduce((s,h)=>s+h.tiroSeco,0);
  const maxSeqGGlobal=Math.max(0,...horas.map(h=>h.maxSeqG));
  const maxSeqRGlobal=Math.max(0,...horas.map(h=>h.maxSeqR));

  // linha de cada hora
  const linhas=horas.map(H=>{
    const taxaCor=H.taxa>=0.65?'var(--g)':H.taxa<0.45?'var(--v)':'var(--am)';
    const destMelhor=melhor&&H.h===melhor.h?'background:rgba(34,197,94,.08);outline:1px solid rgba(34,197,94,.3);':'';
    const destPior=pior&&H.h===pior.h&&pior.h!==melhor?.h?'background:rgba(239,68,68,.07);outline:1px solid rgba(239,68,68,.25);':'';
    const tag=melhor&&H.h===melhor.h?`<span class="ia-badge-safe">★ melhor</span>`:
              pior&&H.h===pior.h&&H.n>=2?`<span class="ia-badge-risk">▼ pior</span>`:'';
    const seqGTag=H.maxSeqG>=3?`<span style="color:var(--g);font-size:11px">+${H.maxSeqG}🟢</span>`:`${H.maxSeqG}`;
    const seqRTag=H.maxSeqR>=3?`<span style="color:var(--v);font-size:11px;font-weight:700">${H.maxSeqR}🔴!</span>`:`${H.maxSeqR}`;
    const tsTag=H.tiroSeco>0?`<span style="font-size:11px">${H.tiroSecoG>0?`<span style="color:var(--g)">${H.tiroSecoG}G</span>`:''}${H.tiroSecoR>0?`<span style="color:var(--v);margin-left:3px">${H.tiroSecoR}R</span>`:''}</span>`:'—';
    return `<tr style="${destMelhor||destPior}">
      <td style="text-align:center;font-weight:700">${String(H.h).padStart(2,'0')}h</td>
      <td style="text-align:center">${H.n}</td>
      <td style="text-align:center;color:var(--g)">${H.greens}</td>
      <td style="text-align:center;color:var(--v)">${H.reds}</td>
      <td style="text-align:center;font-weight:700;color:${taxaCor}">${(H.taxa*100).toFixed(0)}%</td>
      <td style="text-align:center">${seqGTag}</td>
      <td style="text-align:center">${seqRTag}</td>
      <td style="text-align:center">${tsTag}</td>
      <td style="text-align:center;font-size:11px;color:var(--mu)">${H.fsrc}</td>
      <td style="text-align:center">${tag}</td>
    </tr>`;
  }).join('');

  // linha de totais
  const totTaxa=totN?totG/totN:0;
  const totTaxaCor=totTaxa>=0.65?'var(--g)':totTaxa<0.45?'var(--v)':'var(--am)';
  const rodape=`<tr style="font-weight:700;border-top:2px solid var(--bd)">
    <td style="text-align:center">TOTAL</td>
    <td style="text-align:center">${totN}</td>
    <td style="text-align:center;color:var(--g)">${totG}</td>
    <td style="text-align:center;color:var(--v)">${totR}</td>
    <td style="text-align:center;color:${totTaxaCor}">${(totTaxa*100).toFixed(0)}%</td>
    <td style="text-align:center;color:var(--g)">${maxSeqGGlobal}</td>
    <td style="text-align:center;color:var(--v)">${maxSeqRGlobal}</td>
    <td style="text-align:center">${totTS}</td>
    <td></td><td></td>
  </tr>`;

  // destaques melhor/pior
  const mBox=melhor?`<div style="border:1px solid var(--g);background:rgba(34,197,94,.07);border-radius:8px;padding:10px 14px">
    <b>🏆 Melhor hora: ${String(melhor.h).padStart(2,'0')}h</b> — ${melhor.n} entradas · taxa <b style="color:var(--g)">${(melhor.taxa*100).toFixed(0)}%</b>
    · máx seq. green: ${melhor.maxSeqG} · seq. red: ${melhor.maxSeqR} · tiros secos: ${melhor.tiroSeco}
  </div>`:'' ;
  const pBox=pior&&pior.h!==melhor?.h?`<div style="border:1px solid var(--v);background:rgba(239,68,68,.06);border-radius:8px;padding:10px 14px;margin-top:6px">
    <b>🛑 Pior hora: ${String(pior.h).padStart(2,'0')}h</b> — ${pior.n} entradas · taxa <b style="color:var(--v)">${(pior.taxa*100).toFixed(0)}%</b>
    · máx seq. green: ${pior.maxSeqG} · seq. red: ${pior.maxSeqR} · tiros secos: ${pior.tiroSeco}
  </div>`:'';

  return `<div class="panel" id="ia-hora-painel">
    <h3>⏰ Relatório hora a hora <span style="font-size:12px;font-weight:400;color:var(--mu)">${horas.length} horas com entradas</span></h3>
    <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:12px">${mBox}${pBox}</div>
    <div class="tw"><table>
      <tr>
        <th>Hora</th><th>Entradas</th><th style="color:var(--g)">Green</th><th style="color:var(--v)">Red</th>
        <th>Taxa</th><th title="Maior sequência de greens seguidos nesta hora">Seq.G</th>
        <th title="Maior sequência de reds seguidos nesta hora">Seq.R</th>
        <th title="Tiro seco = resultado isolado, sem vizinhos da mesma cor">Tiro seco</th>
        <th>Fontes</th><th></th>
      </tr>
      ${linhas}
      ${rodape}
    </table></div>
    <div class="nota" style="margin-top:8px">
      <b>Tiro seco</b> = resultado isolado — nem o anterior nem o próximo têm a mesma cor (G=green isolado, R=red isolado).<br>
      <b>Seq.G/R</b> = maior sequência consecutiva de greens ou reds dentro daquela hora.<br>
      ★ melhor = maior taxa de green (mín. 2 entradas) · ▼ pior = menor taxa de green.
    </div>
  </div>`;
}

// ---- painel: padrão de soma dos últimos 5 ----
function iaSomaPainel(sa,grupos){
  const MARGEM=1;
  const somaAtual=sa?sa.somaAtual:null;

  // barra visual de distribuição
  const maxN=Math.max(1,...grupos.map(g=>g.n));
  const linhas=grupos.map(g=>{
    const isCurr=somaAtual!=null&&Math.abs(g.soma-somaAtual)<=MARGEM;
    const taxaCor=g.taxa>=0.65?'var(--g)':g.taxa<0.45?'var(--v)':'var(--am)';
    const barW=Math.round(100*g.n/maxN);
    const alerta=isCurr&&g.n>=5&&(g.taxa>=0.70||g.taxa<0.40);
    const alertTag=alerta?`<span style="font-size:10px;padding:1px 5px;border-radius:4px;background:${g.taxa>=0.70?'rgba(34,197,94,.2)':'rgba(239,68,68,.2)'};color:${taxaCor};margin-left:4px">${g.taxa>=0.70?'✅ favorável':'🛑 desfavorável'}</span>`:'';
    return `<tr style="${isCurr?`background:rgba(168,85,247,.08);outline:1px solid rgba(168,85,247,.35);`:''}">
      <td style="text-align:center;font-weight:${isCurr?'900':'400'};color:${isCurr?'#a855f7':'inherit'}">${g.soma}/5 ${isCurr?'◀':''}</td>
      <td style="text-align:center">${g.n}</td>
      <td style="text-align:center;color:${taxaCor};font-weight:700">${(g.taxa*100).toFixed(0)}%</td>
      <td style="text-align:center">${g.greens} green / ${g.n-g.greens} red</td>
      <td><div style="height:10px;background:var(--p2);border-radius:4px;overflow:hidden"><div style="width:${barW}%;height:100%;background:${taxaCor};border-radius:4px"></div></div></td>
      <td>${alertTag}</td>
    </tr>`;
  }).join('');

  // resumo do momento atual
  let alertHtml='';
  if(sa&&sa.relevante&&sa.taxaCoincid!=null){
    const pct=(sa.taxaCoincid*100).toFixed(0);
    const cor=sa.taxaCoincid>=0.65?'var(--g)':sa.taxaCoincid<0.45?'var(--v)':'var(--am)';
    const bg=sa.taxaCoincid>=0.65?'rgba(34,197,94,.07)':sa.taxaCoincid<0.45?'rgba(239,68,68,.07)':'rgba(245,197,24,.07)';
    const ico=sa.taxaCoincid>=0.65?'📈':sa.taxaCoincid<0.45?'📉':'📊';
    alertHtml=`<div style="border:1px solid ${cor};background:${bg};border-radius:10px;padding:12px;margin-bottom:10px">
      <b>${ico} Padrão atual — soma ${sa.somaAtual}/5</b><br>
      <span style="font-size:13px">Com esta soma <span style="color:var(--mu)">(±1)</span> foram encontradas
      <b>${sa.totalCasos} entradas históricas</b> com taxa de <b style="color:${cor};font-size:16px">${pct}%</b> de green.<br>
      ${sa.taxaCoincid>=0.70?'<b>Padrão altamente favorável</b> — historicamente este contexto converte bem.':
        sa.taxaCoincid<0.40?'<b>Padrão desfavorável</b> — historicamente este contexto tem alta taxa de red.':
        'Padrão neutro — taxa próxima à média.'}
      </span>
    </div>`;
  } else if(sa&&!sa.relevante&&somaAtual!=null){
    alertHtml=`<div class="nota">Soma atual: <b>${somaAtual}/5</b> — ainda poucos casos históricos com esta soma (${sa.totalCasos} casos ±1). Dados insuficientes para predição confiável.</div>`;
  }

  return `<div class="panel" style="border-color:#a855f7">
    <h3>🔢 Padrão de Soma — Últimos 5 Resultados <span style="font-size:12px;font-weight:400;color:var(--mu)">contexto histórico antes de cada sinal</span></h3>
    ${alertHtml}
    <div class="nota" style="margin-bottom:8px">Para cada sinal registrado, conta-se quantos <b>greens ocorreram nos 5 resultados anteriores</b> (soma 0–5). A tabela mostra qual padrão pré-sinal gerou mais greens.</div>
    ${grupos.length?`<div class="tw"><table>
      <tr><th>Soma pré-sinal</th><th>Entradas</th><th>Taxa green</th><th>Detalhes</th><th style="width:120px">Freq.</th><th>Alerta</th></tr>
      ${linhas}
    </table></div>`:`<div class="nota">Dados insuficientes para análise de soma.</div>`}
    <div class="nota" style="margin-top:8px">▶ A linha com <span style="color:#a855f7;font-weight:700">◀</span> é a soma atual dos últimos 5 resultados. Margem de ±1 usada para coincidências.</div>
  </div>`;
}

  const R=iaResumo(L);
  const prox=iaProximoNivel(L);
  const corNivel=prox.nivel==='confiável'?'var(--g)':prox.nivel==='moderado'?'var(--am)':'var(--v)';
  const ultimos=L.slice(-10).reverse();

  // scoreBar

  // causas dos reds
  const causaMap={};
  for(const rd of R.redsCausas) for(const c of rd.causas){ causaMap[c]=(causaMap[c]||0)+1; }
  const causasOrdem=Object.entries(causaMap).sort((a,b)=>b[1]-a[1]);

  // greens que deram bem (TS ou G1)
  const melhorCenario=R.bonsGreens.length?`<div class="dvconfirmed"><b>✅ Melhor cenário de entrada</b> — ${R.bonsGreens.length} entradas resolvidas em TS/G1 (${(100*R.bonsGreens.length/R.greens).toFixed(0)}% dos greens):

    </ul></div>`:'';

  // ---- análise de soma (calcula uma vez) ----
  const somaAnalise=iaSomaAnalise(L);
  const {grupos:somaGrupos}=iaSomaGrupos(L);

  // últimas 10 entradas — com destaque por nível IA + coluna soma pré-sinal
  // ultimos = L.slice(-10).reverse() → ultimos[0] é o mais recente = L[L.length-1]
  // ultimos[ri] corresponde ao índice real L[L.length-1-ri]
  const ulHtml=ultimos.map((x,ri)=>{
    const ok=x.res==='green';
    const conf=iaNivelConf(x);
    // classificação da linha
    const segura=ok&&(conf==='normal'||conf==='baixa');
    const risco=!ok||(ok&&conf==='excessiva');
    const trClass=segura?'ia-segura':risco?'ia-risco':'';
    // badge na coluna de confiança
    const badgeCls=conf==='normal'||conf==='baixa'?'ia-badge-safe':conf==='alta'?'ia-badge-mod':'ia-badge-risk';
    const badge=`<span class="${badgeCls}">${conf}</span>`;
    // dica rápida de segurança
    const dica=segura?`<span class="ia-badge-safe">🛡 entrada segura</span>`:
                conf==='excessiva'&&ok?`<span class="ia-badge-risk">⚠ excesso</span>`:'';
    // soma dos 5 resultados ANTES deste sinal
    const realIdx=L.length-1-ri; // índice no array L
    const s5=iaSoma5(L,realIdx);  // calcula soma[0..realIdx-1]
    const s5g=somaGrupos.find(g=>g.soma===s5);
    const s5Cor=s5g?(s5g.taxa>=0.65?'var(--g)':s5g.taxa<0.45?'var(--v)':'var(--am)'):'var(--mu)';
    const s5Title=s5g?`${s5g.n} casos históricos com esta soma · taxa ${(s5g.taxa*100).toFixed(0)}%`:'poucos dados';
    const s5Badge=`<span title="${s5Title}" style="font-size:11px;font-weight:700;color:${s5Cor};cursor:default">${s5}/5</span>`;
    return `<tr class="${trClass}">
      <td style="color:var(--mu);font-size:11px">${x.T0?hmsOf(x.T0/1000):'—'}</td>
      <td><span class="tag ${ok?'g':'v'}">${ok?'GREEN':'RED'}</span></td>
      <td>${x._src}</td>
      <td>${x.alvo!=null?(x.alvo?'ÍMPAR':'PAR'):'—'}</td>
      <td>${badge}</td>
      <td style="text-align:center">${s5Badge}</td>
      <td style="font-size:11px">${ok?dica:(iaCausaRed(x).join(', '))}</td></tr>`;
  }).join('');

  // salvar snapshot na memória (executa ao renderizar a aba)
  iaMemSalvar(R,prox);

  const horaHtml=iaRelatorioPorHora(L);

  return `
  <div style="display:flex;justify-content:flex-end;gap:8px;margin-bottom:8px;flex-wrap:wrap">
    <button onclick="window.iaExportarDados&&window.iaExportarDados()" style="display:flex;align-items:center;gap:6px;padding:7px 16px;border-radius:8px;border:1px solid #22c55e;background:rgba(34,197,94,.1);color:#22c55e;font-size:13px;font-weight:600;cursor:pointer">
      📤 Exportar dados
    </button>
    <button onclick="window.iaImportarDados&&window.iaImportarDados()" style="display:flex;align-items:center;gap:6px;padding:7px 16px;border-radius:8px;border:1px solid #f59e0b;background:rgba(245,158,11,.1);color:#f59e0b;font-size:13px;font-weight:600;cursor:pointer">
      📥 Importar dados
    </button>
    <button onclick="window.iaGerarPDF&&window.iaGerarPDF()" style="display:flex;align-items:center;gap:6px;padding:7px 16px;border-radius:8px;border:1px solid #a855f7;background:rgba(168,85,247,.1);color:#a855f7;font-size:13px;font-weight:600;cursor:pointer">

    </button>
  </div>
  <div id="ia-relatorio-pdf">
  <div class="panel" style="border-color:#a855f7;background:linear-gradient(135deg,rgba(168,85,247,.08),var(--p1))">
    <h3>🧠 Inteligência — Análise dos Relatórios</h3>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px">
      ${card('Entradas analisadas',String(R.n),`${R.greens} greens · ${R.reds} reds`)}
      ${card('Taxa geral',`<span style="color:${taxaCol}">${taxaPct}%</span>`,`máx ${R.maxG} greens seguidos`)}
      ${card('Máx. reds seguidos',`<span class="ruim">${R.maxR}</span>`,R.maxR>=3?'⚠ Risco alto':'Dentro do normal')}
      ${card('Fontes analisadas',L.map(x=>x._src).filter((v,i,a)=>a.indexOf(v)===i).join(' · '),`CF1 + CF2 + Interligado`)}
    </div>
  </div>

  <div class="panel" style="border-color:${corNivel}">
    <h3>📡 Momento atual — próximos sinais</h3>
    <div style="font-size:22px;font-weight:900;color:${corNivel};margin-bottom:4px">${prox.nivel.toUpperCase()} <span style="font-size:14px;font-weight:400;color:var(--mu)">(score ${prox.score}/100)</span></div>
    ${scoreBar}
    <div style="display:flex;flex-direction:column;gap:5px;margin-top:10px">
      ${prox.motivos.map(m=>`<div style="padding:6px 10px;border-radius:8px;background:var(--p2);border:1px solid var(--bd);font-size:13px">${m}</div>`).join('')}
    </div>
  </div>

  <div class="grid2">
  <div class="panel">
    <h3>🔴 O que causou os reds?</h3>
    ${R.redsCausas.length?`
    <table style="margin-top:4px">
      <tr><th style="text-align:left">Causa identificada</th><th>Ocorrências</th><th>% dos reds</th></tr>
      ${causasOrdem.map(([c,qt])=>`<tr><td>${c}</td><td style="text-align:center"><b>${qt}</b></td><td style="text-align:center">${(100*qt/R.reds).toFixed(0)}%</td></tr>`).join('')}

    <div class="nota" style="margin-top:8px">

      ${R.redAposSeq.length?`⚠ <b>${R.redAposSeq.length} reds</b> ocorreram após uma sequência de greens — cuidado com euforia.<br>`:''}
    </div>`:'<div class="nota">Nenhum red registrado ainda.</div>'}
  </div>

  <div class="panel">
    <h3>✅ O que deu certo?</h3>
    ${melhorCenario||'<div class="nota">Dados insuficientes para análise de boas entradas.</div>'}
    ${R.greens>0?`<div class="nota" style="margin-top:8px">
      🏆 <b>${R.bonsGreens.length} de ${R.greens}</b> greens resolvidos logo (TS ou G1) — ideal para entrar com confiança.<br>
      Condições mais frequentes nos greens: <b>${(()=>{ const g=L.filter(x=>x.res==='green'); const imp=g.filter(x=>x.alvo).length; return imp>g.length-imp?'ÍMPAR':'PAR'; })()}</b> como alvo predominante.
    </div>`:''}
  </div>

  <div class="panel">
    <h3>🕐 Últimas 10 entradas analisadas</h3>
    <div class="tw" style="max-height:320px">
      <table>
        <tr><th>Hora</th><th>Resultado</th><th>Fonte</th><th>Alvo</th><th>Confiança</th><th title="Soma de greens nos 5 resultados antes do sinal (0–5)">Soma 5</th><th style="text-align:left">Causa do red</th></tr>
        ${ulHtml}

  </div>

  <div class="panel">
    <h3>💡 Recomendações para próximas entradas</h3>
    <div style="display:flex;flex-direction:column;gap:8px">
      ${prox.nivel==='perigoso'?`<div class="dvbad">🛑 <b>Evite entrar agora.</b> O histórico recente mostra padrão de instabilidade. Espere pelo menos 3 greens consecutivos antes de retomar.</div>`:''}
      ${prox.nivel==='moderado'?`<div style="border:1px solid var(--am);background:rgba(245,197,24,.07);border-radius:10px;padding:12px">⏳ <b>Momento moderado.</b> Entre com cautela, preferindo sinais com baixa ou normal confirmação — excessos de confirmação têm falhado.</div>`:''}

      ${R.maxR>=3?`<div class="dvbad">⚠ O máximo de reds seguidos chegou a <b>${R.maxR}</b> — sua estratégia precisa suportar essa variação na banca.</div>`:''}
      ${R.redExcesso.length>=2?`<div style="border:1px solid rgba(239,68,68,.4);background:rgba(239,68,68,.05);border-radius:10px;padding:12px">⚠ <b>Excesso de confirmação falhou ${R.redExcesso.length} vezes.</b> Quando todas as fontes apontam igual, é sinal de armadilha — prefira entradas com 2–4 fontes, não mais.</div>`:''}
      ${R.bonsGreens.length>=3?`<div class="dvconfirmed">💡 <b>Entradas que resolvem em TS/G1</b> são o seu melhor cenário (${R.bonsGreens.length} ocorrências). Não aumente gale além do G1 — a taxa de recuperação no G2+ é menor.</div>`:''}

  ${iaHistoricoHtml()}

}

// ---- Exportar / Importar localStorage ----
function iaExportarDados(){
  try{
    const dados={};
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k) dados[k]=localStorage.getItem(k);
    }
    const qtd=Object.keys(dados).length;
    const json=JSON.stringify({_versao:1,_exportado:new Date().toISOString(),_total:qtd,dados},null,0);
    const blob=new Blob([json],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    const dt=new Date().toISOString().replace(/[:.]/g,'-').slice(0,19);
    a.download=`dpi_backup_${dt}.json`;
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); },1000);
    alert(`✅ Exportados ${qtd} registros!\n\nSalve o arquivo .json e importe-o no outro PC abrindo o HTML e clicando em 📥 Importar.`);
  }catch(e){
    alert('❌ Erro ao exportar: '+e.message);
  }
}

  if (Date.now() - SROB_REVAL > 10 * 60 * 1000) srobRevalidar(bank);

    const st = srobStarts(W, s.rb, M); if (st.at(-1) !== W.length - 1) continue;
    const key = s.uid + '|' + last.t; if (SROB_SIG.some(g => g.key === key)) continue;
    if (SROB_SIG.some(g => g.uid === s.uid && !g.done)) continue;   // uma entrada aberta por robô

}
// robôs de horário: armam a entrada 60s antes do horário
function srobArmTempo() {

  if (saiu) setTimeout(() => srobFillSlots(bank, true), 100);
  for (const s of SROB_SLOTS) {
    if (!s.rb || (s.estado !== 'ativo' && s.estado !== 'dormindo') || !srobTempo(s.rb)) continue;
    if (SROB_SIG.some(g => g.uid === s.uid && !g.done)) continue;
    const T = srobNextT(s.rb, now - 1); if (T - now > 60) continue;
    const key = s.uid + '|' + T * 1000; if (SROB_SIG.some(g => g.key === key)) continue;

      trigT: Date.now(), entryT: T * 1000, dorm: s.estado === 'dormindo', res: [], done: false };
    SROB_SIG.push(sig);
    if (!sig.dorm) {
      srobLog(`⚡ Robô ${s.id + 1}: ENTRAR ${sig.alvo ? 'ÍMPAR' : 'PAR'} às ${hmsOf(T)} (${srobNome(s.rb)})`, 'evt');

function srobResolvePending() {

    if (g.done) continue;
    const W = liveW(g.bank) || [], M = new Map(); for (let i = Math.max(0, W.length - 300); i < W.length; i++) M.set(W[i].t, W[i]);
    let hit = -1, falta = false; g.res = [];

    if (hit >= 0) res = 'green'; else if (!falta) res = 'red'; else if (now > g.entryT + g.nivel * g.step + 120000) res = 'sem dado';
    if (!res) continue;
    g.done = true; g.out = res; g.nv = hit; g.fimT = Date.now(); mudou = true;
    const s = SROB_SLOTS.find(x => x.uid === g.uid);
    if (res === 'sem dado') { srobLog(`… Robô ${g.slot + 1}: sem dado para conferir ${hmsOf(g.entryT / 1000)}`, 'evt'); continue; }
    if (!g.dorm) srobLog(`${res === 'green' ? '✅ GREEN ' + NIVEL[hit] : '❌ RED'} · robô ${g.slot + 1} · ${hmsOf(g.entryT / 1000)} · ${g.res.join(' / ')}`, res === 'green' ? 'g' : 'r');
    if (!g.dorm) srobResAdd({ T: g.entryT, slot: g.slot + 1, nome: g.nome, fam: s && s.rb ? srobFam(s.rb) + (s.rb.modo === 'red' ? ' · ' + ({ R: 'vindo de red', RG: 'red+green', RRG: '2 red+green', HP2: 'retomada 2h', HP3: 'retomada 3h' })[s.rb.rm || 'R'] : '') : '', alvo: g.alvo, res, nv: hit, nivel: g.nivel, ds: g.res.slice(), bank: g.bank });
    if (s) srobProcessResult(s.id, res);
